<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5a54f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goobs-Games">
<meta name="description" content="A little arcade of offline puzzle games.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="shared/goobs.css">
<script src="shared/goobs.js"></script>
<title>Goobs-Games</title>
<style>
.menu { gap: 12px; align-items: stretch; }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo svg { width: 40px; height: 40px; flex: none; border-radius: 11px; box-shadow: 0 4px 10px -4px rgba(90,84,240,.6); }
.logo h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.5px; color: var(--ink); white-space: nowrap; }
.hello { margin: -6px 2px 0; font-size: 15px; color: var(--muted); font-weight: 500; }
.section h2 { margin: 4px 2px 10px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .8px; text-transform: uppercase; }
.continue {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 18px; border: 0; text-align: left;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 10px 22px -12px var(--accent);
  transition: transform .1s;
}
.continue:active { transform: scale(.98); }
.continue .art { width: 46px; height: 46px; border-radius: 12px; overflow: hidden; flex: none; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
.continue .art svg { width: 100%; height: 100%; display: block; }
.continue .kp { min-width: 0; }
.continue em { display: block; font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; opacity: .8; }
.continue b { display: block; font-size: 17px; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.continue small { display: block; font-size: 12px; font-weight: 600; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.continue .play { margin-left: auto; font-size: 15px; font-weight: 800; background: rgba(255,255,255,.95); color: var(--accent); border-radius: 12px; padding: 8px 14px; flex: none; }
/* compact game tiles: 2 across, small art on the left, so about 8 fit on one screen */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.gtile {
  position: relative; display: flex; align-items: center; gap: 10px; border-radius: 18px; padding: 8px 24px 8px 8px; text-align: left; min-height: 76px;
  border: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); transition: transform .1s; min-width: 0;
}
.gtile:active { transform: scale(.97); }
.gtile .art { width: 58px; height: 58px; flex: none; border-radius: 13px; overflow: hidden; }
.gtile .art svg { width: 100%; height: 100%; display: block; }
.gtile .tinfo { min-width: 0; }
.gtile b { display: block; font-size: 15px; font-weight: 750; letter-spacing: -.2px; line-height: 1.2; }
.gtile small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; font-weight: 500; color: var(--muted); line-height: 1.25; margin-top: 2px; }
.gtile .star {
  position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: none;
  display: grid; place-items: center; font-size: 17px; line-height: 1; color: #aab0bf; padding: 0;
}
.gtile .star.on { color: #f5a300; }
.soon { box-shadow: none; border: 2px dashed var(--line-strong); background: transparent; justify-content: center; text-align: center; padding: 8px; }
.soon .tinfo { text-align: center; }
.soon b { font-size: 14px; color: var(--muted); }
.soon small { margin-top: 2px; }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 4px; }
</style>
</head>
<body>
<div class="app menu">
  <div class="top">
    <div class="logo">
      <svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b5cff"/><stop offset="1" stop-color="#a45cff"/></linearGradient></defs>
        <rect width="100" height="100" fill="url(#lg)"/><rect x="22" y="22" width="25" height="25" rx="7" fill="#fff"/><rect x="53" y="22" width="25" height="25" rx="7" fill="#fff" fill-opacity=".62"/>
        <rect x="22" y="53" width="25" height="25" rx="7" fill="#fff" fill-opacity=".62"/><circle cx="65.5" cy="65.5" r="13" fill="#ffc53d"/></svg>
      <h1>Goobs-Games</h1>
    </div>
    <div class="topbtns">
      <button class="iconbtn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><use href="shared/animals.svg#i-gear"/></svg></button>
    </div>
  </div>

  <p class="hello" id="hello">Puzzles for two.</p>
  <div class="section" id="secContinue"></div>
  <div class="section" id="secFavs"></div>
  <div class="section"><h2 id="allTitle">All games</h2><div class="grid" id="gridAll"></div></div>
  <div class="foot" id="foot">Goobs-Games</div>
</div>

<!-- Settings -->
<div class="overlay" id="ovSettings">
  <div class="sheet" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <div class="sheetbody">
      <div class="themelabel">Theme (all games)</div>
      <div class="themes" id="themes"></div>
      <label class="row"><div>Old-time ads<small>Joke vintage ads between rounds in every game. Each game sets how often in its own settings.</small></div>
        <span class="switch"><input type="checkbox" id="setAds"><span></span></span></label>
      <div class="version" id="version">Goobs-Games</div>
    </div>
    <div class="actions"><button class="btn red" id="btnCloseSettings">Done</button></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function readLS(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function todayNum() { var d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }

  // ---------- the games (ids stay the same so saved progress carries over) ----------
  function cube(x, y, s, col) { // an isometric cube with top-left-right faces
    function p(pts, k) { return '<path d="M' + pts.join(' L') + 'Z" fill="' + col + '"' + (k ? ' style="filter:brightness(' + k + ')"' : '') + ' stroke="rgba(0,0,0,.25)" stroke-width=".8" stroke-linejoin="round"/>'; }
    return p([[x - s, y], [x, y + s / 2], [x, y + 1.5 * s], [x - s, y + s]], .82) + p([[x + s, y], [x, y + s / 2], [x, y + 1.5 * s], [x + s, y + s]], .66) + p([[x, y - s / 2], [x + s, y], [x, y + s / 2], [x - s, y]]);
  }
  var GAMES = [
    {
      id: 'zoodoku', name: 'Zoodoku', blurb: 'Animal logic puzzle', path: 'games/zoodoku/',
      art: '<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#f4f1fb"/>' + (function () {
          var cols = ['#e4adaa', '#e0bf90', '#dfd293', '#b1cb98', '#8fbfb6', '#a5c3de', '#c4b5e1', '#e6bbd5'];
          var pen = [0, 0, 1, 1, 2, 0, 3, 1, 2, 4, 3, 5, 6, 4, 7, 5], h = '', an = { 1: 'squirrel', 7: 'dog', 8: 'cat', 14: 'penguin' };
          for (var i = 0; i < 16; i++) {
            var x = 9 + (i % 4) * 20.8, y = 9 + Math.floor(i / 4) * 20.8;
            h += '<rect x="' + x + '" y="' + y + '" width="19" height="19" rx="3" fill="' + cols[pen[i]] + '"/>';
            if (an[i]) h += '<use href="shared/animals.svg#z-' + an[i] + '" x="' + (x + 1) + '" y="' + (y + 1) + '" width="17" height="17"/>';
          }
          return h;
        })() + '</svg>',
      status: function () {
        var m = readLS('zoodoku.meta');
        if (!m || !m.level) return 'Start at level 1';
        return 'Level ' + m.level + ' · ' + (m.daily && m.daily[todayNum()] ? 'daily done' : 'daily waiting');
      }
    },
    {
      id: 'woodpile', name: 'Woodpile', blurb: 'Wooden block puzzle', path: 'games/woodpile/',
      art: '<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#f3ebe0"/>' +
        '<rect x="7" y="7" width="86" height="86" rx="8" fill="#e8dcc8"/><g transform="translate(9.5 9.5)">' + (function () {
          var on = { 0: 1, 1: 1, 2: 1, 9: 1, 11: 1, 20: 1, 24: 1, 25: 1, 30: 1, 31: 1, 32: 1, 33: 1, 34: 1, 38: 1, 42: 1, 43: 1, 44: 1, 52: 1, 60: 1, 61: 1, 70: 1, 72: 1, 73: 1, 80: 1 };
          var h = '';
          for (var i = 0; i < 81; i++) {
            var r = Math.floor(i / 9), c = i % 9, alt = (Math.floor(r / 3) + Math.floor(c / 3)) % 2, x = c * 9.0, y = r * 9.0;
            h += '<rect x="' + (x + .4) + '" y="' + (y + .4) + '" width="8.2" height="8.2" rx="1.6" fill="' + (alt ? '#f7efe2' : '#fffaf2') + '"/>';
            if (on[i]) h += '<rect x="' + (x + .6) + '" y="' + (y + .6) + '" width="7.8" height="7.8" rx="1.8" fill="#d59a5c"/><rect x="' + (x + 1.2) + '" y="' + (y + 1.1) + '" width="6.6" height="2" rx="1" fill="#f0c48e"/>';
          }
          return h;
        })() + '</g></svg>',
      status: function () {
        var s = readLS('woodpile.stats'), m = readLS('woodpile.meta');
        if (!s && !m) return 'Drag, drop and clear';
        var bits = [];
        if (s && s.best) bits.push('Best ' + String(s.best).replace(/\B(?=(\d{3})+(?!\d))/g, ','));
        if (m && m.level) bits.push('Level ' + m.level);
        if (m && m.daily && m.daily[todayNum()] != null) bits.push('daily done');
        return bits.join(' · ') || 'Drag, drop and clear';
      }
    },
    {
      id: 'patchwork', name: 'Picture Perfect', blurb: 'Picture puzzles', path: 'games/patchwork/',
      art: '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="ppsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a5cff"/><stop offset=".55" stop-color="#ff7aa2"/><stop offset="1" stop-color="#ffc07a"/></linearGradient>' +
        '<linearGradient id="pparch" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa4b8"/><stop offset=".5" stop-color="#f4f6fb"/><stop offset="1" stop-color="#8a93a8"/></linearGradient></defs>' +
        '<rect width="100" height="100" fill="url(#ppsky)"/><circle cx="50" cy="72" r="16" fill="#ffe08a" opacity=".9"/>' +
        '<path d="M20 90 C24 14 76 14 80 90 L73 90 C70 28 30 28 27 90Z" fill="url(#pparch)"/>' +
        '<path d="M0 90 V78 H8 V70 H14 V82 H20 V74 H26 V90 M74 90 V72 H80 V64 H86 V76 H92 V70 H100 V90Z" fill="#2b2352" opacity=".85"/><rect y="88" width="100" height="12" fill="#2b2352"/>' +
        '<g stroke="rgba(255,255,255,.55)" stroke-width="1"><path d="M33.3 0 V100 M66.6 0 V100 M0 33.3 H100 M0 66.6 H100"/></g>' +
        '<g transform="translate(69 -3) rotate(8 16 16)"><rect x="0" y="0" width="33" height="33" fill="url(#ppsky)" stroke="#fff" stroke-width="2"/></g></svg>',
      status: function () {
        var m = readLS('patchwork.meta');
        if (!m) return 'Landmarks, scenes and your photos';
        var bits = ['Level ' + (m.level || 1)];
        if (m.daily && m.daily[todayNum()] != null) bits.push('daily done');
        return bits.join(' · ');
      }
    },
    {
      id: 'cubecorral', name: 'Cube Pop', blurb: 'Pop the colored cubes', path: 'games/cubecorral/',
      art: '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="cpsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8ff"/><stop offset="1" stop-color="#e3f4ff"/></linearGradient></defs>' +
        '<rect width="100" height="100" fill="url(#cpsky)"/><ellipse cx="50" cy="86" rx="38" ry="7" fill="rgba(20,40,80,.15)"/>' + (function () {
          var h = '', S = 12.5, pal = ['#ff5a5f', '#ffc53d', '#3b82f6', '#22c55e', '#f5f5f5', '#a855f7'];
          var cubes = [[0,0,0,0],[1,0,0,1],[2,0,0,2],[0,1,0,3],[1,1,0,4],[2,1,0,0],[0,2,0,1],[1,2,0,5],[2,2,0,3],[0,0,1,2],[1,0,1,0],[0,1,1,5],[0,0,2,4]];
          cubes.sort(function (a, b) { return (a[0] + a[1]) - (b[0] + b[1]) || a[2] - b[2]; });
          cubes.forEach(function (c) { h += cube(50 + (c[0] - c[1]) * S, 42 + (c[0] + c[1]) * S / 2 - c[2] * S, S, pal[c[3]]); });
          return h + cube(82, 18, 5, '#ff5a5f') + cube(18, 26, 4, '#ffc53d') + '<circle cx="88" cy="36" r="2.5" fill="#3b82f6"/>';
        })() + '</svg>',
      status: function () {
        var m = readLS('cubecorral.meta');
        if (!m) return 'Tap, blast and clear';
        var bits = ['Level ' + (m.level || 1)];
        if (m.daily && m.daily[todayNum()] != null) bits.push('daily done');
        return bits.join(' · ');
      }
    },
    {
      id: 'screwball', name: 'Screwball', blurb: 'Unscrew it, sort the screws', path: 'games/screwball/',
      art: '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="sbbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6ecf7"/><stop offset="1" stop-color="#cfd9ea"/></linearGradient></defs>' +
        '<rect width="100" height="100" fill="url(#sbbg)"/><ellipse cx="50" cy="88" rx="40" ry="6" fill="rgba(20,40,80,.14)"/>' +
        '<rect x="12" y="30" width="76" height="56" rx="3" fill="#f7f8fb" stroke="#b9c2d3" stroke-width="1.5"/><rect x="8" y="24" width="84" height="8" rx="2" fill="#3a4152"/>' +
        '<rect x="18" y="38" width="30" height="22" rx="2" fill="#8fc3ff" stroke="#5d7aa6" stroke-width="1.5"/><path d="M33 38 V60" stroke="#5d7aa6" stroke-width="1.5"/>' +
        '<rect x="56" y="38" width="24" height="48" rx="2" fill="#d59a5c" stroke="#8a5a3a" stroke-width="1.5"/>' +
        '<rect x="16" y="66" width="36" height="9" rx="2" fill="#9aa4b8" stroke="#6b7385" stroke-width="1.2"/>' + (function () {
          var h = '', sc = [[21, 42, '#e53935'], [44, 42, '#1e88e5'], [21, 70.5, '#fdd835'], [47, 70.5, '#43a047'], [60, 44, '#8e24aa'], [76, 80, '#fb8c00'], [60, 80, '#f06292']];
          sc.forEach(function (s) { h += '<circle cx="' + s[0] + '" cy="' + s[1] + '" r="4" fill="' + s[2] + '" stroke="#1b2130" stroke-width="1.3"/><path d="M' + (s[0] - 2.2) + ' ' + s[1] + ' h4.4 M' + s[0] + ' ' + (s[1] - 2.2) + ' v4.4" stroke="#1b2130" stroke-width="1.1"/>'; });
          return h;
        })() + '</svg>',
      status: function () {
        var m = readLS('screwball.meta');
        if (!m) return 'Tap the screws out';
        var bits = ['Level ' + (m.level || 1)];
        if (m.daily && m.daily[todayNum()] != null) bits.push('daily done');
        return bits.join(' · ');
      }
    },
    {
      id: 'skeehop', name: 'Skee-Hop', blurb: 'Flick, hop, score', path: 'games/skeehop/',
      art: '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="shsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f33"/><stop offset="1" stop-color="#3a2d5c"/></linearGradient>' +
        '<linearGradient id="shlane" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b87a3f"/><stop offset="1" stop-color="#e0a867"/></linearGradient></defs>' +
        '<rect width="100" height="100" fill="url(#shsky)"/><path d="M26 6 H74 L80 44 H20Z" fill="#23283d"/><rect x="24" y="2" width="52" height="8" rx="2" fill="#8a2a2a"/>' +
        '<g fill="none" stroke-width="2.4"><ellipse cx="50" cy="26" rx="17" ry="12" stroke="#ff4d6d"/><ellipse cx="50" cy="26" rx="11" ry="8" stroke="#b86bff"/><ellipse cx="50" cy="26" rx="5" ry="3.8" stroke="#4dd4ff"/></g>' +
        '<ellipse cx="50" cy="26" rx="3" ry="2.2" fill="#07070c"/><circle cx="30" cy="13" r="3" fill="#07070c" stroke="#ff4d6d" stroke-width="1.6"/><circle cx="70" cy="13" r="3" fill="#07070c" stroke="#ff4d6d" stroke-width="1.6"/>' +
        '<rect x="22" y="40" width="56" height="5" fill="#f2c14e"/><path d="M20 45 H80 L100 100 H0Z" fill="url(#shlane)"/>' +
        '<path d="M35 45 L27 100 M50 45 V100 M65 45 L73 100" stroke="rgba(0,0,0,.15)" stroke-width="1.2"/><path d="M8 100 L22 45 M92 100 L78 45" stroke="#8a2a2a" stroke-width="6"/>' +
        '<path d="M50 88 Q48 70 50 52" stroke="#fff" stroke-width="1.6" fill="none" stroke-dasharray="2 3" opacity=".8"/><circle cx="50" cy="88" r="6.5" fill="#f4f1ea" stroke="rgba(0,0,0,.25)"/><path d="M44 88 H56" stroke="#ffd23f" stroke-width="2"/></svg>',
      status: function () {
        var s = readLS('skeehop.stats');
        if (!s) return 'Flick, hop, score';
        var bits = [];
        if (s.classic && s.classic.best) bits.push('Best ' + String(s.classic.best).replace(/\B(?=(\d{3})+(?!\d))/g, ','));
        if (s.bestRound) bits.push('Survival round ' + s.bestRound);
        return bits.join(' · ') || 'Flick, hop, score';
      }
    }
  ];
  var byId = {};
  GAMES.forEach(function (g) { byId[g.id] = g; });

  function open(g) { location.href = g.path; }

  function tile(g) {
    var fav = Goobs.favs().indexOf(g.id) >= 0;
    var b = document.createElement('button');
    b.className = 'gtile';
    b.innerHTML = '<div class="art">' + g.art + '</div><div class="tinfo"><b>' + g.name + '</b><small>' + g.status() + '</small></div>' +
      '<span class="star' + (fav ? ' on' : '') + '" role="button" aria-label="' + (fav ? 'Remove from' : 'Add to') + ' favorites">' + (fav ? '★' : '☆') + '</span>';
    b.addEventListener('click', function (e) {
      if (e.target.closest('.star')) { Goobs.toggleFav(g.id); render(); return; }
      open(g);
    });
    return b;
  }

  function byName(a, b) { return a.name.localeCompare(b.name); }
  function render() {
    // pick up where you left off (one slim bar)
    var recent = Goobs.recent().filter(function (id) { return byId[id]; });
    var sc = $('secContinue');
    sc.innerHTML = '';
    if (recent.length) {
      var g = byId[recent[0]];
      var b = document.createElement('button');
      b.className = 'continue';
      b.innerHTML = '<span class="art">' + g.art + '</span><span class="kp"><em>Keep playing</em><b>' + g.name + '</b><small>' + g.status() + '</small></span><span class="play">Play</span>';
      b.addEventListener('click', function () { open(g); });
      sc.appendChild(b);
    }
    // favorites first, then everything else, each A to Z
    var favIds = Goobs.favs().filter(function (id) { return byId[id]; });
    var favs = favIds.map(function (id) { return byId[id]; }).sort(byName);
    var rest = GAMES.filter(function (g) { return favIds.indexOf(g.id) < 0; }).sort(byName);
    var sf = $('secFavs');
    sf.innerHTML = '';
    if (favs.length) {
      sf.innerHTML = '<h2>Favorites</h2>';
      var fg = document.createElement('div'); fg.className = 'grid';
      favs.forEach(function (gg) { fg.appendChild(tile(gg)); });
      sf.appendChild(fg);
    }
    $('allTitle').textContent = favs.length ? 'More games' : 'All games';
    var all = $('gridAll');
    all.innerHTML = '';
    rest.forEach(function (gg) { all.appendChild(tile(gg)); });
    var soon = document.createElement('div');
    soon.className = 'gtile soon';
    soon.innerHTML = '<span class="tinfo"><b>More on the way</b><small>What should be next?</small></span>';
    all.appendChild(soon);
  }

  // ---------- settings ----------
  Goobs.themePicker($('themes'));
  $('setAds').checked = Goobs.adsOn();
  $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); });
  $('btnSettings').addEventListener('click', function () { $('ovSettings').classList.add('show'); });
  $('btnCloseSettings').addEventListener('click', function () { $('ovSettings').classList.remove('show'); });
  $('ovSettings').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });

  render();
  // coming back with the Back button (page restored from memory): refresh progress lines
  window.addEventListener('pageshow', render);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });

  Goobs.initUpdates({
    onVersions: function (v) {
      var parts = ['Goobs-Games ' + (v.shell || '?')];
      GAMES.forEach(function (g) { if (v[g.id]) parts.push(g.name + ' ' + v[g.id]); });
      $('version').textContent = parts.join(' · ');
      $('foot').textContent = parts[0];
    }
  });
})();
</script>
</body>
</html>
