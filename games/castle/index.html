<style>
/* Castle Crumble styles (themes, UI kit and ad cards come from /shared/goobs.css) */
.brand svg { border-radius: 10px; }
.stagewrap { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: stretch; justify-content: center; }
.stage { position: relative; flex: 1 1 auto; max-width: 620px; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); touch-action: none;
  background: linear-gradient(#5fa9ea 0%, #a8d9f7 55%, #2f97d6 55.1%, #2f97d6 100%); }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; left: 10px; right: 10px; top: 10px; pointer-events: none; display: flex; flex-direction: column; gap: 7px; }
/* the progress bar: this level's castle badge, how much has crumbled (the notch is the goal), the next level */
.bar { display: flex; align-items: center; }
.badge { position: relative; z-index: 1; min-width: 40px; height: 40px; padding: 8px 4px 0; box-sizing: border-box; text-align: center; font-weight: 900; font-size: 17px; color: #3a2a00;
  background: #ffd23f; border: 3px solid #3a2a00; clip-path: polygon(0 18%, 20% 18%, 20% 0, 40% 0, 40% 18%, 60% 18%, 60% 0, 80% 0, 80% 18%, 100% 18%, 100% 100%, 0 100%); }
.badge.next { background: #3a3f48; color: #fff; border-color: #1b1f24; }
.track { position: relative; flex: 1; height: 22px; margin: 0 -3px; background: #3a3f48; border: 3px solid #1b1f24; overflow: hidden; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(#ffe27a, #ffc21e); transition: width .25s; }
.track .goal { position: absolute; top: -2px; bottom: -2px; width: 3px; background: #fff; box-shadow: 0 0 4px rgba(0,0,0,.4); }
.balls { align-self: flex-start; display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,.88); border-radius: 14px; padding: 4px 10px 4px 7px; font-weight: 900; font-size: 18px; color: #1b1f33; box-shadow: 0 2px 0 rgba(0,0,0,.12); }
.balls i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #9aa2ae 0 12%, #3a3f48 45%, #15181d 100%); display: inline-block; }
.balls.low { background: #ffe1e5; color: #c81e3a; }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: #1b3a6b; pointer-events: none; }
.loading.hide { display: none; }
.toast { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(10,14,36,.78); color: #fff; font-weight: 800; font-size: 16px; padding: 8px 15px; border-radius: 14px; white-space: nowrap; }
.toast.show { opacity: 1; }
.lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lv { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); height: 52px; font-weight: 800; font-size: 16px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.lv small { font-size: 11px; color: #e0a800; letter-spacing: -1px; }
.lv.cur { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.lv:disabled { opacity: .35; }
.stars { font-size: 26px; color: #ffc83d; letter-spacing: 2px; }
.stars .off { color: var(--line-strong); }
.cardicon svg { border-radius: 16px; }
.brand h1 { font-size: 21px; }
@media (max-width: 385px) { .brand h1 { font-size: 19px; } }
.lvpages { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.lvpages button { font: inherit; font-weight: 800; font-size: 13px; border: 0; border-radius: 10px; padding: 7px 9px; background: var(--surface-2); color: var(--muted); }
.lvpages button.on { background: var(--accent); color: #fff; }
.lvpages button[disabled] { opacity: .35; }

/* Full screen (1.1.0, Glenn: "every game full screen", Cindy: "it's too small"): the island fills the whole phone and
   the camera fits the whole castle into the free space (scene.js fitView). The kit floats the top row (html.gg-fs-over);
   the progress bar sits in it between the back button and Sound / Menu, the cannonballs pill just under it. */
html.gg-fs-over .stagewrap { position: fixed; inset: 0; }
html.gg-fs-over .stage { max-width: none; border-radius: 0; box-shadow: none; }
.top .bar { flex: 1 1 auto; min-width: 0; margin: 0 4px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.2)); }
html.gg-fs-over .hud { top: calc(env(safe-area-inset-top, 0px) + 58px); left: calc(env(safe-area-inset-left, 0px) + 10px); right: auto; }
.sbprobe { position: fixed; left: 0; bottom: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); visibility: hidden; pointer-events: none; }
.menustars { color: #ffb400; letter-spacing: 1px; }
</style>

<script>
/* Castle Crumble logic: castles of stone bricks on a grassy island; fire cannonballs to knock them down. Knock down
   enough of the castle (the bar at the top) before the cannonballs run out. cannon-es does the physics (passed in
   with CC.use, so this file runs in the browser and in Node for the level checks).
   Castles are built from the level number (seeded): towers with cone roofs, walls with battlements, a keep with a
   pyramid roof, gatehouses with wooden doors, and TNT crates that blow up. Bricks are laid like real masonry
   (joints staggered), start asleep so a castle stands perfectly still, and wake when hit or when what holds them
   up goes (a moving brick wakes the ones near it). tools/gen.mjs proves every level: a bot knocks it down with the
   game's physics and the level gets more cannonballs than the bot needed. */
var CC = (function () {
  'use strict';
  var C = null;
  var GRAV = -18, ISLAND = 13, WATER = -1.2, BALLR = 0.55, BALLM = 40, SPEED = 38, BALL_LIFE = 4.5;
  var CAM = { D: 26, H: 14, LOOK: 3 };      // the camera orbits the island; the cannon fires from just below it
  var TYPES = {
    b2: { mass: 3.2, w: 2, mat: 'stone' },  // long brick (2 x 1 x 1)
    b1: { mass: 1.6, w: 1, mat: 'stone' },  // square brick
    m: { mass: 0.8, w: 0.5, mat: 'stone' }, // battlement (merlon)
    cone: { mass: 2.5, w: 3, mat: 'roof' }, // a tower's pointed roof (a box in the physics)
    pyr: { mass: 4, w: 5, mat: 'roof' },    // a keep's pyramid roof
    door: { mass: 1.2, w: 1.5, mat: 'wood' },
    tnt: { mass: 1.2, w: 1, mat: 'tnt' }
  };
  function use(c) { C = c; }
  function rng(seed) { var s = seed >>> 0 || 1; return function () { s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // ---------------- castle parts ----------------
  // a piece: [type, x, y, z, sx, sy, sz] (center and full size). Everything stands on the island (top at y = 0).
  function P(t, x, y, z, sx, sy, sz) { return [t, +x.toFixed(3), +y.toFixed(3), +z.toFixed(3), sx, sy, sz]; }
  // a hollow square ring n cells wide (n odd), h rows high, centered at (cx, cz); long bricks in a pinwheel that
  // turns the other way every row, so no joint sits on the one below
  function ring(out, cx, cz, n, h, y0) {
    var half = (n - 1) / 2, side = n - 1; // cells per side (even)
    for (var r = 0; r < h; r++) {
      var y = (y0 || 0) + 0.5 + r, flip = r % 2;
      // walk the four sides; each side covers "side" cells starting at a corner
      var corners = [[-half, -half, 1, 0], [half, -half, 0, 1], [half, half, -1, 0], [-half, half, 0, -1]];
      corners.forEach(function (c) {
        var sx = c[0], sz = c[1], dx = c[2], dz = c[3];
        if (flip) { sx += dx; sz += dz; } // start one cell later: the pinwheel turns
        for (var k = 0; k < side; k += 2) {
          var ax = sx + dx * k, az = sz + dz * k, bx = ax + dx, bz = az + dz;
          // wrap past the next corner onto the next side (only when flipped: the last brick turns the corner)
          if (Math.abs(bx) > half || Math.abs(bz) > half) { out.push(P('b1', cx + ax, y, cz + az, 1, 1, 1)); continue; }
          var mx = (ax + bx) / 2, mz = (az + bz) / 2;
          out.push(P('b2', cx + mx, y, cz + mz, dx ? 2 : 1, 1, dz ? 2 : 1));
        }
      });
      if (flip) { // with the pinwheel shifted, each corner cell is left: fill it with a square brick
        [[-half, -half], [half, -half], [half, half], [-half, half]].forEach(function (c) { var taken = out.some(function (p) { return Math.abs(p[1] - (cx + c[0])) < 0.51 && Math.abs(p[3] - (cz + c[1])) < 0.51 && Math.abs(p[2] - y) < 0.1; }); if (!taken) out.push(P('b1', cx + c[0], y, cz + c[1], 1, 1, 1)); });
      }
    }
  }
  function tower(out, cx, cz, h, roof, R) {
    ring(out, cx, cz, 3, h);
    if (roof) out.push(P('cone', cx, h + 1.25, cz, 3.4, 2.5, 3.4));
    else [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(function (c) { out.push(P('m', cx + c[0], h + 0.3, cz + c[1], 0.8, 0.6, 0.8)); });
    void R;
  }
  function keep(out, cx, cz, h, roof) {
    ring(out, cx, cz, 5, h);
    if (roof) out.push(P('pyr', cx, h + 1.4, cz, 5.4, 2.8, 5.4));
    else for (var i = -2; i <= 2; i += 2) [[i, -2], [i, 2], [-2, i], [2, i]].forEach(function (c) { if (!out.some(function (p) { return p[0] === 'm' && Math.abs(p[1] - cx - c[0]) < 0.1 && Math.abs(p[3] - cz - c[1]) < 0.1; })) out.push(P('m', cx + c[0], h + 0.3, cz + c[1], 0.8, 0.6, 0.8)); });
  }
  // a straight wall from cell a to cell b (inclusive), one brick thick, h rows, battlements on top; "door" leaves
  // a gap in the middle two rows high with a wooden door in it
  function wall(out, ax, az, bx, bz, h, door, tnt, R) {
    var dx = Math.sign(bx - ax), dz = Math.sign(bz - az), L = Math.abs(bx - ax) + Math.abs(bz - az) + 1, mid = Math.floor(L / 2);
    for (var r = 0; r < h; r++) {
      var y = 0.5 + r, k = r % 2 ? 1 : 0;
      if (r % 2) out.push(P('b1', ax, y, az, 1, 1, 1)); // odd rows start with a square brick (staggered joints)
      for (; k < L; k += 2) {
        var inDoor = door && r < 2 && (k === mid - 1 || k === mid || k + 1 === mid - 1 || k + 1 === mid);
        if (inDoor) continue;
        if (k + 1 >= L) { out.push(P('b1', ax + dx * k, y, az + dz * k, 1, 1, 1)); continue; }
        out.push(P('b2', ax + dx * (k + 0.5), y, az + dz * (k + 0.5), dx ? 2 : 1, 1, dz ? 2 : 1));
      }
      if (door && r < 2) { // bricks either side of the doorway, where a long brick was skipped
        for (var q = mid - 2; q <= mid + 1; q++) {
          if (q === mid - 1 || q === mid || q < 0 || q >= L) continue;
          var cxq = ax + dx * q, czq = az + dz * q;
          if (!out.some(function (p) { return Math.abs(p[2] - y) < 0.1 && Math.abs(p[1] - cxq) < (p[4] / 2) + 0.01 && Math.abs(p[3] - czq) < (p[6] / 2) + 0.01; })) out.push(P('b1', cxq, y, czq, 1, 1, 1));
        }
      }
    }
    if (door) { var cx = ax + dx * (mid - 0.5), cz = az + dz * (mid - 0.5); out.push(P('door', cx, 1, cz, dx ? 1.9 : 0.4, 2, dz ? 1.9 : 0.4)); }

<script src="../../shared/ads.js"></script>
<script>
/* Castle Crumble app: the island scene (three.js, scene.js), the physics loop (cannon-es through CC in logic.js),

  // ================= helpers =================

  var FS = Goobs.fullscreen({
    overlay: true,
    menu: ['btnHelp', 'btnLevels', 'btnStats', 'btnSettings', 'btnNew'],

  }

    var last = levelNo >= LEVELS.length;

      Math.round(CC.progress(sim) * 100) + '% knocked down with ' + sim.shots + ' of ' + level.balls + ' cannonballs.',

  }
  function lost() {

    showCard('Out of cannonballs', 'The castle is ' + Math.round(CC.progress(sim) * 100) + '% down; ' + Math.round(level.target * 100) + '% wins it.', [{ label: 'Try again', red: true, go: function () { between(function () { startLevel(levelNo); }); } }, { label: 'Pick a level', go: openLevels }]);

  // How a cannonball is drawn (1.2.0). The physics fires it from the cannon (CC.launchAt), which is behind the camera
  // for a small castle and in front of it for a big one. So the ball is drawn only once it is a little way in front
  // of the camera, and for its first moments it slides from the bottom middle of the screen onto its real path: it

  }

  // ================= input: tap to fire, drag to walk round the island =================

  }

  // ================= info and sheets =================

  function renderBar() {

  }
  function renderInfo() {

  }
  var lvPage = -1, PAGE = 50;
  function openLevels(keepPage) {

    tabs += '</div>';
    var h = '';
    for (var n = lvPage * PAGE + 1; n <= Math.min(LEVELS.length, (lvPage + 1) * PAGE); n++) { var st = meta.stars[n] || 0; h += '<button class="lv' + (n === levelNo ? ' cur' : '') + '" data-n="' + n + '"' + (n > meta.open ? ' disabled' : '') + '>' + n + '<small>' + '★★★'.slice(0, st) + '</small></button>'; }
    $('lvpagesBox').innerHTML = tabs; $('lvgrid').innerHTML = h; $('ovLevels').classList.add('show');

  // ================= wiring =================

  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {

    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });

  }
  function init() {

    $('btnNew').addEventListener('click', function () {
      if (sim && state === 'play' && sim.shots > 0) { showCard('Start again?', 'The castle is rebuilt and you get all your cannonballs back.', [{ label: 'Start again', red: true, go: function () { startLevel(levelNo); } }, { label: 'Keep playing', go: function () {} }]); return; }

    });
    $('btnLevels').addEventListener('click', function () { openLevels(); });
    $('lvpagesBox').addEventListener('click', function (e) { var b = e.target.closest('button[data-p]'); if (!b || b.disabled) return; lvPage = +b.dataset.p; openLevels(true); });
    $('lvgrid').addEventListener('click', function (e) { var b = e.target.closest('button[data-n]'); if (!b) return; $('ovLevels').classList.remove('show'); startLevel(+b.dataset.n); });

    $('btnHelp').addEventListener('click', openHelp);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('setFancy').checked = settings.fancy;
    $('setZoom').checked = settings.zoom;
    $('setZoom').addEventListener('change', function () { settings.zoom = this.checked; saveSettings(); });
