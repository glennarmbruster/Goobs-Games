<style>
/* Tile Temple styles (themes, UI kit and ad cards come from /shared/goobs.css) */
:root { --tt-table: #dff1e8; --tt-table-2: #cfe9dc; }
:root[data-theme="dark"] { --tt-table: #16241e; --tt-table-2: #1b2c24; }
:root[data-theme="blue"] { --tt-table: #10283f; --tt-table-2: #143250; }
.brand svg { border-radius: 10px; }
.brand h1 { font-size: 23px; }
.info .mid .of { color: var(--muted); font-weight: 600; }

.stagewrap { flex: 1 1 auto; min-height: 0; width: calc(100% + 20px); margin: 0 -10px; display: flex; align-items: center; justify-content: center; }
.stage { position: relative; width: 100%; height: 100%; border-radius: 16px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, var(--tt-table), var(--tt-table-2)); touch-action: manipulation; }
.stage canvas { display: block; width: 100%; height: 100%; }
.toast {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: 88%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(20,24,36,.78); color: #fff; font-weight: 700; font-size: 14px; padding: 7px 13px; border-radius: 14px;
}
.toast.show { opacity: 1; }
.toolbar .tool.hot { background: var(--accent); color: var(--accent-ink); }

.layouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.layouts button { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink); }
.layouts button.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.layouts canvas { width: 100%; height: 76px; }
.layouts b { font-size: 16px; }
.layouts small { font-size: 12px; color: var(--muted); font-weight: 600; }
.cardicon svg { border-radius: 16px; }
@media (max-width: 385px) { .brand h1 { font-size: 21px; } }
.toolbar .tool span { white-space: nowrap; }
/* the matching box */
.tray { display: none; flex: none; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 6px; border-radius: 16px;
  background: linear-gradient(#b87a45, #9a6232); box-shadow: inset 0 2px 6px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.35); }
.tray.show { display: flex; }
.tray .slot { flex: none; border-radius: 8px; background: rgba(0,0,0,.22); box-shadow: inset 0 1px 3px rgba(0,0,0,.35); display: grid; place-items: center; }
.tray .slot.tile { background: #fbf7ef; box-shadow: 3px 3px 0 #1b7457, 0 0 0 1px rgba(120,105,80,.35); overflow: hidden; }
.tray .slot.tile canvas { display: block; }
.tray .slot.in { animation: trayin .25s ease-out; }
.tray .slot.out { animation: trayout .26s ease-in forwards; }
.tray .slot.locked { background: rgba(0,0,0,.12); border: 2px dashed rgba(255,255,255,.4); box-shadow: none; }
.tray .slot.locked span { color: rgba(255,255,255,.75); font-weight: 900; font-size: 22px; }
@keyframes trayin { from { transform: translateY(-30px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes trayout { 0% { transform: scale(1); } 40% { transform: scale(1.15); background: #ffe79a; } 100% { transform: scale(.3); opacity: 0; } }
.zoomhint { position: absolute; right: 10px; top: 10px; background: rgba(20,24,36,.6); color: #fff; font-weight: 800; font-size: 12px; padding: 5px 9px; border-radius: 12px; pointer-events: none; display: none; }
.zoomhint.show { display: block; }
/* sideways: the board takes the left, the numbers and buttons stack on the right */
@media (orientation: landscape) and (max-height: 540px) {
  .app { max-width: none; display: grid; grid-template-columns: 1fr 132px; grid-template-rows: auto 1fr; gap: 6px 10px; align-items: stretch;
    padding: calc(env(safe-area-inset-top, 0px) + 4px) calc(env(safe-area-inset-right, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 6px) calc(env(safe-area-inset-left, 0px) + 10px); }
  .top { grid-column: 1; grid-row: 1; min-height: 40px; }
  .app { grid-template-rows: auto 1fr auto; }
  .stagewrap { grid-column: 1; grid-row: 2; width: 100%; margin: 0; }
  .tray { grid-column: 1; grid-row: 3; padding: 4px; }
  .info { grid-column: 2; grid-row: 1; flex-direction: column; align-items: stretch; gap: 2px; min-height: 0; }
  .info > div { text-align: left !important; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .info .ttl, .info .mid { font-size: 15px; }
  .toolbar { grid-column: 2; grid-row: 2 / span 2; flex-direction: column; justify-content: flex-end; }
  .toolbar .tool { flex: 1; min-height: 0; max-height: 58px; flex-direction: row; gap: 6px; font-size: 14px; }
}
</style>

<script>
/* Tile Temple logic: Mahjong solitaire. Layouts, the 144 tiles, which tiles are free, deals that can always be
   cleared (built by taking pairs off a full board, so the order they came off is a solution), hints, shuffles.
   Positions are in half-tile steps: a tile at (x, y, z) covers x..x+2 and y..y+2 on layer z. Runs in Node. */
var MJ = (function () {
  'use strict';
  // ---------- the tiles ----------
  // faces: dots d1-d9, bamboo b1-b9, characters c1-c9 (4 of each), winds wE wS wW wN, dragons dr dg dw (4 of each),
  // flowers f1-f4 and seasons s1-s4 (one of each; any flower matches any flower, any season any season)
  var FACES = [];
  ['d', 'b', 'c'].forEach(function (s) { for (var i = 1; i <= 9; i++) FACES.push(s + i); });
  FACES = FACES.concat(['wE', 'wS', 'wW', 'wN', 'dr', 'dg', 'dw']);
  var FLOWERS = ['f1', 'f2', 'f3', 'f4'], SEASONS = ['s1', 's2', 's3', 's4'];
  function group(f) { return /^f[1-4]$/.test(f) ? 'flower' : /^s[1-4]$/.test(f) ? 'season' : f; }
  function matches(a, b) { return group(a) === group(b); }
  // the 72 pairs of a full set: two pairs of each normal face, flowers and seasons paired among themselves
  function allPairs() {
    var p = [];
    FACES.forEach(function (f) { p.push([f, f], [f, f]); });
    p.push(['f1', 'f2'], ['f3', 'f4'], ['s1', 's2'], ['s3', 's4']);
    return p;
  }

  // ---------- layouts ----------
  function rect(out, x0, y0, w, h, z) { for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) out.push([(x0 + x) * 2, (y0 + y) * 2, z]); }
  function row(out, x0, n, y, z) { for (var x = 0; x < n; x++) out.push([(x0 + x) * 2, y * 2, z]); }
  var LAYOUTS = [
    { id: 'turtle', name: 'Turtle', build: function () {
      // the classic shape (traditional): 87 on the bottom, 36, 16, 4, then 1 on top
      var t = [];
      row(t, 1, 12, 0, 0); row(t, 3, 8, 1, 0); row(t, 2, 10, 2, 0); row(t, 1, 12, 3, 0); row(t, 1, 12, 4, 0); row(t, 2, 10, 5, 0); row(t, 3, 8, 6, 0); row(t, 1, 12, 7, 0);
      t.push([0, 7, 0], [26, 7, 0], [28, 7, 0]);
      rect(t, 4, 1, 6, 6, 1); rect(t, 5, 2, 4, 4, 2); rect(t, 6, 3, 2, 2, 3);
      t.push([13, 7, 4]);
      return t;
    } },
    { id: 'pyramid', name: 'Pyramid', build: function () {
      var t = []; rect(t, 0, 0, 10, 7, 0); rect(t, 1, 1, 8, 5, 1); rect(t, 2, 2, 6, 3, 2); rect(t, 3, 3, 4, 1, 3);
      return t; // 70 + 40 + 18 + 4 = 132
    } },
    { id: 'fortress', name: 'Fortress', build: function () {
      var t = [];
      rect(t, 0, 0, 12, 8, 0);                                    // 96
      [[0, 0], [10, 0], [0, 6], [10, 6]].forEach(function (c) { rect(t, c[0], c[1], 2, 2, 1); rect(t, c[0], c[1], 2, 2, 2); }); // towers: 32
      row(t, 3, 6, 0, 1); row(t, 3, 6, 7, 1);                      // walls: 12
      t.push([11, 7, 1], [11, 7, 2], [11, 7, 3], [11, 7, 4]);     // the keep in the middle: 4
      return t; // 144
    } },
    { id: 'bridge', name: 'Bridge', build: function () {
      var t = [];
      rect(t, 0, 0, 3, 8, 0); rect(t, 11, 0, 3, 8, 0);            // piers: 48
      rect(t, 3, 2, 8, 4, 0);                                    // deck: 32
      rect(t, 0, 1, 3, 6, 1); rect(t, 11, 1, 3, 6, 1);            // 36
      rect(t, 4, 3, 6, 2, 1);                                    // 12
      rect(t, 1, 2, 1, 4, 2); rect(t, 12, 2, 1, 4, 2);            // 8
      rect(t, 5, 3, 4, 2, 2);                                    // 8
      return t; // 144
    } },
    { id: 'quick', name: 'Quick', build: function () {
      var t = []; rect(t, 0, 0, 8, 6, 0); rect(t, 1, 1, 6, 4, 1);
      return t; // 48 + 24 = 72
    } }
  ];
  var BY_ID = {}; LAYOUTS.forEach(function (l) { BY_ID[l.id] = l; l.slots = l.build(); });

  // ---------- which tiles are free ----------
  function overlap(a, b) { return Math.abs(a[0] - b[0]) < 2 && Math.abs(a[1] - b[1]) < 2; }
  // precomputed neighbors for each slot: above (on the next layer and overlapping), left, right (same layer, touching)
  function links(slots) {
    return slots.map(function (a) {
      var up = [], left = [], right = [];
      slots.forEach(function (b, j) {
        if (b[2] === a[2] + 1 && overlap(a, b)) up.push(j);
        if (b[2] === a[2] && Math.abs(a[1] - b[1]) < 2) { if (b[0] === a[0] - 2) left.push(j); if (b[0] === a[0] + 2) right.push(j); }
      });
      return { up: up, left: left, right: right };
    });
  }
  LAYOUTS.forEach(function (l) { l.links = links(l.slots); });
  function isFree(L, on, i) {
    var k = L.links[i], j;
    for (j = 0; j < k.up.length; j++) if (on[k.up[j]]) return false;
    var lb = false, rb = false;
    for (j = 0; j < k.left.length; j++) if (on[k.left[j]]) { lb = true; break; }
    for (j = 0; j < k.right.length; j++) if (on[k.right[j]]) { rb = true; break; }
    return !(lb && rb);
  }

  // ---------- random ----------
  function rng(seed) { var s = seed >>> 0 || 1; return function () { s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(a, R) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(R() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

    var box = $('layouts'); box.innerHTML = '';
    MJ.LAYOUTS.forEach(function (Ly) {
      var b = document.createElement('button'), st = stats[Ly.id];
      b.className = Ly.id === (g && g.layout) ? 'cur' : '';
      var c = document.createElement('canvas'); b.appendChild(c);
      b.insertAdjacentHTML('beforeend', '<b>' + Ly.name + '</b><small>' + Ly.slots.length + ' tiles' + (st.best ? ' &middot; best ' + clock(st.best) : '') + (st.won ? ' &middot; ' + st.won + ' cleared' : '') + '</small>');
      b.addEventListener('click', function () {
        $('ovNew').classList.remove('show');
        var go = function () { between(function () { newGame(Ly.id); }); };
        go();
      });
      box.appendChild(b);
      requestAnimationFrame(function () { thumb(c, Ly); });
    });
    $('ovNew').classList.add('show');
  }
  function thumb(c, Ly) {
    var r = c.getBoundingClientRect(), d = Math.min(3, window.devicePixelRatio || 1); c.width = r.width * d; c.height = r.height * d;
    var x = c.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0);
    var sl = Ly.slots, mx = 0, my = 0; sl.forEach(function (s) { mx = Math.max(mx, s[0]); my = Math.max(my, s[1]); });
    var tw = Math.min((r.width - 8) / (mx / 2 + 1.6), (r.height - 8) / ((my / 2 + 1) * 1.3 + 0.6)), th = tw * 1.3, dd = tw * 0.15;
    var ox = (r.width - (mx / 2 + 1) * tw) / 2 + dd, oy = (r.height - (my / 2 + 1) * th) / 2 + dd;
    sl.map(function (s, i) { return i; }).sort(function (a, b) { var p = sl[a], q = sl[b]; return p[2] - q[2] || p[0] - q[0] || p[1] - q[1]; }).forEach(function (i) {
      var s = sl[i], px = ox + s[0] / 2 * tw - s[2] * dd, py = oy + s[1] / 2 * th - s[2] * dd;
      x.fillStyle = '#1b7457'; x.fillRect(px + dd * 0.5, py + dd * 0.5, tw, th);
      x.fillStyle = '#fbf7ef'; x.fillRect(px, py, tw - 0.6, th - 0.6);
    });
  }

  // ================= info =================
  function renderInfo() {
    if (!g) return;
    var n = MJ.tilesLeft(g), mid = g.boxMode ? '<div class="lbl">Box</div><div class="mid">' + g.box.length + '<span class="of"> / ' + g.cap + '</span></div>' : '<div class="lbl">Pairs free</div><div class="mid">' + MJ.moves(g).length + '</div>';
    $('info').innerHTML = '<div><div class="lbl">' + MJ.BY_ID[g.layout].name + '</div><div class="ttl">' + n + ' left</div></div>' +
      '<div style="text-align:center">' + mid + '</div>' +
      '<div class="right"><div class="lbl">Time</div><div class="mid" id="clock">' + clock(g.ms) + '</div></div>';
    $('btnUndo').disabled = !(g.boxMode ? g.hist.length : g.removed.length);
  }
  function renderClock() { var el = $('clock'); if (el && g) el.textContent = clock(g.ms); }
  function renderAll() { renderInfo(); renderTray(); draw(); }

  // ================= sheets =================
  function openHelp() {
    $('helpTitle').textContent = 'How to play Tile Temple';
    $('helpList').innerHTML = [
      'Clear the board by taking the tiles off <b>in matching pairs</b>. <b>The box</b> (under the board, on at first): tap a free tile and it goes into the box; when its match goes in too, the pair clears. The box holds 4 tiles. If it fills up with no match to take, you can watch an ad to make it hold 6 (once a game). Tiles in the box are off the board, so whatever they were blocking is free. With the box off (Settings), tap one tile and then its match on the board.',
      'A tile can be taken only if it’s <b>free</b>: nothing on top of it, and nothing touching it on its <b>left or right</b> (one open side is enough).',
      'Matches are the same tile: the same number of dots, bamboo or characters (萬), the same wind (東 E, 南 S, 西 W, 北 N) or the same dragon (中 red, 發 green, the blue frame). <b>Any flower</b> matches any flower and <b>any season</b> any season (sprout, sun, leaf, snowflake).',
      'Stuck? <b>Hint</b> lights up a tile that matches the box, or a pair (one that keeps the board clearable when it can tell). <b>Undo</b> takes back a pair. <b>Shuffle</b> mixes the tiles that are left on the board (without the box, placed so they can still be cleared).',
      'Tiles small? <b>Pinch</b> to zoom in and drag to look around; pinch back out to see it all. Every board is dealt so it <b>can be cleared</b>. Your time counts from your first pair. <b>New game</b> lets you pick one of five layouts: Turtle, Pyramid, Fortress, Bridge and Quick (72 tiles).',
      'Settings: small <b>corner numbers</b> to read tiles quickly (on), and <b>shade blocked tiles</b> if you want to see what can move.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var h = '<div class="tiles">', tot = { played: 0, won: 0 };
    MJ.LAYOUTS.forEach(function (Ly) { var st = stats[Ly.id]; tot.played += st.played; tot.won += st.won; });
    h += '<div class="tile"><b>' + tot.played + '</b><span>Games</span></div><div class="tile"><b>' + tot.won + '</b><span>Cleared</span></div><div class="tile"><b>' + fmt(stats.pairs) + '</b><span>Pairs</span></div></div>';
    MJ.LAYOUTS.forEach(function (Ly) { var st = stats[Ly.id]; h += '<div class="row"><div>' + Ly.name + '<small>' + st.won + ' of ' + st.played + ' cleared</small></div><b>' + (st.best ? clock(st.best) : '–') + '</b></div>'; });
    $('statsBody').innerHTML = h;
  }

  // ================= wiring =================
  function syncSound() {
    $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>';
    $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound);
  }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function init() {
    Goobs.themePicker($('themes'));
    cv = $('cv'); cx = cv.getContext('2d');
    cv.addEventListener('pointerdown', onDown); cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', function (e) { delete ptrs[e.pointerId]; gest = null; });
    cv.style.touchAction = 'none';
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { tick(); saveGame(); Goobs.home(); });
    $('btnHint').addEventListener('click', hint);
    $('btnUndo').addEventListener('click', undo);
    $('btnShuffle').addEventListener('click', shuffle);
    $('btnNew').addEventListener('click', openNew);
    sheet(null, 'ovNew', 'btnCloseNew');
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    $('btnHelp').addEventListener('click', openHelp);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setDim').checked = settings.dim; $('setIdx').checked = settings.idx; $('setBox').checked = settings.box;
    $('setBox').addEventListener('change', function () { settings.box = this.checked; saveSettings(); toast(settings.box ? 'The box is on from your next game.' : 'The box is off from your next game.'); });
    $('tray').addEventListener('click', function (e) { if (e.target.closest('.locked')) toast('When the box is full and nothing matches, you can watch an ad for these 2 spaces.'); });
    $('setDim').addEventListener('change', function () { settings.dim = this.checked; saveSettings(); draw(); });
    $('setIdx').addEventListener('change', function () { settings.idx = this.checked; saveSettings(); faceCache = {}; trayCache = {}; draw(); renderTray(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    if (window.ResizeObserver) { new ResizeObserver(layoutBoard).observe($('stage')); new ResizeObserver(function () { renderTray(); }).observe($('tray')); }
    window.addEventListener('resize', layoutBoard);
    document.addEventListener('visibilitychange', function () { tick(); if (document.hidden) saveGame(); });
    window.addEventListener('pagehide', function () { tick(); saveGame(); });
    syncSound(); syncAds();
    if (!loadGame()) newGame(meta.layout); else { layoutBoard(); renderAll(); }
    if (!meta.seen) openHelp();
    lastTick = performance.now();
    requestAnimationFrame(loop);
    Goobs.markPlayed('mahjong');
    Goobs.initUpdates({
      beforeReload: function () { tick(); saveGame(); },
      onVersions: function (v) { $('version').textContent = 'Tile Temple ' + (v.mahjong || '?') + ' · Goobs-Games ' + (v.shell || '?'); }
    });
  }

  // hook for automated tests
  window.__tt = { get view() { return view; }, get g() { return g; }, MJ: MJ, take: function (a, b) { take(a, b); }, hint: hint, undo: undo, shuffle: shuffle, newGame: newGame, stats: function () { return stats; }, pos: function (i) { return pos(i); }, B: function () { return B; } };

  init();
})();
</script>
</body>
</html>
