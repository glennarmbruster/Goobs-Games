<script>
/* if Buzz Off! can't open, say so on screen (never a blank page) and offer a fresh start */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__bzReady) return; shown = true;
    function put() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#eef4f0;color:#1b1f33;font:600 16px -apple-system,system-ui,sans-serif;text-align:center';
      d.innerHTML = '<b style="font-size:21px">Buzz Off! didn\u2019t open</b><div style="max-width:320px;opacity:.75;font-size:13px">' + String(msg).replace(/[<>&]/g, '') + '</div>';
      function btn(t, bg, go) { var b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:800 17px -apple-system,system-ui,sans-serif;padding:13px 24px;border-radius:14px;border:0;color:#fff;background:' + bg; b.onclick = go; d.appendChild(b); }
      btn('Start fresh', '#5a54f0', function () { try { localStorage.removeItem('buzz.meta'); } catch (e) { /* ignore */ } location.reload(); });
      btn('All games', '#6b7080', function () { location.href = '../../'; });
      document.body.appendChild(d);
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  }
  window.addEventListener('error', function (e) { fail((e.message || 'Something went wrong') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__bzReady) fail('It took too long to start.'); }, 6000);
})();
</script>

<style>
/* Buzz Off! styles (themes, UI kit and ad cards come from /shared/goobs.css) */
/* full screen (1.1.0): the stage reaches past the page gutters (edge to edge) and takes all the height between the top
   row and the Restart / Hint toolbar; the world is fitted inside it by fit() */
.stagewrap { flex: 1 1 auto; min-height: 0; width: calc(100% + 16px); margin: 0 -8px; display: flex; align-items: stretch; justify-content: center; }
.stage { position: relative; flex: 1; border-radius: 18px; overflow: hidden; touch-action: none; background: #fdf8ec; box-shadow: var(--shadow); }
/* the level and its stars, in the top row (it was the info row); tap it for How to play */
.bzlv { flex: none; font: inherit; font-weight: 800; font-size: 14px; padding: 6px 10px; white-space: nowrap; cursor: pointer; }
.bzlv i { font-style: normal; color: #ffb800; }
.bzlv i span { color: var(--line-strong); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
.inkbar { flex: 1; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.85); border-radius: 14px; padding: 6px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.inkbar .pen { width: 22px; height: 22px; flex: none; }
.ink { position: relative; flex: 1; height: 12px; border-radius: 6px; background: #e6e0d2; overflow: visible; }
.ink .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, #2b2b38, #4a4f68); width: 100%; transition: width .08s linear; }
.ink .mk { position: absolute; top: -9px; transform: translateX(-50%); font-style: normal; font-size: 15px; color: #ffc53d; text-shadow: 0 1px 0 #8a5a00, 0 0 3px #fff; }
.ink .mk.off { color: #cfc7b4; text-shadow: none; }
.clock { position: relative; width: 44px; height: 44px; flex: none; }
.clock svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.clock b { position: absolute; left: 0; right: 0; top: 13px; text-align: center; font-size: 17px; font-weight: 900; color: #e8354a; font-variant-numeric: tabular-nums; }
.clock.low b { animation: bzpulse .5s infinite alternate; }
@keyframes bzpulse { to { transform: scale(1.25); } }
.tip { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); max-width: 88%; text-align: center; pointer-events: none; font-weight: 800; font-size: 16px; color: #2b2b38; background: rgba(255,255,255,.9); padding: 8px 14px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.12); transition: opacity .3s; opacity: 0; }
.tip.show { opacity: 1; }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: 92%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(20,24,36,.85); color: #fff; font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 14px; }
.toast.show { opacity: 1; }
.cardicon svg { border-radius: 16px; }
.stars { font-size: 38px; letter-spacing: 4px; color: #ffc53d; text-shadow: 0 2px 0 #b07800; margin: 2px 0 6px; }
.stars .off { color: #d9d2c0; text-shadow: none; }
.lvpages { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.lvpages button { font: inherit; font-weight: 800; font-size: 13px; border: 0; border-radius: 10px; padding: 7px 9px; background: var(--surface-2); color: var(--muted); }
.lvpages button.on { background: var(--accent); color: #fff; }
.lvpages button[disabled] { opacity: .35; }
/* iPhone SE width: keep "Buzz Off!" readable next to a three-digit level */
@media (max-width: 380px) { html.gg-fs .top .brand h1 { font-size: 18px; } .bzlv { padding: 6px 8px; } }
</style>

<script src="../../shared/planck.min.js"></script>
<script>
/* Buzz Off! rules and physics (planck.js, a JavaScript Box2D). No drawing here; runs in Node for the level maker.
   World units are meters, y points up; the screen shows x 0..10 and y 0..16. Draw one line, then the line falls
   under gravity, the hives let their bees out, and the bees chase the pup. Keep every pup safe until the clock runs
   out. A bee touching a pup, a pup touching spikes, water or lava, or a pup falling off the screen loses the level. */
var BZ = (function () {
  'use strict';
  var pl = typeof planck !== 'undefined' ? planck : null;
  function use(p) { pl = p; }
  var DT = 1 / 60, G = -12, WW = 10, WH = 16;
  var PET_R = 0.55, BEE_R = 0.15, LINE_R = 0.1, HIVE_R = 0.62, MIN_SEG = 0.28;
  var BEE_SPEED = 3.1, BEE_FORCE = 0.34, LINE_DENSITY = 2.4;
  var BEE_GROUP = -2; // bees don't bump into each other

  function rng(seed) { var s = seed >>> 0 || 1; return function () { s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function V(x, y) { return pl.Vec2(x, y); }

  // ---------------------------------------------------------------- building a level ----------------------------------------------------------------
  // level: { terrain: [[x,y]...] convex polygons, spikes: [{x,y,w,dir}], maces: [{x,y,r}], pools: [{x0,x1,y0,y1,kind}],
  //          crates: [{x,y,w,h}], pets: [{x,y}], hives: [{x,y,n}], rage, time, ink }
  function create(level, seed) {
    var world = new pl.World({ gravity: V(0, G) });
    var S = { level: level, world: world, R: rng(seed || 1), t: 0, started: false, over: null, events: [], pets: [], bees: [], hives: [], crates: [], line: null, stroke: [], ink: 0, spawnT: 0, lastBump: 0 };
    var ground = world.createBody();
    ground.setUserData({ kind: 'terrain' });
    (level.terrain || []).forEach(function (poly) { ground.createFixture(new pl.Polygon(poly.map(function (p) { return V(p[0], p[1]); })), { friction: 0.9 }).setUserData({ kind: 'terrain' }); });
    (level.spikes || []).forEach(function (sp) { spikeRow(ground, sp).forEach(function (tri) { ground.createFixture(new pl.Polygon(tri.map(function (p) { return V(p[0], p[1]); })), { friction: 0.5 }).setUserData({ kind: 'spike' }); }); });
    (level.maces || []).forEach(function (m) { ground.createFixture(new pl.Circle(V(m.x, m.y), m.r), { friction: 0.5 }).setUserData({ kind: 'spike' }); });
    (level.pools || []).forEach(function (p) { ground.createFixture(new pl.Box((p.x1 - p.x0) / 2, (p.y1 - p.y0) / 2, V((p.x0 + p.x1) / 2, (p.y0 + p.y1) / 2), 0), { isSensor: true }).setUserData({ kind: 'pool', pool: p.kind }); });
    (level.hives || []).forEach(function (h) {
      var hb = world.createBody({ position: V(h.x, h.y) }); hb.createFixture(new pl.Circle(HIVE_R), { friction: 0.6 }).setUserData({ kind: 'hive' }); hb.setUserData({ kind: 'hive' });
      S.hives.push({ x: h.x, y: h.y, n: h.n, out: 0, body: hb });
    });
    (level.crates || []).forEach(function (c) {
      var b = world.createBody({ type: 'dynamic', position: V(c.x, c.y), angle: c.a || 0, awake: false });
      b.createFixture(new pl.Box(c.w / 2, c.h / 2), { density: c.heavy ? 3 : 0.8, friction: 0.8 }).setUserData({ kind: 'crate' });
      b.setUserData({ kind: 'crate' }); S.crates.push({ body: b, w: c.w, h: c.h, heavy: !!c.heavy });
    });
    (level.pets || []).forEach(function (p, i) {
      var b = world.createBody({ type: 'dynamic', position: V(p.x, p.y), awake: false, fixedRotation: true });
      b.createFixture(new pl.Circle(PET_R), { density: 1, friction: 0.7, restitution: 0.05 }).setUserData({ kind: 'pet', i: i });
      b.setUserData({ kind: 'pet', i: i }); S.pets.push({ body: b, i: i, hurt: null });
    });
    world.on('begin-contact', function (c) { contact(S, c); });
    return S;
  }
  // a row of spike triangles: base from (x, y) to (x + w, y) pointing dir (up/down/left/right)
  function spikeRow(b, sp) {
    var out = [], n = Math.max(1, Math.round(sp.w / 0.36)), step = sp.w / n, h = 0.34;
    for (var i = 0; i < n; i++) {
      var a = sp.x + i * step, c = a + step;
