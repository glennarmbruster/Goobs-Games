<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5a54f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goobs-Games">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
<link rel="stylesheet" href="../../shared/goobs.css">
<script src="../../shared/goobs.js"></script>
<title>Peg Lagoon</title>
<style>
/* Peg Lagoon styles (themes, UI kit and ad cards come from /shared/goobs.css). The lagoon itself is drawn on the canvas
   edge to edge; the kit floats the back / sound / Menu buttons over it; the shot controls float at the bottom. */
html.gg-fs-over, html.gg-fs-over body { background: #0b4f86; }
#cv { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
.app { touch-action: none; }
.brand svg { border-radius: 10px; }

/* the score pill: level number, score, and a meter with the two- and three-star marks */
.hud { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; }
.scorepill { display: flex; align-items: center; gap: 7px; height: 44px; padding: 0 12px 0 5px; border-radius: 22px; position: relative; min-width: 0; }
.scorepill .lvl { min-width: 32px; height: 32px; padding: 0 6px; border-radius: 16px; background: linear-gradient(135deg, #22b2cf, #1b6fb0); color: #fff; font-size: 14px; font-weight: 900;
  display: flex; align-items: center; justify-content: center; }
.scorepill b { font-size: 18px; font-weight: 900; min-width: 54px; text-align: right; letter-spacing: -.3px; }
.scorepill .meter { position: relative; width: 62px; height: 9px; border-radius: 5px; background: rgba(20,40,80,.15); overflow: visible; }
.scorepill .meter #meterFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 5px; background: linear-gradient(90deg, #ffcf3d, #ff9a3c); transition: width .3s; }
.scorepill .meter s { position: absolute; top: -4px; width: 2px; height: 17px; background: #c78a00; border-radius: 1px; }
.scorepill .meter s::after { content: "\2605"; position: absolute; top: -13px; left: -5px; font-size: 10px; color: #e0a800; text-decoration: none; }
.scorepill .meter s.got { background: #ffb300; }

/* bottom controls: guide/power chip, the fine-aim dial, shoot */
.bar { position: fixed; left: max(calc(env(safe-area-inset-left, 0px) + 8px), calc(50vw - 280px)); right: max(calc(env(safe-area-inset-right, 0px) + 8px), calc(50vw - 280px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); height: 56px; display: flex; align-items: center; gap: 8px; z-index: 5; }
.guidechip { flex: none; height: 52px; border: 0; border-radius: 26px; padding: 0 12px 0 4px; display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.92); color: #1b2130; box-shadow: 0 3px 10px rgba(0,0,0,.22); max-width: 42vw; }
.guidechip .gface { width: 44px; height: 44px; border-radius: 22px; background: #e9f6ff; display: grid; place-items: center; overflow: hidden; flex: none; }
.guidechip .gtxt { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; min-width: 0; }
.guidechip b { font-size: 14px; font-weight: 900; }
.guidechip small { font-size: 11px; font-weight: 800; color: #6b7385; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.guidechip.on { background: #fff4c2; box-shadow: 0 0 0 3px #ffc53d, 0 3px 10px rgba(0,0,0,.22); }
.guidechip.on small { color: #9a6a00; }
.dial { position: relative; flex: 1 1 auto; height: 44px; border-radius: 22px; overflow: hidden; background: rgba(8,30,60,.55); box-shadow: inset 0 2px 6px rgba(0,0,0,.35); touch-action: none; min-width: 60px; }
.dial canvas { display: block; width: 100%; height: 100%; }
.dial .dlbl { position: absolute; left: 12px; top: 0; bottom: 0; display: flex; align-items: center; font-size: 9px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.5); pointer-events: none; }
.firebtn { flex: none; width: 56px; height: 56px; border-radius: 28px; border: 0; color: #fff; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #ff9db0, #ff5d73 55%, #d63a57); box-shadow: 0 4px 12px rgba(214,58,87,.5), inset 0 -3px 0 rgba(0,0,0,.15); }
.firebtn svg { width: 28px; height: 28px; }
.firebtn:active { transform: scale(.94); }
.firebtn:disabled, .bar.busy .firebtn { opacity: .45; }
.bar.busy .dial { opacity: .5; }
.bar.hide { display: none; }
.toast { position: fixed; left: 50%; top: 28%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 6;
  background: rgba(6,26,52,.85); color: #fff; font-weight: 800; font-size: 16px; padding: 9px 16px; border-radius: 14px; max-width: 86vw; }
.toast.show { opacity: 1; }

/* full-screen overlays (title, map): no dimming, the lagoon shows through the title */
.overlay.plfull { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; align-items: stretch; }
#ovTitle { align-items: center; justify-content: center; z-index: 5; }
.titlebox { width: min(92vw, 380px); text-align: center; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 24vh; }
.logo { display: flex; flex-direction: column; align-items: center; line-height: .9; font-family: var(--round); font-weight: 900; letter-spacing: -1px;
  filter: drop-shadow(0 4px 0 rgba(5,40,80,.45)) drop-shadow(0 10px 24px rgba(0,30,60,.35)); }
.logo .w1 { font-size: 60px; color: #ffe27a; -webkit-text-stroke: 2px #b8640c; }
.logo .w2 { font-size: 66px; background: linear-gradient(#ffffff, #9ff0ff 55%, #42c6e8); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 2px #0d5b8c; }
.tag { color: #fff; font-weight: 800; font-size: 16px; text-shadow: 0 2px 6px rgba(0,30,60,.6); margin-bottom: 8px; }
.tbtns { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.tbtns .btn { flex: none; width: 100%; background: rgba(255,255,255,.92); color: #1b2130; }
.tbtns .btn.red { background: linear-gradient(135deg, #ff7a8e, #ff5d73); color: #fff; box-shadow: 0 8px 20px -6px rgba(214,58,87,.8); }
.tbtns .btn.big { min-height: 60px; font-size: 21px; font-weight: 900; }
.tinfo { color: #fff; font-weight: 700; font-size: 14px; text-shadow: 0 1px 4px rgba(0,30,60,.7); min-height: 18px; }

/* the map: a scrolling chart of islands, each with its own sea picture and its levels along a dotted route */
#ovMap { background: #0b3550; }
.mapwrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
.maphead { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px; background: rgba(6,26,52,.9); color: #fff; z-index: 2; }
.maphead h2 { margin: 0; font-size: 21px; font-weight: 900; color: #fff; }
.maphead small { color: #ffe27a; font-weight: 800; font-size: 13px; }
.maphead > div { flex: 1 1 auto; min-width: 0; }
.maphead .iconbtn { border-radius: 22px; width: 44px; height: 44px; flex: none; }
.maphead .iconbtn .chev { font-size: 32px; line-height: 1; margin: -4px 0 0 -2px; color: #1b2130; }
.maphead .btn { flex: none; min-height: 44px; padding: 0 20px; background: linear-gradient(135deg, #ff7a8e, #ff5d73); color: #fff; }
.mapscroll { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
.isl { position: relative; width: 100%; max-width: 560px; margin: 0 auto; overflow: hidden; }
.isl canvas.islbg { position: absolute; inset: 0; width: 100%; height: 100%; }
.isl .ihead { position: absolute; left: 12px; top: 10px; right: 12px; display: flex; align-items: center; gap: 10px; color: #fff; text-shadow: 0 2px 6px rgba(0,20,40,.7); pointer-events: none; }
.isl .ihead canvas { flex: none; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.isl .ihead b { display: block; font-size: 20px; font-weight: 900; }
.isl .ihead small { display: block; font-size: 13px; font-weight: 700; opacity: .9; }
.isl .ihead .istars { margin-left: auto; font-weight: 900; color: #ffe27a; font-size: 15px; white-space: nowrap; }
.lvnode { position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; border: 3px solid #fff; padding: 0;
  background: radial-gradient(circle at 35% 30%, #ffffff, #bfeeff 45%, #4fb6e8); color: #0b3a66; font-weight: 900; font-size: 18px; box-shadow: 0 4px 10px rgba(0,30,60,.4);
  display: flex; align-items: center; justify-content: center; }
.lvnode .st { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); font-size: 13px; letter-spacing: -1px; color: #ffd34d; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; }
.lvnode .st i { font-style: normal; color: rgba(255,255,255,.35); }
.lvnode.done { background: radial-gradient(circle at 35% 30%, #fff8e0, #ffd78a 45%, #f0a43a); color: #6a3a00; }
.lvnode.cur { background: radial-gradient(circle at 35% 30%, #ffe0e6, #ff8ea0 45%, #ff5d73); color: #fff; animation: plpulse 1.4s ease-in-out infinite; }
.lvnode.lock { background: rgba(30,60,90,.75); color: rgba(255,255,255,.45); border-color: rgba(255,255,255,.35); box-shadow: none; }
@keyframes plpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.isl.locked .ihead { opacity: .7; }

/* level start card */
.startsheet { max-height: 92vh; }
.sthead { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.stnum { flex: none; min-width: 52px; height: 52px; padding: 0 8px; border-radius: 26px; background: linear-gradient(135deg, #22b2cf, #1b6fb0); color: #fff; font-size: 22px; font-weight: 900; display: grid; place-items: center; }
.sthead h2 { margin: 0; }
.stinfo { color: var(--muted); font-weight: 700; font-size: 14px; }
.stfacts { display: flex; gap: 8px; margin: 8px 0 10px; }
.stfacts > div { flex: 1; background: var(--surface-2); border-radius: 14px; padding: 8px 4px; text-align: center; }
.stfacts b { display: block; font-size: 22px; font-weight: 900; color: var(--ink); }
.stfacts span { font-size: 12px; font-weight: 700; color: var(--muted); }
.stfacts .coral b { color: #e0405d; }
.stfacts .stars2 b { font-size: 18px; line-height: 27px; white-space: nowrap; }
.stlabel { font-weight: 800; font-size: 15px; margin: 2px 0 6px; }
.stlabel small { display: block; font-weight: 600; font-size: 13px; color: var(--muted); margin-top: 2px; }
.guides { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.gd { position: relative; border: 2px solid var(--line); border-radius: 16px; background: var(--surface-2); padding: 6px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink); }
.gd b { font-size: 14px; font-weight: 900; }
.gd small { font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1.15; text-align: center; }
.gd.on { border-color: var(--accent); background: var(--accent-soft); }
.gd.lock { opacity: .4; }
.gd .lk { position: absolute; top: 4px; right: 6px; font-size: 10px; font-weight: 800; color: var(--muted); }

/* end card */
.endcard h2 { font-size: 26px; }
.bigstars { display: flex; justify-content: center; gap: 6px; margin: 2px 0 8px; }
.bigstars svg { width: 46px; height: 46px; color: var(--line-strong); }
.bigstars svg.got { color: #ffc531; filter: drop-shadow(0 2px 4px rgba(200,120,0,.4)); animation: starpop .4s cubic-bezier(.2,1.6,.4,1) both; }
.bigstars svg:nth-child(2) { width: 56px; height: 56px; margin-top: -8px; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
.endlines { margin: 4px 0 14px; font-size: 16px; color: var(--muted); line-height: 1.5; }
.endlines b { color: var(--ink); }
.endlines .total { font-size: 30px; font-weight: 900; color: var(--ink); letter-spacing: -.5px; display: block; }
.endcard .cardicon canvas { border-radius: 50%; background: var(--surface-2); }

/* settings: a small segmented control */
.seg { display: flex; gap: 3px; background: var(--surface-2); border-radius: 12px; padding: 3px; flex: none; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 7px 9px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.stattbl { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 6px; }
.stattbl td { padding: 7px 2px; border-bottom: 1px solid var(--line); }
.stattbl td:last-child { text-align: right; font-weight: 800; }
@media (max-width: 380px) { .scorepill .meter { width: 46px; } .scorepill b { font-size: 16px; min-width: 44px; } .guidechip .gtxt small { display: none; } .logo .w1 { font-size: 50px; } .logo .w2 { font-size: 56px; } }
@media (max-height: 700px) { .titlebox { margin-top: 16vh; } }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="pl-logo" viewBox="0 0 100 100"><defs><linearGradient id="plg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe6f2"/><stop offset=".55" stop-color="#1fa3c8"/><stop offset="1" stop-color="#0b4f86"/></linearGradient></defs>
<rect width="100" height="100" rx="24" fill="url(#plg)"/><path d="M0 84 Q25 76 50 84 T100 82 V100 H0z" fill="#f3d9a0"/>
<g><circle cx="22" cy="44" r="6" fill="#79d4ff"/><circle cx="38" cy="56" r="6" fill="#ff6f86"/><circle cx="62" cy="56" r="6" fill="#79d4ff"/><circle cx="78" cy="44" r="6" fill="#ff6f86"/><circle cx="50" cy="70" r="6" fill="#ffd34d"/><circle cx="30" cy="72" r="6" fill="#79d4ff"/><circle cx="70" cy="72" r="6" fill="#b46cff"/></g>
<ellipse cx="50" cy="20" rx="13" ry="11.5" fill="#a65cf0"/><circle cx="45.5" cy="20" r="3.4" fill="#fff"/><circle cx="54.5" cy="20" r="3.4" fill="#fff"/><circle cx="46" cy="21" r="1.6" fill="#24143d"/><circle cx="55" cy="21" r="1.6" fill="#24143d"/>
<path d="M40 28 q-6 6 -10 4 M46 30 q-2 6 -5 8 M54 30 q2 6 5 8 M60 28 q6 6 10 4" stroke="#7b3fd1" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="50" cy="40" r="4" fill="#eef3fb"/></symbol>
<symbol id="i-sound-on" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" fill-opacity=".15"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19.3 5.7a9 9 0 0 1 0 12.6"/></g></symbol>
<symbol id="i-sound-off" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" fill-opacity=".15"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></g></symbol>
<symbol id="i-stats" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></g></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></g></symbol>
<symbol id="i-help" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.9M12 17.3v.2"/></g></symbol>

<symbol id="i-new" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v5h-5"/></g></symbol>

<symbol id="i-fire" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="16" r="5" fill="currentColor"/><path d="M12 2.5v6M8.6 5.6L12 9l3.4-3.4"/></g></symbol>

</defs></svg>

<div class="app" id="app">
  <div class="top">
    <button class="brand homebtn" id="btnHome" aria-label="Back to all games">
      <span class="chev" aria-hidden="true">&#8249;</span>
      <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#pl-logo"/></svg>
      <h1>Peg Lagoon</h1>
    </button>
    <div class="hud" id="hud">
      <div class="ggpill scorepill" id="pScore"><span class="lvl" id="pLevel">1</span><b id="score">0</b><i class="meter"><i id="meterFill"></i><s id="mk2"></s><s id="mk3"></s></i></div>
    </div>
    <div class="topbtns">
      <button class="iconbtn" id="btnSound" aria-label="Sound"><svg viewBox="0 0 24 24"><use href="#i-sound-off"/></svg></button>
    </div>
  </div>

  <canvas id="cv"></canvas>
  <div class="toast" id="toast"></div>

  <div class="bar" id="bar">
    <button class="guidechip" id="guideChip" aria-label="Guide and power"><span class="gface" id="gFace"></span><span class="gtxt"><b id="gName">Tavi</b><small id="gPow">Ink Trail</small></span></button>
    <div class="dial" id="dial" aria-label="Fine aim: drag sideways"><canvas id="dialCv"></canvas><span class="dlbl">fine aim</span></div>
    <button class="firebtn" id="btnFire" aria-label="Shoot"><svg viewBox="0 0 24 24"><use href="#i-fire"/></svg></button>
  </div>

  <div class="toolbar">
    <button class="tool" id="btnMap"><svg viewBox="0 0 24 24"><use href="#i-map"/></svg><span>Map</span></button>
    <button class="tool" id="btnRestart"><svg viewBox="0 0 24 24"><use href="#i-new"/></svg><span>Restart level</span></button>
    <button class="tool" id="btnHelp"><svg viewBox="0 0 24 24"><use href="#i-help"/></svg><span>How to play</span></button>
    <button class="tool" id="btnStats"><svg viewBox="0 0 24 24"><use href="#i-stats"/></svg><span>Stats</span></button>
    <button class="tool" id="btnSettings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg><span>Settings</span></button>
  </div>
</div>

<!-- Title -->
<div class="overlay plfull" id="ovTitle">
  <div class="titlebox">
    <div class="logo"><span class="w1">Peg</span><span class="w2">Lagoon</span></div>
    <div class="tag">Aim. Bounce. Clear the coral.</div>
    <div class="tbtns">
      <button class="btn red big" id="tPlay">Play</button>
      <button class="btn" id="tMap">Island map</button>
      <button class="btn" id="tHelp">How to play</button>
    </div>
    <div class="tinfo" id="tInfo"></div>
  </div>
</div>

<!-- Map -->
<div class="overlay plfull" id="ovMap">
  <div class="mapwrap">
    <div class="maphead"><button class="iconbtn" id="mapBack" aria-label="Back"><span class="chev">&#8249;</span></button><div><h2>Island map</h2><small id="mapStars"></small></div><button class="btn red" id="mapPlay">Play</button></div>
    <div class="mapscroll" id="mapScroll"></div>
  </div>
</div>

<!-- Level start card -->
<div class="overlay" id="ovStart">
  <div class="sheet startsheet" role="dialog" aria-label="Level start">
    <div class="sthead"><div class="stnum" id="stNum">1</div><div><h2 id="stTitle">First Splash</h2><div class="stinfo" id="stInfo"></div></div></div>
    <div class="stfacts" id="stFacts"></div>
    <div class="stlabel">Pick a guide <small id="stPowHelp"></small></div>
    <div class="sheetbody"><div class="guides" id="stGuides"></div></div>
    <div class="actions"><button class="btn" id="stMap">Map</button><button class="btn red" id="btnStart">Play</button></div>
  </div>
</div>

<!-- How to play -->
<div class="overlay" id="ovHelp">
  <div class="sheet" role="dialog" aria-label="How to play">
    <h2>How to play</h2>
    <div class="sheetbody"><ol class="helplist" id="helpList"></ol></div>
    <div class="actions"><button class="btn red" id="btnCloseHelp">Let's play</button></div>
  </div>
</div>

<!-- Settings -->
<div class="overlay" id="ovSettings">
  <div class="sheet" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <div class="sheetbody">
      <div class="themelabel">Theme (all games)</div>
      <div class="themes" id="themes"></div>
      <label class="row"><div>Sound<small>Plinks, pops and the fanfare.</small></div><span class="switch"><input type="checkbox" id="setSound"><span></span></span></label>
      <label class="row"><div>Music<small>A gentle island tune.</small></div><span class="switch"><input type="checkbox" id="setMusic"><span></span></span></label>
      <label class="row"><div>Shoot when you let go<small>Off: aim, then tap the shoot button.</small></div><span class="switch"><input type="checkbox" id="setRelease"><span></span></span></label>
      <div class="row"><div>Aim line<small>How far the dotted line shows.</small></div>
        <div class="seg" id="setGuide"><button data-v="1">Short</button><button data-v="2">Bounce</button><button data-v="3">Long</button></div></div>
      <label class="row"><div>Reduce motion<small>No screen shake, slower light and water.</small></div><span class="switch"><input type="checkbox" id="setReduce"><span></span></span></label>
      <label class="row"><div>Old-time ads<small>Joke ads between levels. This switch is shared by all Goobs-Games.</small></div><span class="switch"><input type="checkbox" id="setAds"><span></span></span></label>
      <div class="row" id="rowAdEvery"><div>Show an ad every<small>Counted in finished levels.</small></div>
        <div class="stepper"><button id="adLess" aria-label="Fewer">&minus;</button><b id="adEvery">3</b><button id="adMore" aria-label="More">+</button></div></div>
      <div class="version" id="version">Peg Lagoon</div>
    </div>
    <div class="actions"><button class="btn red" id="btnCloseSettings">Done</button></div>
  </div>
</div>

<!-- Stats -->
<div class="overlay" id="ovStats">
  <div class="sheet" role="dialog" aria-label="Stats">
    <h2>Your Peg Lagoon records</h2>
    <div class="sheetbody" id="statsBody"></div>
    <div class="actions"><button class="btn red" id="btnCloseStats">Done</button></div>
  </div>
</div>

<!-- Win / fail card -->
<div class="overlay center" id="ovEnd">
  <div class="card endcard" role="dialog">
    <div class="cardicon" id="cardIcon"></div>
    <h2 id="endTitle"></h2>
    <div id="endText"></div>
    <div class="actions" id="endActions"></div>
  </div>
</div>

<script>
/* Peg Lagoon logic: the board, the ball physics, shots, scoring, powers, the bot, the level builder and the level maker.
   Plain JS, no DOM: the same file runs on the phone, in the phone's level-making Worker and in Node (tools/check.js).
   Determinism: everything here uses only + - * / and Math.sqrt (both exactly rounded by IEEE 754) plus our own
   sine (dsin), never Math.sin/cos/atan2 (engines may differ in the last bit). So a level made from its number, and a shot
   replayed from the same state and angle, come out identical in Node, Chrome and the iPhone's Safari. */
// The module is a named function (PLModule) so the app can rebuild it inside a Web Worker from its own source.
function PLModule() {
  'use strict';
  // ---------------- board and physics constants (board units; the board is 400 x 620) ----------------
  var W = 400, H = 620, BR = 7, BIG_R = 14, PR = 9, BHW = 5.5, G = 520, V0 = 600, TPS = 120, DT = 1 / 120, VMAX = 1150;
  var LX = 200, LY = 46;                         // where the ball leaves the launcher
  var AIM_MAX = 1.66;                             // about 95 degrees either side of straight down
  var CAT_Y = H - 18, CAT_W = 74, CAT_SPEED = 100, CAT_RIM = 5;
  var E_PEG = 0.72, E_BRICK = 0.66, E_WALL = 0.78, BUMP_MIN = 420;
  var PTS = { n: 10, t: 100, p: 10, g: 500 };
  var MULT = [[0, 1], [0.4, 2], [0.6, 3], [0.75, 5], [0.9, 10]];
  var FREE_AT = [4000, 8000, 15000];             // shot score that earns a free ball (each once a shot)
  var BUCKETS = [10000, 20000, 40000, 20000, 10000];
  var BALL_BONUS = 5000, SWEEP_BONUS = 25000;
  var GRID = 40, GX = Math.ceil((W + 80) / GRID), GY = Math.ceil((H + 120) / GRID);
  var PI = 3.141592653589793, TAU = 6.283185307179586, DEG = PI / 180;

  // ---------------- deterministic math ----------------
  function dsin(x) {
    x = x % TAU; if (x > PI) x -= TAU; else if (x < -PI) x += TAU;
    if (x > PI / 2) x = PI - x; else if (x < -PI / 2) x = -PI - x;
    var x2 = x * x;
    return x * (1 - x2 / 6 * (1 - x2 / 20 * (1 - x2 / 42 * (1 - x2 / 72 * (1 - x2 / 110 * (1 - x2 / 156 * (1 - x2 / 210 * (1 - x2 / 272))))))));
  }
  function dcos(x) { return dsin(x + PI / 2); }
  function rng(seed) { var s = seed >>> 0 || 1; return function () { s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function round1(v) { return Math.round(v * 10) / 10; }

  // ======================================================================================================
  // Level builder. Level data is plain arrays (so it can be saved, sent to a Worker and checked in Node):
  //   pegs   [x, y, ty, m]                round pegs (radius PR)
  //   bricks [x1, y1, x2, y2, ty, m]      straight bricks (capsules, half thickness BHW)
  //   arcs   [cx, cy, R, a0, a1, ty, m]   curved bricks (angles in degrees, a1 - a0 <= 180)
  //   bumps  [x, y, r, m]                 sea-urchin bumpers (bounce harder, never cleared)
  //   ports  [x1, y1, x2, y2]             a pair of whirlpools (in one, out of the other)
  //   movers [{k:'rot', cx, cy, w}]  w degrees a second | {k:'swing', cx, cy, amp, per} | {k:'slide', dx, dy, per}
  // ty: 'n' ordinary pearl, 't' coral (target), 'p' sea-urchin power peg; '' = to be picked by finish().
  // m: index into movers, or -1.
  // ======================================================================================================
  function Builder() { this.pegs = []; this.bricks = []; this.arcs = []; this.bumps = []; this.ports = []; this.movers = []; this.m = -1; }
  var BP = Builder.prototype;
  function segDist(x1, y1, x2, y2, px, py) {

    return best;
  }

  // pictures drawn from several strokes can share their meeting points
  BP.peg = function (x, y, ty) {

  };

    var m = this.m, i, q;
    for (i = 0; i < this.pegs.length; i++) { q = this.pegs[i]; if (q[3] === m && (q[0] - x) * (q[0] - x) + (q[1] - y) * (q[1] - y) < (r + PR) * (r + PR)) return true; }
    for (i = 0; i < this.bumps.length; i++) { q = this.bumps[i]; if (q[3] === m && (q[0] - x) * (q[0] - x) + (q[1] - y) * (q[1] - y) < (r + q[2]) * (r + q[2])) return true; }
    for (i = 0; i < this.ports.length; i++) { q = this.ports[i]; if (m < 0 && ((q[0] - x) * (q[0] - x) + (q[1] - y) * (q[1] - y) < (r + 15) * (r + 15) || (q[2] - x) * (q[2] - x) + (q[3] - y) * (q[3] - y) < (r + 15) * (r + 15))) return true; }
    for (i = 0; i < this.bricks.length; i++) { q = this.bricks[i]; if (q[5] === m && segDist(q[0], q[1], q[2], q[3], x, y) < r + BHW) return true; }

  };

  BP.pegIn = function (x, y, ty) {
    var dx = x - LX, dy = y - LY;
    if (x < PR + 3 || x > W - PR - 3 || y < LY + 36 + PR || y > H - 48 - PR || dx * dx + dy * dy < 62 * 62) return this;
    return this.peg(x, y, ty);
  };
  BP.brick = function (x1, y1, x2, y2, ty) { this.bricks.push([round1(x1), round1(y1), round1(x2), round1(y2), ty || '', this.m]); return this; };

  BP.bump = function (x, y, r) { this.bumps.push([round1(x), round1(y), r || 13, this.m]); return this; };
  BP.port = function (x1, y1, x2, y2) { this.ports.push([round1(x1), round1(y1), round1(x2), round1(y2)]); return this; };
  // movers: everything added inside fn moves together
  BP.move = function (spec, fn) { var prev = this.m; this.movers.push(spec); this.m = this.movers.length - 1; fn(this); this.m = prev; return this; };
  BP.spin = function (cx, cy, w, fn) { return this.move({ k: 'rot', cx: cx, cy: cy, w: w }, fn); };
  BP.swing = function (cx, cy, amp, per, fn) { return this.move({ k: 'swing', cx: cx, cy: cy, amp: amp, per: per }, fn); };
  BP.slide = function (dx, dy, per, fn) { return this.move({ k: 'slide', dx: dx, dy: dy, per: per }, fn); };
  // n pegs evenly round a circle (from angle a0, degrees; skip: indices left out)
  BP.ring = function (cx, cy, R, n, a0, ty, skip) {
    for (var i = 0; i < n; i++) { if (skip && skip.indexOf(i) >= 0) continue; var a = ((a0 || 0) + 360 * i / n) * DEG; this.peg(cx + R * dcos(a), cy + R * dsin(a), ty); }
    return this;
  };
  // pegs along an arc from a0 to a1 (degrees), n of them, ends included
  BP.arcPegs = function (cx, cy, R, a0, a1, n, ty) {
    for (var i = 0; i < n; i++) { var a = (a0 + (a1 - a0) * (n === 1 ? 0.5 : i / (n - 1))) * DEG; this.peg(cx + R * dcos(a), cy + R * dsin(a), ty); }
    return this;
  };
  // pegs on a straight line, ends included
  BP.line = function (x1, y1, x2, y2, n, ty) {
    for (var i = 0; i < n; i++) { var t = n === 1 ? 0.5 : i / (n - 1); this.peg(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, ty); }
    return this;
  };
  // a ring of curved bricks: n pieces with a visible gap (board units) between them
  BP.arcRing = function (cx, cy, R, n, gap, a0, ty) {
    var span = 360 / n, gd = (gap + 2 * BHW) / R / DEG;
    for (var i = 0; i < n; i++) { var s = (a0 || 0) + span * i; this.arc(cx, cy, R, s + gd / 2, s + span - gd / 2, ty); }
    return this;
  };
  // curved bricks along an arc a0..a1 (degrees) cut into n pieces with a visible gap (board units)
  BP.arcBricks = function (cx, cy, R, a0, a1, n, gap, ty) {
    var span = (a1 - a0) / n, gd = ((gap === undefined ? 5 : gap) + 2 * BHW) / R / DEG;
    for (var i = 0; i < n; i++) this.arc(cx, cy, R, a0 + span * i + gd / 2, a0 + span * (i + 1) - gd / 2, ty);
    return this;
  };
  // straight bricks along a line cut into n pieces, with a visible gap (board units) between them
  BP.brickLine = function (x1, y1, x2, y2, n, gap, ty) {
    gap = (gap === undefined ? 6 : gap) + 2 * BHW;
    var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy), ux = dx / L, uy = dy / L, seg = L / n;
    for (var i = 0; i < n; i++) {
      var a = seg * i + gap / 2, b = seg * (i + 1) - gap / 2;
      this.brick(x1 + ux * a, y1 + uy * a, x1 + ux * b, y1 + uy * b, ty);
    }
    return this;
  };
  // a rectangular (or staggered) grid of pegs
  BP.grid = function (x0, y0, cols, rows, dx, dy, stagger, mask) {
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      if (stagger && r % 2 && c === cols - 1) continue;
      if (mask && !mask(c, r)) continue;
      this.peg(x0 + c * dx + (stagger && r % 2 ? dx / 2 : 0), y0 + r * dy);
    }
    return this;
  };
  // a spiral of pegs from radius r0 to r1 over `turns`
  BP.spiral = function (cx, cy, r0, r1, turns, n, a0, ty) {
    for (var i = 0; i < n; i++) { var t = i / (n - 1), a = ((a0 || 0) + 360 * turns * t) * DEG, R = r0 + (r1 - r0) * t; this.peg(cx + R * dcos(a), cy + R * dsin(a), ty); }
    return this;
  };
  // pegs on a spiral, evenly spaced along it (about `sp` apart)
  BP.spiralEven = function (cx, cy, r0, r1, turns, sp, a0, ty) {
    var pts = [], N = 400;
    for (var i = 0; i <= N; i++) { var t = i / N, a = ((a0 || 0) + 360 * turns * t) * DEG, R = r0 + (r1 - r0) * t; pts.push([cx + R * dcos(a), cy + R * dsin(a)]); }
    return this.polyPegs(pts, sp, false, ty);
  };
  // pegs evenly spaced (about sp apart, ends included) along a polyline; closed: back to the start.
  // A short list of points is a polygon: every corner gets a peg and each side is spaced on its own. A long list
  // (a sampled curve) is spaced along its length. Pegs that would land on top of one already placed are skipped.
  BP.polyPegs = function (pts, sp, closed, ty) {
    var P = pts.slice(); if (closed) P.push(pts[0]);
    var out = [];
    function seglen(i) { return Math.sqrt((P[i][0] - P[i - 1][0]) * (P[i][0] - P[i - 1][0]) + (P[i][1] - P[i - 1][1]) * (P[i][1] - P[i - 1][1])); }
    if (P.length <= 14) {
      for (var i = 1; i < P.length; i++) {
        var n = Math.max(1, Math.round(seglen(i) / sp));
        for (var k = 0; k < n; k++) out.push([P[i - 1][0] + (P[i][0] - P[i - 1][0]) * k / n, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * k / n]);
      }
      if (!closed) out.push(P[P.length - 1]);
    } else {
      var L = 0, seg = []; for (var j = 1; j < P.length; j++) { var d = seglen(j); seg.push(d); L += d; }
      var m = Math.max(1, Math.round(L / sp)), step = L / m, cnt = closed ? m : m + 1;
      for (var q = 0; q < cnt; q++) {
        var want = q * step, jj = 0; while (jj < seg.length - 1 && want > seg[jj]) { want -= seg[jj]; jj++; }
        var f = seg[jj] ? Math.min(1, want / seg[jj]) : 0; out.push([P[jj][0] + (P[jj + 1][0] - P[jj][0]) * f, P[jj][1] + (P[jj + 1][1] - P[jj][1]) * f]);
      }
    }
    var placed = [], self = this, min = 2 * PR + 2;
    out.forEach(function (o) {
      for (var z = 0; z < placed.length; z++) { var dx = placed[z][0] - o[0], dy = placed[z][1] - o[1]; if (dx * dx + dy * dy < min * min) return; }
      placed.push(o); self.peg(o[0], o[1], ty);
    });
    return this;
  };
  // a curve (quadratic: from p0 bending towards p1, ending at p2) as points
  function quad(x0, y0, x1, y1, x2, y2) { var o = []; for (var i = 0; i <= 60; i++) { var t = i / 60, u = 1 - t; o.push([u * u * x0 + 2 * u * t * x1 + t * t * x2, u * u * y0 + 2 * u * t * y1 + t * t * y2]); } return o; }
  BP.curve = function (x0, y0, x1, y1, x2, y2, sp, ty) { return this.polyPegs(quad(x0, y0, x1, y1, x2, y2), sp, false, ty); };
  // straight bricks following a curve: n pieces between evenly spaced points, with a visible gap
  BP.curveBricks = function (x0, y0, x1, y1, x2, y2, n, gap, ty) {
    var pts = quad(x0, y0, x1, y1, x2, y2), L = 0, cum = [0];
    for (var i = 1; i < pts.length; i++) { L += Math.sqrt((pts[i][0] - pts[i - 1][0]) * (pts[i][0] - pts[i - 1][0]) + (pts[i][1] - pts[i - 1][1]) * (pts[i][1] - pts[i - 1][1])); cum.push(L); }
    function at(d) { var j = 1; while (j < cum.length - 1 && cum[j] < d) j++; var f = (d - cum[j - 1]) / ((cum[j] - cum[j - 1]) || 1); return [pts[j - 1][0] + (pts[j][0] - pts[j - 1][0]) * f, pts[j - 1][1] + (pts[j][1] - pts[j - 1][1]) * f]; }

    for (var k = 0; k < n; k++) { var a = at(piece * k + g2), b = at(piece * (k + 1) - g2); this.brick(a[0], a[1], b[0], b[1], ty); }
    return this;
  };
  // points on an ellipse (degrees a0..a1, turned by rot degrees about its centre)
  function ellPts(cx, cy, rx, ry, a0, a1, rot) {

  // pegs round an ellipse (whole: a0..a1 omitted) about sp apart

  // straight bricks following any polyline: n pieces with a visible gap
  BP.pathBricks = function (pts, n, gap, ty) {
    var L = 0, cum = [0];
    for (var i = 1; i < pts.length; i++) { L += Math.sqrt((pts[i][0] - pts[i - 1][0]) * (pts[i][0] - pts[i - 1][0]) + (pts[i][1] - pts[i - 1][1]) * (pts[i][1] - pts[i - 1][1])); cum.push(L); }
    function at(d) { var j = 1; while (j < cum.length - 1 && cum[j] < d) j++; var f = (d - cum[j - 1]) / ((cum[j] - cum[j - 1]) || 1); return [pts[j - 1][0] + (pts[j][0] - pts[j - 1][0]) * f, pts[j - 1][1] + (pts[j][1] - pts[j - 1][1]) * f]; }

    for (var k = 0; k < n; k++) { var a = at(piece * k + g2), b = at(piece * (k + 1) - g2); this.brick(a[0], a[1], b[0], b[1], ty); }

  BP.ellipseBricks = function (cx, cy, rx, ry, a0, a1, n, gap, rot, ty) { return this.pathBricks(ellPts(cx, cy, rx, ry, a0, a1, rot), n, gap, ty); };

  // (moving things are kept clear over their whole motion)

    var times = [0], mv = this.movers; mv.forEach(function (m) { if (m.k === 'rot') return; for (var k = 1; k < 40; k++) times.push(m.per * k / 40); });
    times.forEach(function (t) { samples(lv, t).forEach(function (q) { if ((t === 0 && (q[4] < 0 || mv[q[4]].k !== 'rot')) || (q[4] >= 0 && mv[q[4]].k !== 'rot')) S.push(q); }); });

    setMusic: function (v) { musicOn = !!v; if (musicOn) { ctx(); musicStart(); } else musicStop(); },
    setKey: function (i) { mKey = i | 0; },

    unlock: function () { if (on || musicOn) ctx(); },

    fire: function () { if (!on) return; noise(900, 0.8, 0.12, 0.12); tone('sine', 300, 700, 0.1, 0.12); },

    bump: function () { if (on) { tone('sine', 520, 180, 0.22, 0.18); noise(300, 1, 0.08, 0.08); } },

    free: function () { if (!on) return; [12, 16, 19].forEach(function (s, i) { tone('sine', 523.25 * Math.pow(2, s / 12), 0, 0.4, 0.1, i * 0.05); }); },
    style: function () { if (!on) return; [7, 11, 14, 19].forEach(function (s, i) { tone('triangle', 523.25 * Math.pow(2, s / 12), 0, 0.25, 0.06, i * 0.035); }); },
    power: function (k) {

      else if (k === 'puff') { noise(200, 0.6, 0.6, 0.35, 0, 'lowpass'); tone('sine', 120, 40, 0.5, 0.3); noise(2500, 1, 0.15, 0.1); }

      else if (k === 'twin') { [0, 7, 12].forEach(function (s, i) { pan(659.25 * Math.pow(2, s / 12), 0.4, 0.1, i * 0.04); }); }
      else if (k === 'moon') { tone('sine', 330, 660, 0.8, 0.09, 0, null, 0.2); tone('sine', 495, 990, 0.8, 0.05, 0.05, null, 0.2); }

    rollStart: rollStart, rollStop: rollStop,
    // the last coral is hit: a crash and a chord

    // "Splashdown": our own little steel-band fanfare (G C E G, E G C' with a bass)

    firework: function () { if (on) { noise(400 + Math.random() * 400, 0.7, 0.35, 0.18, 0, 'lowpass'); noise(4000, 1, 0.25, 0.05, 0.05, 'highpass'); } },
    bucket: function (big) { if (!on) return; for (var i = 0; i < (big ? 9 : 5); i++) tone('triangle', 1800 + Math.random() * 1400, 0, 0.12, 0.05, i * 0.05); },
    count: function () { if (on) tone('sine', 1400, 0, 0.04, 0.05); },
    win: function () { if (!on) return; [0, 4, 7, 12, 7, 12, 16].forEach(function (s, i) { pan(392 * Math.pow(2, s / 12), 0.4, 0.1, i * 0.09); }); },
    lose: function () { if (!on) return; [7, 5, 4, 0].forEach(function (s, i) { tone('triangle', 330 * Math.pow(2, s / 12), 0, 0.35, 0.09, i * 0.16); }); },
    star: function (i) { if (on) pan(784 * Math.pow(2, [0, 4, 7][i % 3] / 12), 0.4, 0.12); },
    click: function () { if (on) tone('sine', 900, 0, 0.03, 0.04); }
  };
})();
</script>

<script>
/* Peg Lagoon app: screens (title, island map, level card, win / fail cards, how to play, stats, settings), aiming by

(function () {
  'use strict';

  function saveSettings() { store.set('settings', settings); }
  var meta = store.get('meta', null) || {};

  for (var mk in MD) if (meta[mk] === undefined || typeof meta[mk] !== typeof MD[mk]) meta[mk] = MD[mk];
  meta.open = Math.max(1, meta.open | 0); meta.cur = Math.max(1, Math.min(meta.open, meta.cur | 0));
  if (!GK[meta.guide]) meta.guide = 'tavi';
  function saveMeta() { store.set('meta', meta); }
  var stats = store.get('stats', null) || {};
  var SD = { shots: 0, lit: 0, coral: 0, catches: 0, splash: 0, styles: 0, powers: 0, wins: 0, fails: 0, bestShot: 0, free: 0, threeStars: 0 };
  for (var sk in SD) if (typeof stats[sk] !== 'number') stats[sk] = SD[sk];
  function saveStats() { store.set('stats', stats); }

  // ================= helpers =================
  function $(id) { return document.getElementById(id); }

  function isOpen(id) { var e = $(id); return !!(e && e.classList.contains('show')); }

  function show(id) { $(id).classList.add('show'); }

  function islName(i) { return i < 6 ? PL_ISLANDS[i].name : 'Open Sea ' + (i - 5); }

  function gotMade(n, lv) { if (!lv || !lv.pegs) return; keepMade(n, lv); var cbs = want[n] || []; delete want[n]; cbs.forEach(function (cb) { cb(lv); }); }

      w.onerror = function (e) { if (e && e.preventDefault) e.preventDefault(); try { w.terminate(); } catch (x) { /* gone */ } GW = { send: makeHere }; Object.keys(want).forEach(function (k2) { makeHere(+k2); }); };

    } catch (e) { GW = { send: makeHere }; }
  }
  function need(n, cb) {
    var lv = levelAt(n); if (lv) { if (cb) cb(lv); return; }

    if (first) { genSetup(); GW.send(n); }
  }

  // ================= game state =================
  var g = null, lvl = null, levelNo = 1, shot = null, phase = 'none', screen = 'title';
  var aimAng = 0.25, aiming = false, cancelAim = false, guideP = null, guideKey = '';
  var fx = [], texts = [], rings = [], bolts = [], popping = {}, popQ = [], popT = 0, popN = 0, trails = {}, bumpT = {}, portT = 0, catchT = 0;
  var shake = 0, flash = 0, hitStop = 0, timeScale = 1, slow = false, slowMiss = 0, predictT = 0;
  var cam = { z: 1, x: W / 2, y: H / 2, tz: 1, tx: W / 2, ty: H / 2 };
  var lastMult = 1, mood = 'calm', moodT = 0, banner = null, finaleT = -1, chestRise = 0, chestHot = -1, chestHotT = 0, fireworksT = 0, lastRes = null, afterPops = null;
  var t = 0, amb = { fish: [], bub: [], plank: [] };

  function startLevel(n, quick) {

    var lv = levelAt(n);

      showCard('Level ' + fmt(n), '<p>Making this level&hellip;</p>', [{ label: 'Island map', go: openMap }], null);
      need(n, function () { if (isOpen('ovEnd') && phase === 'wait') { hide('ovEnd'); startLevel(n, quick); } });

    screen = 'play'; updateChrome(); setBackdrop();

    if (quick) { saveGame(); } else openStart();

  }
  function resetFx() {

    shake = 0; flash = 0; hitStop = 0; timeScale = 1; slow = false; cam.z = cam.tz = 1; cam.x = cam.tx = W / 2; cam.y = cam.ty = H / 2; mood = 'calm'; afterPops = null; S.rollStop();
  }
  function saveGame() { if (g && !g.won && !g.lost && (phase === 'aim' || phase === 'card')) store.set('game', { n: levelNo, snap: PL.snap(g), ang: aimAng }); }
  function loadGame() {
    var r = store.get('game', null);
    if (!r || !r.snap || !r.n) return false;
    var lv = levelAt(r.n); if (!lv) return false;
    var g2 = PL.restore(lv, r.snap); if (!g2) return false;
    levelNo = r.n; lvl = lv; g = g2; aimAng = typeof r.ang === 'number' ? r.ang : 0.25; resetFx(); lastMult = PL.mult(g); phase = 'aim'; shot = null; guideP = null;
    return true;
  }

  // ================= layout =================
  var cv = $('cv'), cx = cv.getContext('2d'), dpr = 1, VW = 0, VH = 0, B = { x: 0, y: 0, w: 0, h: 0, s: 1 }, Q = 2, bg = null, bgKey = '';
  function layout() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    VW = window.innerWidth; VH = window.innerHeight;
    cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr);
    var top = $('app').querySelector('.top').getBoundingClientRect().bottom + 4, bar = $('bar').getBoundingClientRect(), bottom = (bar.height ? bar.top : VH - 70) - 6;
    var avail = Math.max(200, bottom - top), s = Math.min((VW - 8) / W, avail / H);
    B.s = s; B.w = W * s; B.h = H * s; B.x = (VW - B.w) / 2; B.y = top + Math.max(0, (avail - B.h) * 0.3);

    bgKey = '';

    setBackdrop();
    drawDial();
  }
  function clearSprites() { if (g) g.els.forEach(function (e) { e._spr = null; }); }
  function setBackdrop() {
    var isl = screen === 'play' ? islOf(levelNo) : islOf(meta.cur), key = isl + ':' + VW + 'x' + VH + ':' + dpr + ':' + Goobs.skin();
    if (key === bgKey) return; bgKey = key;
    bg = A.backdrop(isl, Math.round(VW * dpr), Math.round(VH * dpr), { x: B.x * dpr, y: B.y * dpr, w: B.w * dpr, h: B.h * dpr, s: B.s * dpr }, Goobs.skin() === 'halloween');
    amb.isl = isl;
  }
  function toBoard(px, py) { return [(px - B.x) / B.s, (py - B.y) / B.s]; }
  function toClient(x, y) { return [B.x + (W / 2 + (x - cam.x) * cam.z) * B.s, B.y + (H / 2 + (y - cam.y) * cam.z) * B.s]; }

  // ================= ambient life =================
  function stepAmb(dt) {
    var R = Math.random;
    if (amb.fish.length < 3 && R() < dt * 0.15) { var dir = R() < 0.5 ? 1 : -1; amb.fish.push({ x: dir > 0 ? -0.1 : 1.1, y: 0.15 + R() * 0.65, s: 6 + R() * 8, dir: dir, v: (0.02 + R() * 0.03) * dir, ph: R() * 9, col: ['rgba(255,190,90,.55)', 'rgba(255,255,255,.35)', 'rgba(90,200,255,.45)', 'rgba(255,120,150,.45)'][Math.floor(R() * 4)] }); }
    amb.fish.forEach(function (f) { f.x += f.v * dt; }); amb.fish = amb.fish.filter(function (f) { return f.x > -0.2 && f.x < 1.2; });
    if (amb.bub.length < 14 && R() < dt * 3) amb.bub.push({ x: R(), y: 1.02, r: 1.5 + R() * 3, v: 0.03 + R() * 0.05, ph: R() * 9 });
    amb.bub.forEach(function (b) { b.y -= b.v * dt; }); amb.bub = amb.bub.filter(function (b) { return b.y > -0.05; });
    if (!amb.plank.length) for (var i = 0; i < 40; i++) amb.plank.push({ x: R(), y: R(), r: 0.8 + R() * 1.4, ph: R() * 9 });

  }

  // ================= aiming, shooting =================

  function setAimTo(bx, by) {

  function fire() {

    trails = {}; mood = 'calm'; predictT = 0; slowMiss = 0;

  dial.addEventListener('pointerdown', function (e) { S.unlock(); if (!canAim()) return; dialOn = true; dialX = e.clientX; try { dial.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } e.preventDefault(); });

  });

  function drawDial() {
    var w = dial.clientWidth, h = dial.clientHeight; if (!w) return;

      x.fillStyle = 'rgba(255,255,255,' + (0.12 + 0.5 * f * f) + ')'; x.fillRect(px, h * 0.22, 2, h * 0.5);
    }

  // ================= events from the logic =================
  function onEvents(ev) {
    for (var i = 0; i < ev.length; i++) {

        burst(e.x, e.y, col, e.ty === 'n' ? 4 : 9, e.ty === 'n' ? 0.7 : 1.1);
        if (e.ty === 't' || e.ty === 'g') text('+' + fmt(e.pts), e.x, e.y - 14, e.ty === 'g' ? '#ffe27a' : '#ffd0da', e.ty === 'g' ? 15 : 12);
        if (e.ty === 'g') { rings.push({ x: e.x, y: e.y, r: 8, v: 90, life: 0.5, t: 0, col: '255,226,122' }); shake = Math.max(shake, 3); }
        if (e.ty === 't') {

          var mNow = PL.mult(g); if (mNow > lastMult && !g.finale) { lastMult = mNow; text('\u00d7' + mNow + ' POINTS!', W / 2, 150, '#ffe27a', 22, true); S.style(); }
        }

      } else if (e.t === 'tap') S.tap();

  $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncSettings(); });
  $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncSettings(); });
  $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); S.setEnabled(settings.sound); if (settings.sound) S.click(); syncSettings(); });
  Goobs.themePicker($('themes'));
  Goobs.onTheme(function () { bgKey = ''; setBackdrop(); });
  $('version').textContent = 'Peg Lagoon ' + VERSION;

  $('btnMap').addEventListener('click', function () { openMap(); });
  $('btnRestart').addEventListener('click', function () { if (screen !== 'play' || !g) { startLevel(meta.cur); return; } startLevel(levelNo); });
  $('btnHome').addEventListener('click', function () { if (g && phase === 'aim') saveGame(); saveMeta(); Goobs.home(); });

  // ================= start up =================
  var menu = Goobs.fullscreen({
    overlay: true, menu: ['btnMap', 'btnRestart', 'btnHelp', 'btnStats', 'btnSettings'],
    info: function () {
      if (screen === 'play' && g) return 'Level <b>' + fmt(levelNo) + '</b>' + (lvl.name ? ' · ' + lvl.name : '') + ' · ' + islName(islOf(levelNo)) + '<br>Score <b>' + fmt(g.score) + '</b> · ' + PL.targetsLeft(g) + ' coral left · ' + Math.max(0, g.balls) + ' balls';
      return 'Furthest level <b>' + fmt(meta.open) + '</b> · ' + totalStars() + ' ★';
    },
    onOpen: function () { S.pause(true); }, onClose: function () { S.pause(false); }
  });
  Goobs.markPlayed('pegs');
  Goobs.initUpdates({ beforeReload: function () { if (g && phase === 'aim') saveGame(); saveMeta(); } });
  S.setEnabled(settings.sound); if (settings.music) S.setMusic(true);
  syncSettings();
  window.addEventListener('resize', function () { setTimeout(layout, 60); });
  window.addEventListener('orientationchange', function () { setTimeout(layout, 300); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { if (g && phase === 'aim') saveGame(); S.pause(true); } else S.pause(false); });
  window.addEventListener('pagehide', function () { if (g && phase === 'aim') saveGame(); });

  // open back where you were: in a level (from the start of the current shot), on the map, or the title
  layout();
  if (meta.screen === 'play' && loadGame()) { screen = 'play'; setBackdrop(); updateChrome(); }
  else if (meta.screen === 'map') { screen = 'map'; openMap(); }
  else openTitle();
  layout();
  requestAnimationFrame(frame);

  // ================= test hook =================
  window.__pegs = {
    PL: PL, get g() { return g; }, get shot() { return shot; },
    state: function () { return { screen: screen, phase: phase, level: levelNo, score: g ? g.score : 0, balls: g ? g.balls : 0, coral: g ? PL.targetsLeft(g) : 0, finale: !!(g && g.finale), won: !!(g && g.won), lost: !!(g && g.lost), aim: aimAng, slow: slow, cam: cam.z, power: g ? g.power : '', open: meta.open, made: Object.keys(made).map(Number), lastMakeMs: lastMakeMs }; },
    level: function (n, quick) { hide('ovTitle'); hide('ovMap'); hide('ovEnd'); hide('ovStart'); startLevel(n, quick); },
    setAim: function (a) { aimAng = a; },
    fire: fire,
    botAngle: function (seed) { return PL.botAngle(g, PL.rng(seed || (g.shotNo + 1) * 7919)); },
    // board point -> where it is on screen (css px), for real touches
    client: function (x, y) { return toClient(x, y); },
    aimPoint: function (a, r) { r = r || 160; return toClient(PL.LX + Math.sin(a) * r, PL.LY + Math.cos(a) * r); },
    fast: function (k) { fast = k || 0; },
    frameMs: function () { var a = frameMs.slice().sort(function (p, q) { return p - q; }); return { n: a.length, avg: a.reduce(function (s, v) { return s + v; }, 0) / (a.length || 1), p95: a[Math.floor(a.length * 0.95)] || 0, max: a[a.length - 1] || 0 }; },
    resetFrames: function () { frameMs = []; rafGaps = []; },
    flush: function (on) { flushPerf = !!on; },
    rafMs: function () { var a = rafGaps.slice().sort(function (p, q) { return p - q; }); return { n: a.length, avg: a.reduce(function (s, v) { return s + v; }, 0) / (a.length || 1), p95: a[Math.floor(a.length * 0.95)] || 0 }; },
    meta: meta, settings: settings, levelAt: levelAt,
    setPower: function (p) { if (g) g.power = p; updateChrome(); },
    // make the next shot's ball hit a power pearl (tests: aim at it)
    powerPeg: function () { if (!g) return null; var e = g.els.filter(function (q) { return q.ty === 'p' && !q.gone && !q.lit; })[0]; return e ? { x: e.x, y: e.y, ang: PL.aimFor(e.x, e.y) } : null; },
    clearAllBut: function (k) { var ts = g.els.filter(function (q) { return q.ty === 't' && !q.gone; }); ts.slice(k).forEach(function (q) { q.gone = true; }); guideP = null; saveGame(); },
    layout: function () { return { B: B, dpr: dpr, VW: VW, VH: VH, Q: Q }; },
    // play any level object (frame-time tests with a 150-peg board)
    custom: function (lv, power) { hide('ovTitle'); hide('ovMap'); hide('ovEnd'); hide('ovStart'); lvl = lv; levelNo = lv.n || 999; g = PL.create(lv, { power: power || 'twin', seed: 5 }); resetFx(); shot = null; phase = 'aim'; screen = 'play'; guideP = null; updateChrome(); setBackdrop(); }
  };
})();
</script>
</body>
</html>
