<style>
/* Topple Fair styles (themes, UI kit and ad cards come from /shared/goobs.css) */
.brand svg { border-radius: 10px; }
.stagewrap { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: stretch; justify-content: center; }
.stage { position: relative; flex: 1 1 auto; max-width: 620px; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); touch-action: none;
  background: linear-gradient(#5fb8f5 0%, #9fd8fb 45%, #d9f1ff 62%, #bfe6a0 62.1%, #7dcf5a 100%); }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; left: 10px; top: 10px; pointer-events: none; display: flex; gap: 6px; }
.ballsleft { background: rgba(255,255,255,.88); color: #1b1f33; font-weight: 900; font-size: 20px; padding: 4px 11px 4px 8px; border-radius: 14px; display: flex; align-items: center; gap: 6px;
  box-shadow: 0 2px 0 rgba(0,0,0,.12); }
.ballsleft i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8 0 15%, #ffc53d 40%, #e0772a 100%); display: inline-block; }
.ballsleft.low { background: #ffe1e5; color: #c81e3a; }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: #1b3a6b; pointer-events: none; }
.loading.hide { display: none; }
.toast { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(10,14,36,.78); color: #fff; font-weight: 800; font-size: 16px; padding: 8px 15px; border-radius: 14px; white-space: nowrap; }
.toast.show { opacity: 1; }
.lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lv { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); height: 52px; font-weight: 800; font-size: 16px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.lv small { font-size: 11px; color: #e0a800; letter-spacing: -1px; }
.lv.cur { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.lv:disabled { opacity: .35; }
.stars { font-size: 26px; color: #ffc83d; letter-spacing: 2px; }
.stars .off { color: var(--line-strong); }
.cardicon svg { border-radius: 16px; }
.brand h1 { font-size: 21px; }
@media (max-width: 385px) { .brand h1 { font-size: 19px; } }
</style>

<script>
/* Topple Fair logic: the carnival knock-down stand. A stack of cans and blocks sits on a stand; throw balls at it and
   knock every piece off the stand before the balls run out. cannon-es does the physics (passed in with TF.use, so
   this file runs in the browser and in Node). Levels are made from rules here and proven by tools/gen.js: a bot
   has to clear each one with the physics the game uses, and the level gets a few more balls than the bot needed. */
var TF = (function () {
  'use strict';
  var C = null;
  // the stand: top at y = 0, centered on x = 0 and z = 0
  var PW = 5.4, PD = 1.5, PT = 0.3, GROUND = -3.4, GRAV = -24;
  var LAUNCH = [0, 0.55, 8.5], SPEED = 30, BALLR = 0.27, BALLM = 4.5, BALL_LIFE = 3.2;
  // the pieces: half sizes (the physics shape is a box; cans are drawn round), mass, points
  var KINDS = {
    r: { name: 'can', hx: 0.2, hy: 0.25, hz: 0.2, m: 0.45, can: true },    // red can
    u: { name: 'can', hx: 0.2, hy: 0.25, hz: 0.2, m: 0.45, can: true },    // blue can
    y: { name: 'can', hx: 0.2, hy: 0.25, hz: 0.2, m: 0.45, can: true },    // yellow can
    b: { name: 'block', hx: 0.245, hy: 0.245, hz: 0.245, m: 0.8 },          // wood block
    p: { name: 'plank', hx: 0.74, hy: 0.09, hz: 0.24, m: 0.9 },             // board across three columns
    h: { name: 'heavy', hx: 0.245, hy: 0.245, hz: 0.245, m: 2.6 }           // heavy ice block
  };
  var ROWH = { can: 0.5, block: 0.49, plank: 0.18, heavy: 0.49 };
  var OFF_Y = -0.7;          // a piece this far below the stand's top is off
  var GAP = 0.004;

  function use(cannon) { C = cannon; }
  function rng(seed) { var s = seed >>> 0 || 1; return function () { s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // ---------------- level maker ----------------
  // A level is a list of pieces [kind, x, y, z] (centers). Structures are built bottom-up in columns 0.5 apart,
  // so every piece stands on the stand or on a piece below it.
  var SHAPES = {
    heart: ['.rr.rr.', 'rrrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'],
    castle: ['r.r.r.r', 'uuuuuuu', 'u.uuu.u', 'uuuuuuu', 'bbbbbbb'],
    arch: ['.yyyyy.', 'yyyyyyy', 'yy...yy', 'yy...yy', 'yy...yy'],
    cup: ['r.....r', 'rr...rr', 'rrr.rrr', 'rrrrrrr', '.rrrrr.'],
    star: ['...y...', '..yyy..', 'yyyyyyy', '.yyyyy.', '.yy.yy.', 'yy...yy'],
    smile: ['.bbbbb.', 'bybbbyb', 'bbbbbbb', 'byyyyyb', 'bbyyybb', '.bbbbb.'],
    tree: ['...u...', '..uuu..', '.uuuuu.', 'uuuuuuu', '...b...', '...b...'],
    rocket: ['...r...', '..rur..', '..rur..', '..rrr..', '.rrrrr.', 'r.r.r.r'],
    duck: ['..yy...', '.yyyr..', '..yy...', 'yyyyyy.', 'yyyyyyy', '.yyyyy.'],
    house: ['...r...', '..rrr..', '.rrrrr.', 'bbbbbbb', 'bb.b.bb', 'bb.b.bb']
  };
  var CANS = 'ruy';
  function colX(i, n) { return (i - (n - 1) / 2) * 0.5; }
  // stack rows (bottom first) of strings; every character is a column 0.5 wide
  function fromRows(rows, zs, out) {
    var n = 0; rows.forEach(function (r) { n = Math.max(n, r.length); });
    var h = new Array(n).fill(0); // current height of each column
    rows.forEach(function (row) {
      for (var i = 0; i < row.length; i++) {
        var k = row[i]; if (k === '.' || k === ' ') continue;
        var K = KINDS[k], x = colX(i, n);
        if (k === 'p') { // a plank spans columns i-1 .. i+1 and rests on the tallest of them
          var top = Math.max(h[i - 1] || 0, h[i], h[i + 1] || 0);
          zs.forEach(function (z) { out.push([k, x, top + K.hy + GAP, z]); });
          [i - 1, i, i + 1].forEach(function (j) { if (j >= 0 && j < n) h[j] = top + K.hy * 2 + GAP; });
          continue;
        }
        zs.forEach(function (z) { out.push([k, x, h[i] + K.hy + GAP, z]); });
        h[i] += K.hy * 2 + GAP;
      }
    });
    return out;
  }
  // a shape drawn top-down: turn it bottom-up and fill any hole under a piece so nothing floats
  function fromShape(lines, zs, fill) {
    var n = lines[0].length, rows = lines.slice().reverse().map(function (s) { return s.split(''); });
    for (var c = 0; c < n; c++) {
      var seen = false;
      for (var r = rows.length - 1; r >= 0; r--) { if (rows[r][c] !== '.') seen = true; else if (seen) rows[r][c] = fill; }
    }
    rows = rows.map(function (r) { return r.join(''); });
    return fromRows(rows, zs, []);
  }
  function pickCan(R) { return CANS[Math.floor(R() * 3)]; }
  function repeat(ch, n) { return new Array(n + 1).join(ch); }
  // a pyramid: each can rests on two below it
  function pyramidItems(base, zs, R, heavyBase) {
    var out = [], y = 0;
    for (var r = 0; r < base; r++) {
      var cnt = base - r, K = KINDS.r;
      for (var i = 0; i < cnt; i++) {
        var k = heavyBase && r === 0 && i % 2 ? 'h' : pickCan(R), KK = KINDS[k];
        zs.forEach(function (z) { out.push([k, (i - (cnt - 1) / 2) * 0.5, y + KK.hy + GAP, z]); });
      }
      y += (heavyBase && r === 0 ? KINDS.h.hy : K.hy) * 2 + GAP;
      if (heavyBase && r === 0) { // the heavy row is a little shorter than cans: keep every can's bottom on the same level
        out.forEach(function (it) { if (it[0] !== 'h' && Math.abs(it[2] - (K.hy + GAP)) < 1e-6) it[2] = KINDS.h.hy - K.hy + K.hy + GAP; });
      }
    }
    return out;
  }
  // stepped tiers: a row of cans, boards across them, a narrower row of cans on the boards, and so on
  function tierItems(widths, zs, R) {
    var out = [], y = 0;
    widths.forEach(function (w, t) {
      var K = KINDS.r;
      for (var i = 0; i < w; i++) { var k = pickCan(R); zs.forEach(function (z) { out.push([k, (i - (w - 1) / 2) * 0.5, y + K.hy + GAP, z]); }); }
      y += K.hy * 2 + GAP;
      if (t < widths.length - 1) {
        var planks = Math.floor(w / 3);
        for (var j = 0; j < planks; j++) { var x = (j - (planks - 1) / 2) * 1.5; zs.forEach(function (z) { out.push(['p', x, y + KINDS.p.hy + GAP, z]); }); }
        y += KINDS.p.hy * 2 + GAP;
      }
    });
    return out;
  }
  function rowsBuild(rows) { return function (zs) { return fromRows(rows, zs, []); }; }
  // size grows with the level, then varies at random once it is at its largest
  function size(n, R, lo, hi, per) { var cap = Math.min(hi, lo + Math.floor(n / per)); return cap >= hi && R() < 0.6 ? lo + 1 + Math.floor(R() * (hi - lo)) : Math.max(lo, cap - (R() < 0.3 ? 1 : 0)); }
  function shift(items, dx) { return items.map(function (it) { return [it[0], it[1] + dx, it[2], it[3]]; }); }
  // a table: two posts with a board across, cans on the board
  function tableItems(tops, zs, R, post) {
    var rows = [], ph = post || 2;
    for (var r = 0; r < ph; r++) rows.push('b.b');
    rows.push('.p.');
    var out = fromRows(rows, zs, []), y = 0; out.forEach(function (it) { if (it[0] === 'p') y = it[2] + KINDS.p.hy; });
    for (var t = 0; t < tops; t++) { var cnt = 3 - (t % 2), k; for (var i = 0; i < cnt; i++) { k = pickCan(R); var yy = y + KINDS.r.hy + GAP; zs.forEach(function (z) { out.push([k, (i - (cnt - 1) / 2) * 0.5, yy, z]); }); } y += KINDS.r.hy * 2 + GAP; }
    return out;
  }
  var SMALL = [
    function (n, R, zs) { return pyramidItems(3 + Math.floor(R() * 2), zs, R, false); },
    function (n, R, zs) { var h = 2 + Math.floor(R() * 4), rows = []; for (var r = 0; r < h; r++) rows.push(pickCan(R) + pickCan(R)); return fromRows(rows, zs, []); },
    function (n, R, zs) { return tableItems(1 + Math.floor(R() * 3), zs, R, 1 + Math.floor(R() * 2)); },
    function (n, R, zs) { var h = 3 + Math.floor(R() * 4), rows = []; for (var r = 0; r < h; r++) rows.push(r === 0 && n > 20 ? 'h' : pickCan(R)); return fromRows(rows, zs, []); }
  ];

<script>
/* Topple Fair app: the fairground scene (three.js), the throwing cannon, touch-to-shoot aiming, the physics loop
   (cannon-es, through TF in logic.js), levels with stars, stats, saves and house ads.
   three.js and cannon-es come from /shared and load when the game opens. */
(function () {
  'use strict';
  var S = TFSound, LEVELS = window.TF_LEVELS || [];
  var STEP = 1 / 60, T = null, C = null;
  var PIECE_COL = TFScene.PIECE_COL;

  // ================= storage =================
  var store = Goobs.store('topple');
  var settings = { sound: false, adEvery: 3, fancy: true };
  (function () {
    var s = store.get('settings', {}) || {};
    for (var k in settings) if (typeof s[k] === typeof settings[k]) settings[k] = s[k];
    settings.adEvery = Math.min(10, Math.max(1, settings.adEvery | 0));
  })();
  function saveSettings() { store.set('settings', settings); }
  var meta = store.get('meta', null) || {};
  var MD = { level: 1, open: 1, stars: {}, seen: false, finished: 0, lastAdAt: 0 };
  for (var mk in MD) if (meta[mk] === undefined) meta[mk] = MD[mk];
  if (typeof meta.stars !== 'object' || !meta.stars) meta.stars = {};
  meta.open = Math.max(1, Math.min(LEVELS.length, meta.open | 0));
  meta.level = Math.max(1, Math.min(meta.open, meta.level | 0));
  function saveMeta() { store.set('meta', meta); }
  var stats = store.get('stats', null) || {};
  var SD = { throws: 0, knocked: 0, cleared: 0, tries: 0 };

  function saveStats() { store.set('stats', stats); }

  // ================= helpers =================
  function $(id) { return document.getElementById(id); }
  function isOpen(id) { return $(id).classList.contains('show'); }
  function sheetOpen() { return isOpen('ovEnd') || isOpen('ovSettings') || isOpen('ovStats') || isOpen('ovHelp') || isOpen('ovLevels') || GoobsAds.isOpen(); }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  // ================= the scene (scene.js) =================

  var geos = {}, pieceMeshes = [], ballMeshes = [], cannon = null, barrel = null, reticle = null, fx = [];
  function build() {
    SC = TFScene.build(T, canvas, TF, { fancy: settings.fancy });
    renderer = SC.renderer; scene = SC.scene; camera = SC.camera; cannon = SC.cannon; barrel = SC.barrel; reticle = SC.reticle; geos = SC.geos;

    ballMeshes.forEach(function (m) { scene.remove(m.mesh); }); ballMeshes = [];

    levelData = LEVELS[levelNo - 1];
    if (!ready) { renderInfo(); return; }

    sim.items.forEach(function (it) {
      var m = SC.pieceMesh(it.k);

      m.scale.set(0.01, 0.01, 0.01); m.userData.pop = performance.now() + (it.b.position.y * 60 + Math.abs(it.b.position.x) * 25);
      scene.add(m); pieceMeshes.push(m);

    if (!sim || state !== 'play' || sim.ballsLeft <= 0) return false;
    if (sim.t - sim.lastShotT < 0.28) return false;
    var ball = TF.shoot(sim, p);
    if (!ball) return false;
    var m = SC.ballMesh(); m.position.copy(ball.b.position); scene.add(m);
    ballMeshes.push({ ball: ball, mesh: m });
    cannonAim = [p[0] - TF.LAUNCH[0], p[1] - TF.LAUNCH[1] + 0.8, p[2] - TF.LAUNCH[2]]; recoil = 1;
    stats.throws++; saveStats();

    renderInfo();

    });
  }
  function checkEnd() {

    if (TF.cleared(sim)) { state = 'won'; endT = performance.now(); saveStats(); setTimeout(won, 900); burst(); return; }
    if (sim.ballsLeft <= 0 && !TF.flying(sim) && (TF.settled(sim) || sim.t - sim.lastShotT > 6)) { state = 'lost'; saveStats(); setTimeout(lost, 500); }

    if (meta.open <= levelNo) meta.open = Math.min(LEVELS.length, levelNo + 1);
    saveMeta();
    var last = levelNo >= LEVELS.length;
    showCard('Level ' + levelNo + ' cleared!', '<div class="stars">' + [0, 1, 2].map(function (i) { return i < st ? '★' : '<span class="off">★</span>'; }).join('') + '</div>' +
      sim.shots + ' of ' + levelData.balls + ' balls used' + (last ? '<br>That was the last stand!' : ''),
      last ? [{ label: 'Play it again', red: true, go: function () { between(function () { startLevel(levelNo); }); } }, { label: 'Pick a level', go: openLevels }] :
        [{ label: 'Next: level ' + (levelNo + 1), red: true, go: function () { between(function () { startLevel(levelNo + 1); }); } }, { label: 'Play it again', go: function () { between(function () { startLevel(levelNo); }); } }]);
  }
  function lost() {
    S.lose(); meta.finished++; saveMeta(); saveStats();
    var n = TF.left(sim);
    showCard('Out of balls', n + (n === 1 ? ' piece is' : ' pieces are') + ' still on the stand.', [{ label: 'Try again', red: true, go: function () { between(function () { startLevel(levelNo); }); } }, { label: 'Pick a level', go: openLevels }]);
  }

  // ================= effects =================
  function puff(x, y, z, cols, n, sp) {
    if (!fx.parts) fx.parts = [];
    for (var i = 0; i < n && fx.parts.length < 160; i++) {
      var m = new T.Mesh(geos.confetti, new T.MeshBasicMaterial({ color: cols[i % cols.length], side: T.DoubleSide, transparent: true }));
      m.position.set(x, y, z); scene.add(m);
      fx.parts.push({ m: m, v: [(Math.random() - 0.5) * sp * 2, Math.random() * sp * 2 + 1, (Math.random() - 0.5) * sp], spin: [Math.random() * 8, Math.random() * 8], life: 0.9 + Math.random() * 0.5, t: 0 });
    }
  }
  function burst() { for (var i = 0; i < 5; i++) puff((i - 2) * 1.1, 0.5 + Math.random() * 1.5, 0, ['#e8354a', '#3a86ff', '#ffc53d', '#2ec27e', '#ffffff'], 14, 4); }
  function stepFx(dt) {
    if (!fx.parts) return;
    fx.parts = fx.parts.filter(function (p) {
      p.t += dt; p.v[1] -= 9 * dt;
      p.m.position.x += p.v[0] * dt; p.m.position.y += p.v[1] * dt; p.m.position.z += p.v[2] * dt;
      p.m.rotation.x += p.spin[0] * dt; p.m.rotation.y += p.spin[1] * dt;
      p.m.material.opacity = Math.max(0, 1 - p.t / p.life);
      if (p.t >= p.life) { scene.remove(p.m); p.m.material.dispose(); return false; }
      return true;
    });
  }

  // ================= loop =================
  function frame(tms) {
    requestAnimationFrame(frame);
    if (!ready) return;
    var dt = Math.min(0.1, lastT ? (tms - lastT) / 1000 : 0); lastT = tms;
    var paused = sheetOpen() || document.hidden;
    if (sim && !paused && state !== 'idle') {
      acc += dt; var n = 0;
      while (acc >= STEP && n < 3) { TF.step(sim, STEP); onEvents(); acc -= STEP; n++; }
      if (n === 3) acc = 0;
      checkEnd();
    }
    var now = performance.now();
    pieceMeshes = pieceMeshes.filter(function (m) {
      var it = m.userData.item, b = it.b;
      m.position.copy(b.position); m.quaternion.copy(b.quaternion);
      var s = m.scale.x;
      if (it.gone) { s -= dt * 3; if (s <= 0.02) { scene.remove(m); return false; } m.scale.set(s, s, s); }
      else if (s < 1 && now >= m.userData.pop) { s = Math.min(1, s + dt * 5); m.scale.set(s, s, s); }
      return true;
    });
    ballMeshes = ballMeshes.filter(function (bm) {
      bm.mesh.position.copy(bm.ball.b.position); bm.mesh.quaternion.copy(bm.ball.b.quaternion);
      if (bm.ball.gone) { var s = bm.mesh.scale.x - dt * 4; if (s <= 0.05) { scene.remove(bm.mesh); return false; } bm.mesh.scale.set(s, s, s); }
      return true;
    });
    if (!paused) stepFx(dt);
    // the cannon turns toward the aim and kicks back on a throw
    var ax = cannonAim[0], ay = cannonAim[1], az = cannonAim[2];
    var yaw = Math.atan2(-ax, -az), pitch = Math.atan2(ay, Math.hypot(ax, az));
    barrel.rotation.set(0, 0, 0); cannon.rotation.y += (yaw - cannon.rotation.y) * Math.min(1, dt * 14);
    barrel.rotation.x = pitch; recoil = Math.max(0, recoil - dt * 4); barrel.position.z = recoil * 0.35;
    SC.update(dt);
    if (reticle) { var mk = markT < 0 ? 1 : (now - markT) / 450; reticle.visible = state === 'play' && mk < 1; if (reticle.visible) { var sc = 1.3 + mk * 1.2; reticle.scale.set(sc, sc, sc); reticle.children.forEach(function (c) { c.material.transparent = true; c.material.opacity = 1 - mk; }); } }
    renderer.render(scene, camera);
  }

  // ================= touch to shoot =================
  // Touch the screen where you want the ball to go: it fires the moment your finger lands. A quick marker flashes
  // where you touched. The ball flies at the front of the piece you touched (or the spot in the air above the stand).
  var aim = [0, 1, 0], markT = -1;
  function clampAimPt(p) { p[0] = Math.max(-4.5, Math.min(4.5, p[0])); p[1] = Math.max(0.3, Math.min(8, p[1])); return p; }
  function aimHome() { return [0, 1, 0]; }
  function pointAt(clientX, clientY) {
    var r = canvas.getBoundingClientRect(), nx = (clientX - r.left) / r.width * 2 - 1, ny = -((clientY - r.top) / r.height * 2 - 1);
    raycaster.setFromCamera(new T.Vector2(nx, ny), camera);
    var live = pieceMeshes.filter(function (m) { return !m.userData.item.off; });
    var hit = raycaster.intersectObjects(live, false)[0];
    if (hit) { aim = clampAimPt([hit.point.x, hit.point.y, 0]); return [hit.point.x, Math.max(0.3, hit.point.y), hit.point.z]; }
    // no piece under the finger: the spot on the stand's plane (z = 0)
    var o = raycaster.ray.origin, d = raycaster.ray.direction, t = Math.abs(d.z) > 1e-4 ? -o.z / d.z : 20;
    aim = clampAimPt([o.x + d.x * t, o.y + d.y * t, 0]); return aim.slice();
  }
  function showReticle() {
    if (!reticle) return;
    reticle.position.set(aim[0], aim[1], 0); reticle.lookAt(camera.position);
    cannonAim = [aim[0] - TF.LAUNCH[0], aim[1] - TF.LAUNCH[1] + 0.8, -TF.LAUNCH[2]];
  }
  function onDown(e) {
    if (!ready || sheetOpen() || state !== 'play') return;
    S.unlock(); e.preventDefault();
    if (sim && sim.ballsLeft <= 0) { toast('No balls left'); return; }
    var p = pointAt(e.clientX, e.clientY);
    if (throwAt(p)) { markT = performance.now(); showReticle(); }
  }
  function onMove() {}
  function onUp() {}

  // ================= info and sheets =================
  function renderInfo() {
    var lv = levelData || LEVELS[levelNo - 1], balls = sim ? sim.ballsLeft : lv ? lv.balls : 0, left = sim ? TF.left(sim) : lv ? lv.items.length : 0;
    $('info').innerHTML = '<div><div class="lbl">Level</div><div class="big">' + levelNo + '</div></div>' +
      '<div style="text-align:center"><div class="lbl">On the stand</div><div class="mid">' + left + '</div></div>' +
      '<div class="right"><div class="lbl">Stars</div><div class="mid">' + ('★★★'.slice(0, meta.stars[levelNo] || 0) || '–') + '</div></div>';
    var bl = $('ballsLeft'); bl.innerHTML = '<i></i>' + balls; bl.classList.toggle('low', balls <= 3);
  }
  function openLevels() {
    var h = '';
    for (var n = 1; n <= LEVELS.length; n++) {
      var st = meta.stars[n] || 0;
      h += '<button class="lv' + (n === levelNo ? ' cur' : '') + '" data-n="' + n + '"' + (n > meta.open ? ' disabled' : '') + '>' + n + '<small>' + '★★★'.slice(0, st) + '</small></button>';
    }
    $('lvgrid').innerHTML = h;
    $('ovLevels').classList.add('show');
  }
  var toastT = 0;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 1500); }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#tf-logo"/></svg>';
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); });
      box.appendChild(el);
    });
    $('ovEnd').classList.add('show');
  }
  function showAd(done) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) {
      meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return;
    }
    next();
  }
  function openHelp() {
    $('helpTitle').textContent = 'How to play Topple Fair';
    $('helpList').innerHTML = [
      'Knock <b>every piece</b> off the stand: cans, wood blocks, boards and heavy ice blocks.',
      '<b>Touch where you want the ball to go</b>: it fires right away at the spot you touch. Tap as fast as you like (a few throws a second).',
      'You have a set number of <b>balls</b> (top left). You can throw again before the pieces stop moving.',
      'Hit low to bring a stack down. Ice blocks are heavy, and pieces in the back row hide behind the front.',
      'A piece that lands on the grass is out. A piece left hanging on the edge still counts, so finish it off.',
      'Fewer balls earn more stars. 60 levels, each one checked: a computer player cleared it with the same physics, with balls to spare.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var stars = 0; for (var n in meta.stars) stars += meta.stars[n];
    $('statsBody').innerHTML = '<div class="tiles"><div class="tile"><b>' + Math.max(0, meta.open - 1) + '</b><span>Levels cleared</span></div><div class="tile"><b>' + stars + '</b><span>Stars</span></div><div class="tile"><b>' + stats.cleared + '</b><span>Wins</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.throws) + '</b><span>Balls thrown</span></div><div class="tile"><b>' + fmt(stats.knocked) + '</b><span>Knocked off</span></div><div class="tile"><b>' + fmt(stats.tries) + '</b><span>Tries</span></div></div>';
  }

  // ================= wiring =================
  function syncSound() {
    $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>';
    $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound);
  }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function inGame() { return sim && state === 'play' && sim.shots > 0; }
  function init() {
    Goobs.themePicker($('themes'));
    host = $('stage'); canvas = $('cv');
    canvas.addEventListener('pointerdown', onDown); canvas.addEventListener('pointermove', onMove); canvas.addEventListener('pointerup', onUp);
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { Goobs.home(); });
    $('btnNew').addEventListener('click', function () {
      if (inGame()) { showCard('Restart?', 'This stand starts over with all its balls.', [{ label: 'Restart', red: true, go: function () { startLevel(levelNo); } }, { label: 'Keep playing', go: function () {} }]); return; }
      startLevel(levelNo);
    });
    $('btnLevels').addEventListener('click', openLevels);
    $('lvgrid').addEventListener('click', function (e) { var b = e.target.closest('button[data-n]'); if (!b) return; $('ovLevels').classList.remove('show'); startLevel(+b.dataset.n); });
    sheet(null, 'ovLevels', 'btnCloseLevels');
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    $('btnHelp').addEventListener('click', openHelp);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('setFancy').checked = settings.fancy;
    $('setFancy').addEventListener('change', function () { settings.fancy = this.checked; saveSettings(); location.reload(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    var rq = 0, refit = function () { if (rq) return; rq = requestAnimationFrame(function () { rq = 0; resize(); }); };
    if (window.ResizeObserver) new ResizeObserver(refit).observe(host);
    window.addEventListener('resize', refit);
    syncSound(); syncAds();
    levelNo = meta.level; levelData = LEVELS[levelNo - 1]; renderInfo();
    if (!meta.seen) openHelp();
    Goobs.markPlayed('topple');
    Goobs.initUpdates({ onVersions: function (v) { $('version').textContent = 'Topple Fair ' + (v.topple || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
    // three.js and the physics load from /shared (kept on the phone by the app)
    Promise.all([import('../../shared/three.module.min.js'), import('../../shared/cannon-es.min.js')]).then(function (m) {
      T = m[0]; C = m[1]; TF.use(C);
      build(); ready = true; $('loading').classList.add('hide');
      startLevel(levelNo);
      requestAnimationFrame(frame);
    }).catch(function () { $('loading').textContent = 'Couldn’t load the game. Check the connection once, then it works offline.'; });
  }

  // hook for automated tests
  window.__tf = { get sim() { return sim; }, get state() { return state; }, throwAt: throwAt, startLevel: startLevel, TF: TF, meta: function () { return meta; }, stats: function () { return stats; },
    bot: function () { if (!sim) return false; var t = TF.botTarget(sim); return t ? throwAt(t) : false; }, project: function (x, y, z) { var v = new T.Vector3(x, y, z).project(camera), r = canvas.getBoundingClientRect(); return [r.left + (v.x + 1) / 2 * r.width, r.top + (1 - v.y) / 2 * r.height]; }, get ready() { return ready; }, ring: function () { return aim; }, marker: function () { return { visible: !!(reticle && reticle.visible), age: markT < 0 ? -1 : performance.now() - markT }; } };

  init();
})();
</script>
</body>
</html>
