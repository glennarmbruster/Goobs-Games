<!DOCTYPE html>
<html lang="en" class="gg-landscape">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5a54f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goobs-Games">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
<link rel="stylesheet" href="../../shared/goobs.css">
<script src="../../shared/goobs.js"></script>
<title>Mean Birds</title>
<style>
/* Mean Birds (landscape). Themes, cards and ad cards come from /shared/goobs.css */
html, body { background: #8fd6ff; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* in-game buttons */
.hud {
  position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-right, 0px) + 12px) 0 calc(env(safe-area-inset-left, 0px) + 12px);
}
.hudl { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
.hbtn { width: 44px; height: 44px; border-radius: 14px; border: 0; background: rgba(255,255,255,.88); color: #1b2130; display: grid; place-items: center; box-shadow: 0 3px 10px rgba(0,0,0,.18); padding: 0; }
.hbtn svg { width: 22px; height: 22px; }
.hbtn:active { transform: scale(.94); }
.lvname { font-weight: 800; font-size: 16px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.28); margin-left: 4px; }
.hudr { text-align: right; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.hudr .score { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.5px; line-height: 1; }
.hudr .best { font-size: 13px; font-weight: 700; opacity: .9; margin-top: 3px; }
.hud.hide { display: none; }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); background: rgba(10,16,24,.75); color: #fff;
  padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 15px; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap;
}
.toast.show { opacity: 1; }

/* level select */
.screen { position: fixed; inset: 0; display: none; flex-direction: column; background: linear-gradient(#8fd6ff, #d9f3ff 70%, #bfe7a8); z-index: 5;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-right, 0px) + 14px) calc(env(safe-area-inset-bottom, 0px) + 10px) calc(env(safe-area-inset-left, 0px) + 14px); }
.screen.show { display: flex; }
.lsTop { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; }
.lsTop .brand h1 { font-size: 22px; color: #1b2130; }
.lsTop .homebtn .chev { color: #3b36c9; }
.lsWorld { text-align: center; color: #1b2130; }
.lsWorld b { display: block; font-size: 19px; font-weight: 800; }
.lsWorld span { font-size: 14px; font-weight: 700; color: #3b4660; }
.lsTop .iconbtn { background: rgba(255,255,255,.9); color: #1b2130; border-color: transparent; }
.lsGrid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(10, 1fr); grid-auto-rows: 1fr; gap: 8px; padding: 10px 0 4px; overflow-y: auto; }
@media (max-aspect-ratio: 3/2) { .lsGrid { grid-template-columns: repeat(5, 1fr); } }
.mlv { position: relative; aspect-ratio: auto; border: 0; border-radius: 16px; background: rgba(255,255,255,.92); color: #1b2130; box-shadow: 0 4px 0 rgba(40,60,90,.18);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 900; font-size: 22px; padding: 0; min-height: 64px; }
.mlv:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(40,60,90,.18); }
.mlv .st { display: flex; gap: 1px; }
.mlv .st svg { width: 15px; height: 15px; color: #d6dbe6; }
.mlv .st svg.on { color: #ffc23a; }
.mlv.lock { opacity: .45; }
.mlv.lock::after { content: "\1F512"; position: absolute; font-size: 16px; bottom: 6px; }
.mlv.cur { background: linear-gradient(135deg, #5a54f0, #7a5cff); color: #fff; }
.mlv.cur .st svg { color: rgba(255,255,255,.4); }

/* cards */
.mbcard { width: min(92vw, 430px); max-height: 92vh; overflow-y: auto; padding: 18px 18px 16px; }
.mbcard .actions { flex-direction: row; }
.mbcard .actions .btn { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; }
.mbcard .actions .btn svg { width: 20px; height: 20px; }
.mbcard p { margin: 4px 0 14px; }
.stars3 { display: flex; justify-content: center; gap: 6px; margin: 2px 0 6px; }
.stars3 svg { width: 54px; height: 54px; color: #d6dbe6; }
.stars3 svg:nth-child(2) { transform: translateY(-10px); }
.stars3 svg.on { color: #ffc23a; animation: starpop .4s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes starpop { 0% { scale: 0; } 100% { scale: 1; } }
.toggles { display: flex; gap: 8px; margin: 8px 0 8px; }
.tog { flex: 1; min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 700; font-size: 13px; padding: 0; }
.tog svg { width: 22px; height: 22px; }
.tog.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.tog .adbadge { font-size: 11px; font-weight: 900; background: var(--gold); color: #3a2a00; border-radius: 5px; padding: 1px 5px; }
.adrow { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
.adrow button { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--surface-2); font-size: 18px; font-weight: 800; color: var(--ink); padding: 0; }
.adrow.off { opacity: .4; pointer-events: none; }
#birdPic { display: block; margin: 0 auto 4px; width: 220px; height: 150px; }

/* portrait: ask to turn the phone */
.rotate { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; text-align: center; background: linear-gradient(#8fd6ff, #d9f3ff); color: #1b2130; padding: 24px; }
.rotate b { display: block; font-size: 22px; margin: 18px 0 6px; }
.rotate span { color: #3b4660; font-size: 16px; }
.rotate .phone { width: 64px; height: 108px; border: 6px solid #1b2130; border-radius: 16px; margin: 0 auto; animation: turn 2.2s ease-in-out infinite; }
@keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) { .rotate { display: flex; } }

.skiphint { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 16px); background: rgba(255,255,255,.88); color: #1b2130;
  font-weight: 800; font-size: 14px; padding: 7px 12px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,.18); pointer-events: none; opacity: 0; transition: opacity .25s; }
.skiphint.show { opacity: 1; }
</style>
</head>
<body>

<symbol id="mb-logo" viewBox="0 0 100 100"><defs><linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd0ff"/><stop offset="1" stop-color="#d9f3ff"/></linearGradient></defs>
<rect width="100" height="100" rx="24" fill="url(#mbg)"/><rect y="74" width="100" height="26" fill="#6cc24a"/><path d="M0 74h100" stroke="#4f9d34" stroke-width="3"/>
<ellipse cx="46" cy="50" rx="24" ry="20" fill="#2b3552"/><ellipse cx="42" cy="58" rx="13" ry="9" fill="#46557e"/><path d="M68 46l16 5-16 5z" fill="#9aa3ad"/>

<symbol id="i-restart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v5h-5"/></g></symbol>

<canvas id="cv"></canvas>

<!-- in-game buttons -->
<div class="hud" id="hud">
  <div class="hudl">
    <button class="hbtn" id="btnPause" aria-label="Pause"><svg viewBox="0 0 24 24"><use href="#i-pause"/></svg></button>
    <button class="hbtn" id="btnRestart" aria-label="Restart"><svg viewBox="0 0 24 24"><use href="#i-restart"/></svg></button>
    <div class="lvname" id="lvName"></div>
  </div>
  <div class="hudr"><div class="score" id="score">0</div><div class="best" id="best"></div></div>
</div>
<div class="toast" id="toast"></div>
<div class="skiphint" id="skipHint">Tap to skip &#8250;&#8250;</div>

<!-- level select -->
<div class="screen show" id="scLevels">
  <div class="lsTop">
    <button class="brand homebtn" id="btnHome" aria-label="Back to all games"><span class="chev" aria-hidden="true">&#8249;</span><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#mb-logo"/></svg><h1>Mean Birds</h1></button>
    <div class="lsWorld"><b id="worldName">Sunny Farm</b><span id="worldStars"></span></div>
    <button class="iconbtn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>

<!-- pause / settings -->
<div class="overlay center" id="ovPause">
  <div class="card mbcard" role="dialog">
    <h2 id="pauseTitle">Paused</h2>
    <div class="toggles">
      <button class="tog" id="togMusic"><svg viewBox="0 0 24 24"><use href="#i-music"/></svg><span>Music</span></button>
      <button class="tog" id="togSound"><svg viewBox="0 0 24 24"><use href="#i-sound"/></svg><span>Sound</span></button>
      <button class="tog" id="togAds"><span class="adbadge">AD</span><span>Old-time ads</span></button>
    </div>
    <div class="adrow" id="adRow">Ad every <button id="adLess" aria-label="Fewer">&minus;</button><b id="adEvery">3</b><button id="adMore" aria-label="More">+</button> levels</div>
    <div class="actions" id="pauseActions">
      <button class="btn" id="btnPLevels"><svg viewBox="0 0 24 24"><use href="#i-grid"/></svg> Levels</button>
      <button class="btn" id="btnPRestart"><svg viewBox="0 0 24 24"><use href="#i-restart"/></svg> Restart</button>
      <button class="btn red" id="btnResume"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg> Play</button>

    <div class="stars3" id="endStars"></div>
    <p id="endText"></p>
    <div class="actions" id="endActions"></div>
  </div>
</div>

<script src="../../shared/planck.min.js"></script>
<script>
/* Mean Birds physics and rules (planck.js, a JavaScript Box2D). No drawing here; runs in Node for the level checker.
   World units are meters, y points up, the ground is y = 0 and the slingshot stands at x = level.sling. */
var MB = (function () {
  'use strict';
  var pl = typeof planck !== 'undefined' ? planck : null;
  var DT = 1 / 60, GRAVITY = -10;
  var SLING_H = 2.9, MAX_PULL = 2.1, VMAX = 17.5;   // pouch height, longest pull, launch speed at a full pull
  var VMIN = 1.2, K = 1.9, MCAP = 6;               // damage: speed that starts to hurt, damage per (m/s x kg), heaviest mass counted
  var POINTS_GRUB = 5000, POINTS_BIRD = 10000;

  // materials: density (kg per square meter), friction, bounce, strength per square meter
  var MAT = {
    wood: { d: 0.7, f: 0.6, r: 0.15, hp: 45 },
    glass: { d: 0.9, f: 0.2, r: 0.1, hp: 16 },
    stone: { d: 2.2, f: 0.8, r: 0.05, hp: 120 }
  };
  // birds: radius, density, and how hard they hit each material
  var BIRDS = {
    rocco: { r: 0.36, d: 4, hit: { wood: 1, glass: 1, stone: 0.8 }, name: 'Rocco' },
    pips: { r: 0.22, d: 4, hit: { wood: 0.5, glass: 3, stone: 0.35 }, name: 'The Pips' },
    zip: { r: 0.33, d: 4, hit: { wood: 2.4, glass: 0.9, stone: 0.45 }, name: 'Zip' }
  };
  var GRUBS = { s: { r: 0.36, hp: 5 }, m: { r: 0.5, hp: 9 }, l: { r: 0.7, hp: 14 } };

  function use(p) { pl = p; }
  function blockHP(m, w, h) { return MAT[m].hp * (w * h + 0.25); }
  function blockPts(w, h) { return 50 * Math.round((200 + 600 * w * h) / 50); }

  // ---------------------------------------------------------------- a level in play ----------------------------------------------------------------
  // create(level, snap?) builds the world; snap (from snapshot()) restores a mid-level state
  function create(level, snap) {
    var world = new pl.World({ gravity: { x: 0, y: GRAVITY } });
    var S = {
      level: level, world: world, bodies: [], byId: {}, score: 0, grubsLeft: 0, events: [], time: 0, nextId: 1,
      queue: level.birds.slice(), shot: 0, bird: null, flock: [], ability: false, pending: [], hits: []
    };
    var sx = level.sling || 0;
    S.pouch = { x: sx, y: SLING_H };
    // ground
    var ground = world.createBody();
    ground.createFixture(new pl.Edge({ x: -200, y: 0 }, { x: 400, y: 0 }), { friction: 0.9 });
    ground.setUserData({ kind: 'ground' });
    (level.terrain || []).forEach(function (t) {
      var b = world.createBody({ position: { x: t.x, y: t.y } });
      b.createFixture(new pl.Box(t.w / 2, t.h / 2), { friction: 0.9 });
      b.setUserData({ kind: 'terrain', w: t.w, h: t.h, x: t.x, y: t.y });
    });
    function add(o, kind) {
      var id = o.id || S.nextId;
      S.nextId = Math.max(S.nextId, id + 1);
      var b, u = { kind: kind, id: id };
      if (kind === 'block' || kind === 'tnt') {
        var m = kind === 'tnt' ? 'wood' : o.m, w = kind === 'tnt' ? 0.7 : o.w, h = kind === 'tnt' ? 0.7 : o.h;
        b = world.createDynamicBody({ position: { x: o.x, y: o.y }, angle: o.a || 0 });
        b.createFixture(new pl.Box(w / 2, h / 2), { density: MAT[m].d, friction: MAT[m].f, restitution: MAT[m].r });
        u.m = m; u.w = w; u.h = h;
        u.maxHp = kind === 'tnt' ? 2 : blockHP(m, w, h); u.pts = kind === 'tnt' ? 1000 : blockPts(w, h);
      } else if (kind === 'boulder') {
        b = world.createDynamicBody({ position: { x: o.x, y: o.y } });
        b.createFixture(new pl.Circle(o.r), { density: MAT.stone.d, friction: 0.7, restitution: 0.1 });
        b.setAngularDamping(0.4);
        u.m = 'stone'; u.r = o.r; u.maxHp = blockHP('stone', o.r * 1.8, o.r * 1.8); u.pts = blockPts(o.r * 1.8, o.r * 1.8);
      } else if (kind === 'grub') {
        var g = GRUBS[o.s || 'm'];
        b = world.createDynamicBody({ position: { x: o.x, y: o.y } });
        b.createFixture(new pl.Circle(g.r), { density: 0.8, friction: 0.7, restitution: 0.2 });
        b.setAngularDamping(1.5);
        u.s = o.s || 'm'; u.r = g.r; u.helmet = o.helmet ? 1 : 0; u.maxHp = g.hp * (o.helmet ? 2.2 : 1); u.pts = POINTS_GRUB;
        S.grubsLeft++;
      }
      u.hp = u.maxHp;
      b.setUserData(u);
      S.bodies.push(b); S.byId[id] = b;
      return b;
    }
    var id = 1;
    (level.blocks || []).forEach(function (o) { add(Object.assign({ id: id++ }, o), 'block'); });
    (level.tnt || []).forEach(function (o) { add(Object.assign({ id: id++ }, o), 'tnt'); });
    (level.boulders || []).forEach(function (o) { add(Object.assign({ id: id++ }, o), 'boulder'); });
    (level.grubs || []).forEach(function (o) { add(Object.assign({ id: id++ }, o), 'grub'); });
    if (snap) restore(S, snap);

    // impacts: how fast two things meet decides the damage (resting stacks don't hurt)
    world.on('pre-solve', function (c) {
      if (!c.isTouching()) return;
      var fa = c.getFixtureA(), fb = c.getFixtureB(), A = fa.getBody(), B = fb.getBody();
      var wm = c.getWorldManifold(null); if (!wm || !wm.pointCount) return;
      var n = wm.normal, best = 0;
      for (var i = 0; i < wm.pointCount; i++) {
        var p = wm.points[i], va = A.getLinearVelocityFromWorldPoint(p), vb = B.getLinearVelocityFromWorldPoint(p);
        var s = (va.x - vb.x) * n.x + (va.y - vb.y) * n.y;
        if (s > best) best = s;
      }
      if (best <= VMIN) return;
      S.hits.push([A, B, best]);
    });
    return S;
  }
  function massOf(b) { return b.isStatic() ? 0 : b.getMass(); }
  function damageOne(S, X, O, speed) {
    var u = X.getUserData(); if (!u || !u.maxHp || u.dead) return;
    var o = O.getUserData() || {}, mo = O.isStatic() ? massOf(X) : massOf(O), mult = 1;
    if (o.kind === 'bird') mult = u.kind === 'grub' ? 1.4 : (BIRDS[o.type].hit[u.m] || 1);
    var dmg = (speed - VMIN) * Math.min(mo, MCAP) * K * mult;
    if (dmg < 0.3) return;
    u.hp -= dmg;
    if (u.hp <= 0) kill(S, X, 'hit');

      if (p.k === 'shard') { c.save(); c.translate(sx(p.x), sy(p.y)); c.rotate(p.r); c.fillRect(-p.s * z / 2, -p.s * z / 3, p.s * z, p.s * z * 0.66); c.restore(); }
      else { c.beginPath(); c.arc(sx(p.x), sy(p.y), p.s * z * (1.4 - a * 0.4), 0, Math.PI * 2); c.fill(); }
      c.globalAlpha = 1;
    });
    // points
    c.textAlign = 'center'; c.textBaseline = 'middle';
    floats.forEach(function (f) {
      var a = Math.min(1, f.life / f.max * 2), fs = Math.max(13, Math.min(34, z * (f.big ? 0.75 : 0.5)));
      c.globalAlpha = a; c.font = '900 ' + fs.toFixed(0) + 'px -apple-system,system-ui,sans-serif';
      c.lineWidth = fs * 0.18; c.strokeStyle = 'rgba(40,30,20,.7)'; c.strokeText(f.t, sx(f.x), sy(f.y)); c.fillStyle = f.c; c.fillText(f.t, sx(f.x), sy(f.y));
      c.globalAlpha = 1;
    });
    c.restore();
  }
  function renderHUD() {
    if (!S) return;
    shownScore += (S.score - shownScore) * 0.25; if (Math.abs(S.score - shownScore) < 10) shownScore = S.score;
    $('score').textContent = fmt(shownScore);
  }

  // ================= input: pull the sling, tap for powers, drag to look around, pinch to zoom =================
  var pts = {}, pan = null, pinch = null, tapStart = null;
  function nearBird(px, py) {
    if (phase !== 'aim' || !S.queue.length) return false;
    var b = birdPos(), r = MB.BIRDS[S.queue[0]].r * cam.z;
    return Math.hypot(px - sx(b.x), py - sy(b.y)) < Math.max(48, r * 2.4);
  }
  function onDown(e) {
    if (paused()) return;
    SND.unlock();
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    var n = Object.keys(pts).length;
    tapStart = n === 1 ? { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId, used: false } : null;
    if (n === 1 && nearBird(e.clientX, e.clientY)) { dragging = true; pull = { x: 0, y: 0 }; SND.stretch(); return; }
    if (n === 1 && phase === 'flight' && S.ability) { if (MB.useAbility(S)) { tapStart.used = true; return; } }
    if (n === 2) { dragging = false; pull = null; var k = Object.keys(pts), a = pts[k[0]], b = pts[k[1]]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, wx: wx((a.x + b.x) / 2), wy: wy((a.y + b.y) / 2) }; pan = null; camMode = 'manual'; return; }
    if (n === 1) pan = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y };
  }
  function onMove(e) {
    if (!pts[e.pointerId]) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (dragging) {
      var p = MB.clampPull({ x: wx(e.clientX) - S.pouch.x, y: wy(e.clientY) - S.pouch.y });
      var was = pull ? Math.hypot(pull.x, pull.y) : 0, now = Math.hypot(p.x, p.y);
      if (Math.floor(now * 3) > Math.floor(was * 3)) SND.stretch();
      pull = p; return;
    }
    var k = Object.keys(pts);
    if (pinch && k.length >= 2) {
      var a = pts[k[0]], b = pts[k[1]], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      cam.z = pinch.z * d / Math.max(20, pinch.d); clampCam();
      cam.x = pinch.wx - (mx - W / 2) / cam.z; cam.y = pinch.wy + (my - H / 2) / cam.z; clampCam();
      return;
    }
    if (pan) {
      var dx = e.clientX - pan.x, dy = e.clientY - pan.y;
      if (Math.abs(dx) + Math.abs(dy) > 6) camMode = 'manual';
      if (camMode === 'manual') { cam.x = pan.cx - dx / cam.z; cam.y = pan.cy + dy / cam.z; clampCam(); }
    }
  }
  function onUp(e) {
    delete pts[e.pointerId];
    var ts = tapStart; tapStart = null;
    if (ts && ts.id === e.pointerId && !ts.used && !dragging && !pinch && Math.hypot(e.clientX - ts.x, e.clientY - ts.y) < 12 && performance.now() - ts.t < 450) { skipAhead(); }
    if (dragging) {
      dragging = false;
      if (pull && Math.hypot(pull.x, pull.y) > 0.35) doLaunch(pull); else pull = null;
      return;
    }
    if (Object.keys(pts).length < 2) pinch = null;
    if (!Object.keys(pts).length) pan = null;
  }

  // ================= end of a level =================
  function endCard(won) {
    var k = key(li), prev = scores[k], st = starsFor(lv, S.score, won), newBest = false;
    if (won) {
      if (!prev || S.score > prev.best) { scores[k] = { best: S.score, stars: Math.max(st, prev ? prev.stars : 0) }; newBest = !!prev; }
      else if (st > prev.stars) scores[k].stars = st;
      if (meta.cur <= li) meta.cur = li + 1;
      saveScores(); SND.win();
    } else SND.lose();
    meta.finished++; saveMeta();
    SND.pauseMusic();
    $('endTitle').textContent = won ? 'Level cleared!' : 'The Grublins won this one';
    var h = '';
    for (var i = 0; i < 3; i++) h += '<svg viewBox="0 0 24 24" class="' + (i < st ? 'on' : '') + '" style="animation-delay:' + (0.25 + i * 0.35) + 's"><use href="#i-star"/></svg>';
    $('endStars').innerHTML = h;
    for (var j = 0; j < st; j++) (function (j2) { setTimeout(function () { SND.star(j2); }, 250 + j2 * 350); })(j);
    $('endText').innerHTML = won ? 'Score <b>' + fmt(S.score) + '</b>' + (newBest ? '<br><span class="newbest">New best!</span>' : '') + (st < 3 && lv.stars ? '<br><small>3 stars at ' + fmt(lv.stars[1]) + '</small>' : '')
      : S.grubsLeft + (S.grubsLeft === 1 ? ' Grublin is' : ' Grublins are') + ' still there. Try a different angle.';
    var b = [{ l: 'Levels', ic: 'i-grid', go: function () { between(showLevels); } }, { l: won ? 'Replay' : 'Try again', ic: 'i-restart', go: function () { between(function () { startLevel(li); }); }, red: !won }];
    if (won && li + 1 < WORLD.levels.length) b.push({ l: 'Next', ic: 'i-next', red: true, go: function () { between(function () { startLevel(li + 1); }); } });
    var box = $('endActions'); box.innerHTML = '';
    b.forEach(function (x) {
      var el = document.createElement('button'); el.className = 'btn' + (x.red ? ' red' : '');
      el.innerHTML = '<svg viewBox="0 0 24 24"><use href="#' + x.ic + '"/></svg> ' + x.l;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); x.go(); });
      box.appendChild(el);
    });
    setTimeout(function () { $('ovEnd').classList.add('show'); }, won ? 200 : 500);
  }
  function showAd(done) { GoobsAds.show({ onShow: function () { SND.ding(); }, onStep: function () { SND.sign(); } }, done); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) {
      meta.lastAdAt = meta.finished; saveMeta();
      next(); showAd(function () {}); return;
    }
    next();
  }

  // ================= level select =================
  function showLevels() {
    S = null;
    $('hud').classList.add('hide'); $('skipHint').classList.remove('show');
    var h = '', total = 0;
    WORLD.levels.forEach(function (l, i) {
      var sc = scores[key(i)], st = sc ? sc.stars : 0, lock = i > meta.cur; total += st;
      h += '<button class="mlv' + (lock ? ' lock' : '') + (i === meta.cur && !sc ? ' cur' : '') + '" data-i="' + i + '">' + (i + 1) + '<span class="st">';
      for (var k = 0; k < 3; k++) h += '<svg viewBox="0 0 24 24" class="' + (k < st ? 'on' : '') + '"><use href="#i-star"/></svg>';
      h += '</span></button>';
    });
    $('lsGrid').innerHTML = h;
    $('worldName').textContent = '1 · ' + WORLD.name;
    $('worldStars').textContent = total + ' / ' + WORLD.levels.length * 3 + ' ★';
    $('scLevels').classList.add('show');
    SND.pauseMusic();
  }

  // ================= settings (pause card) =================
  function syncToggles() {
    $('togMusic').classList.toggle('on', settings.music);
    $('togSound').classList.toggle('on', settings.sound);
    $('togAds').classList.toggle('on', Goobs.adsOn());
    $('adEvery').textContent = settings.adEvery;
    $('adRow').classList.toggle('off', !Goobs.adsOn());
    SND.setSound(settings.sound); SND.setMusic(settings.music && !!S && !isOpen('scLevels'));
  }
  function openPause(fromLevels) {
    $('pauseTitle').textContent = fromLevels ? 'Settings' : 'Paused';
    $('pauseActions').style.display = fromLevels ? 'none' : '';
    $('ovPause').classList.add('show');
  }

  // ================= main loop =================
  var last = 0;
  function frame(tms) {
    requestAnimationFrame(frame);
    var t = tms / 1000, dt = Math.min(0.05, last ? t - last : 0); last = t;
    if (S && !paused()) {
      acc += dt;
      var n = 0;
      while (acc >= MB.DT && n < 4) {
        MB.step(S); acc -= MB.DT; n++;
        if (phase === 'flight' && S.bird && S.flock.indexOf(S.bird) >= 0 && (S.time * 60 | 0) % 3 === 0) { var p = S.bird.getPosition(); if (trail.length < 400) trail.push([p.x, p.y]); }
      }
      if (n === 4) acc = 0;
      drainEvents();
      flow(dt);
      stepParts(dt);
      updateCam(dt);
    }
    render(t);
    renderHUD();
    if (S) renderSkip();
  }

  function init() {
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', onUp);
    document.addEventListener('touchmove', function (e) { if (e.target === cv) e.preventDefault(); }, { passive: false });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { SND.unlock(); }, { passive: true }); });
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(document.documentElement);
    $('btnHome').addEventListener('click', function () { Goobs.home(); });
    $('btnSettings').addEventListener('click', function () { openPause(true); });
    $('btnPause').addEventListener('click', function () { openPause(false); });
    $('btnRestart').addEventListener('click', function () { if (S) startLevel(li); });
    $('btnResume').addEventListener('click', function () { $('ovPause').classList.remove('show'); });
    $('btnPRestart').addEventListener('click', function () { $('ovPause').classList.remove('show'); startLevel(li); });
    $('btnPLevels').addEventListener('click', function () { $('ovPause').classList.remove('show'); showLevels(); });
    $('ovPause').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
    $('btnBirdOk').addEventListener('click', function () { $('ovBird').classList.remove('show'); });
    $('togMusic').addEventListener('click', function () { settings.music = !settings.music; saveSettings(); syncToggles(); });
    $('togSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncToggles(); SND.ding(); });
    $('togAds').addEventListener('click', function () { Goobs.setAds(!Goobs.adsOn()); syncToggles(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncToggles(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncToggles(); });
    $('lsGrid').addEventListener('click', function (e) {
      var b = e.target.closest('.mlv'); if (!b) return;
      var i = +b.dataset.i;
      if (i > meta.cur) { toast('Clear level ' + (i) + ' first'); return; }
      SND.unlock(); startLevel(i); syncToggles();
    });
    document.addEventListener('visibilitychange', function () { if (document.hidden) SND.pauseMusic(); else if (S && settings.music) SND.resumeMusic(); });
    resize();
    syncToggles();
    showLevels();
    requestAnimationFrame(frame);
    Goobs.markPlayed('meanbirds');
    Goobs.initUpdates({ onVersions: function (v) { $('version').textContent = 'Mean Birds ' + (v.meanbirds || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }

  // hook for automated tests
  window.__mb = { get S() { return S; }, get phase() { return phase; }, get cam() { return cam; }, start: startLevel, launch: doLaunch, levels: function () { return WORLD.levels; }, meta: function () { return meta; }, scores: function () { return scores; }, useAbility: function () { return MB.useAbility(S); }, sx: sx, sy: sy };

  init();
})();
</script>
