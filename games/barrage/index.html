<style>
/* Ball Barrage styles (themes, UI kit and ad cards come from /shared/goobs.css) */
.brand svg { border-radius: 10px; }
.brand h1 { font-size: 21px; }
.modes button { font-size: 15px; }
.stagewrap { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.stage { position: relative; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); background: #151b3d; touch-action: none; display: flex; flex-direction: column; }
.stage canvas { display: block; touch-action: none; }
.bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #0f1430; }
.bar .grow { flex: 1; }
.boost { position: relative; width: 46px; height: 40px; border-radius: 12px; border: 0; background: #262f66; color: #fff; display: flex; align-items: center; justify-content: center; }
.boost svg { width: 24px; height: 24px; }
.boost b { position: absolute; right: -3px; bottom: -3px; min-width: 18px; height: 18px; border-radius: 9px; background: #ffc53d; color: #1b1f33; font-size: 11px; font-weight: 900; line-height: 18px; padding: 0 4px; }
.boost:disabled { opacity: .35; }
.boost.on { background: #ffc53d; color: #1b1f33; }
#bRocket { color: #ff8a8a; } #bFreeze { color: #8fe3ff; } #bPower { color: #ffe066; }
.boost.ctl { background: #1d2450; color: #cfd6ff; }
.boost.ctl.on { background: #3a86ff; color: #fff; }
.toast { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(10,14,36,.85); color: #fff; font-weight: 800; font-size: 16px; padding: 8px 15px; border-radius: 14px; white-space: nowrap; }
.toast.show { opacity: 1; }
.lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lv { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); height: 52px; font-weight: 800; font-size: 16px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.lv small { font-size: 11px; color: #e0a800; letter-spacing: -1px; }
.lv.cur { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.lv:disabled { opacity: .35; }
.stars { font-size: 26px; color: #ffc83d; letter-spacing: 2px; }
.stars .off { color: var(--line-strong); }
.cardicon svg { border-radius: 16px; }
@media (max-width: 385px) { .brand h1 { font-size: 19px; } .modes button { font-size: 14px; } }
</style>

<script>
/* Ball Barrage logic: the balls-and-numbered-bricks game. Aim, and a stream of balls flies out; every touch takes 1 off
   a brick's number and a brick at 0 breaks. When every ball is back, the bricks come down a row. A brick reaching the
   bottom row ends the game. Levels (drawn from rules, taller than the screen) are cleared by breaking every brick;
   Endless adds a new row every turn. Runs in Node (tools/gen.js proves the levels with the bot below). */
var BB = (function () {
  'use strict';
  var COLS = 11, ROWS = 15, BR = 0.16, SPEED = 0.5, SUB = 3, FIRE_GAP = 3, MINVY = 0.16, MAX_STEPS = 60 * 45;

  function rng(seed) { var s = seed >>> 0 || 1; return function () { s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function emptyRow() { var a = new Array(COLS); for (var i = 0; i < COLS; i++) a[i] = null; return a; }
  function isBrick(c) { return c && (c.t === 'b' || c.t === 'x'); }

  // ---------------- a game ----------------
  // level: { n, balls, start, rows: [strings top-first], hp: [[...numbers]] }  rows chars: '.' empty, 'b' brick, 'x' bomb, '+' ball, 'h'/'v' lasers
  function cellFrom(ch, hp) {
    if (ch === 'b' || ch === 'x') return { t: ch, hp: hp, max: hp };
    if (ch === '+' || ch === 'h' || ch === 'v') return { t: ch };
    return null;
  }
  function create(level) {
    var g = base('levels');
    g.n = level.n; g.balls = level.balls; g.bot = level.bot || 0;
    var rows = level.rows.map(function (s, r) { var row = emptyRow(); for (var c = 0; c < COLS; c++) row[c] = cellFrom(s[c], level.hp[r][c]); return row; });
    // the map's bottom row starts at visible row `start`; the rest wait above and come down one a turn
    var start = level.start, H = rows.length;
    for (var r = 0; r < ROWS; r++) { var mr = r - start + H - 1; g.grid[r] = mr >= 0 && mr < H ? rows[mr] : emptyRow(); }
    g.pending = rows.slice(0, Math.max(0, H - 1 - start)); // top-first; the last one enters next
    return g;
  }
  function createEndless(seed) {
    var g = base('endless'); g.seed = seed >>> 0 || 1; g.balls = 1;
    for (var r = 0; r < ROWS; r++) g.grid[r] = emptyRow();
    g.grid[1] = endlessRow(g, 1);
    return g;
  }
  function base(mode) {
    return { mode: mode, grid: new Array(ROWS), pending: [], balls: 1, x: COLS / 2, turn: 1, over: false, won: false, score: 0,
      freeze: false, power: false, n: 0 };
  }
  function endlessRow(g, t) {
    var R = rng(g.seed * 31 + t * 7919), row = emptyRow(), n = 1 + Math.floor(R() * (t < 5 ? 3 : COLS - 3)), free = [];
    for (var c = 0; c < COLS; c++) free.push(c);
    for (var i = free.length - 1; i > 0; i--) { var j = Math.floor(R() * (i + 1)), tmp = free[i]; free[i] = free[j]; free[j] = tmp; }
    for (var k = 0; k < n; k++) { var hp = R() < 0.22 ? t * 2 : t; row[free[k]] = R() < 0.04 && t > 8 ? { t: 'x', hp: hp, max: hp } : { t: 'b', hp: hp, max: hp }; }
    row[free[n]] = { t: '+' };
    if (t > 6 && R() < 0.18 && free[n + 1] !== undefined) row[free[n + 1]] = { t: R() < 0.5 ? 'h' : 'v' };
    return row;
  }
  function bricksLeft(g) {
    var n = 0;
    g.grid.forEach(function (row) { row.forEach(function (c) { if (isBrick(c)) n++; }); });
    g.pending.forEach(function (row) { row.forEach(function (c) { if (isBrick(c)) n++; }); });
    return n;
  }
  function lowestBrickRow(g) { for (var r = ROWS - 1; r >= 0; r--) if (g.grid[r].some(isBrick)) return r; return -1; }

  // ---------------- damage ----------------
  function hit(g, r, c, amt, ev) {
    var cell = g.grid[r][c]; if (!isBrick(cell)) return;
    var d = Math.min(cell.hp, amt); cell.hp -= d; g.score += d;
    if (cell.hp <= 0) {
      g.grid[r][c] = null; if (ev) ev.push({ t: 'break', r: r, c: c, max: cell.max, bomb: cell.t === 'x' });
      if (cell.t === 'x') { // a bomb clears the eight bricks around it
        if (ev) ev.push({ t: 'boom', r: r, c: c });
        for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
          var rr = r + dr, cc = c + dc; if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || (!dr && !dc)) continue;
          var o = g.grid[rr][cc]; if (isBrick(o)) hit(g, rr, cc, o.hp, ev);
        }
      }
    } else if (ev) ev.push({ t: 'hit', r: r, c: c });
  }
  function laser(g, r, c, kind, amt, ev) {
    if (ev) ev.push({ t: 'laser', r: r, c: c, kind: kind });
    if (kind === 'h') { for (var cc = 0; cc < COLS; cc++) if (cc !== c) hit(g, r, cc, amt, ev); }
    else { for (var rr = 0; rr < ROWS; rr++) if (rr !== r) hit(g, rr, c, amt, ev); }
  }

  // ---------------- ball movement ----------------
  function solidAt(g, r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS && isBrick(g.grid[r][c]); }
  // move one ball a sub-step; returns true when it has landed. dry: only look (the bot's probe), count what it touches
  function moveBall(g, b, ev, dry, probe) {
    b.x += b.vx / SUB; b.y += b.vy / SUB;
    if (b.x < BR) { b.x = BR; b.vx = Math.abs(b.vx); }
    else if (b.x > COLS - BR) { b.x = COLS - BR; b.vx = -Math.abs(b.vx); }
    if (b.y < BR) { b.y = BR; b.vy = Math.abs(b.vy); }
    for (var pass = 0; pass < 3; pass++) {
      var c0 = Math.floor(b.x - BR), c1 = Math.floor(b.x + BR), r0 = Math.floor(b.y - BR), r1 = Math.floor(b.y + BR);
      var best = null, bp = 0;
      for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) {
        if (!solidAt(g, r, c)) continue;
        var cx = b.x < c ? c : b.x > c + 1 ? c + 1 : b.x, cy = b.y < r ? r : b.y > r + 1 ? r + 1 : b.y;
        var dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy, nx, ny, pen;
        if (d2 >= BR * BR) continue;
        if (d2 > 1e-12) {
          var d = Math.sqrt(d2); nx = dx / d; ny = dy / d; pen = BR - d;
          // a corner joined to a neighbour is really a flat face (no snagging on the seams between bricks)
          if (dx !== 0 && dy !== 0) {
            var sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1;
            if (solidAt(g, r, c + sx)) { nx = 0; ny = sy; pen = BR - Math.abs(dy); }
            else if (solidAt(g, r + sy, c)) { nx = sx; ny = 0; pen = BR - Math.abs(dx); }
          }
        } else { // center inside the brick: out through the nearest side

      else { cx.moveTo(x + k / 2, y + k * 0.26); cx.lineTo(x + k / 2, y + k * 0.74); cx.moveTo(x + k * 0.38, y + k * 0.36); cx.lineTo(x + k / 2, y + k * 0.24); cx.lineTo(x + k * 0.62, y + k * 0.36); cx.moveTo(x + k * 0.38, y + k * 0.64); cx.lineTo(x + k / 2, y + k * 0.76); cx.lineTo(x + k * 0.62, y + k * 0.64); }
      cx.stroke(); cx.lineCap = 'butt';
    }
  }
  function num(v, x, y, col) {
    var t = String(v), fs = t.length <= 2 ? 0.44 : t.length === 3 ? 0.36 : 0.29;
    cx.font = '900 ' + Math.round(k * fs) + 'px -apple-system, system-ui, sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillStyle = 'rgba(0,0,0,.3)'; cx.fillText(t, x + 1, y + 1.5); cx.fillStyle = col; cx.fillText(t, x, y);
    cx.textBaseline = 'alphabetic';
  }

  // ================= touch: drag to aim, let go to shoot =================
  var ptr = null;
  function local(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / k, (e.clientY - r.top) / k]; }
  function aimFrom(p) {
    var dy = (ROWS - BR) - p[1], dx = p[0] - g.x;
    if (p[1] > ROWS - 0.25) return { a: Math.PI / 2, ok: false };
    var a = Math.atan2(dy, dx); return { a: BB.clampAim(a), ok: true };
  }
  function onDown(e) {
    if (!g || g.over || phase !== 'aim' || sheetOpen()) return;
    S.unlock();
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    ptr = { id: e.pointerId }; aim = aimFrom(local(e));
  }
  function onMove(e) { if (!ptr || e.pointerId !== ptr.id) return; aim = aimFrom(local(e)); }
  function onUp(e) {
    if (!ptr || e.pointerId !== ptr.id) return;
    ptr = null; var a = aimFrom(local(e)); aim = null;
    if (a.ok) fire(a.a);
  }

  // ================= info and sheets =================
  function renderInfo() {
    if (!g) return;
    var h;
    if (g.mode === 'levels') {
      var bot = (LEVELS[levelNo - 1] && LEVELS[levelNo - 1].bot) || 0, t = g.turn;
      h = '<div><div class="lbl">Level</div><div class="big">' + levelNo + '</div></div>' +
        '<div style="text-align:center"><div class="lbl">Bricks</div><div class="mid">' + BB.bricksLeft(g) + '</div></div>' +
        '<div class="right"><div class="lbl">Turn ' + t + '</div><div class="mid">' + (t <= bot ? '★★★' : t <= bot + 3 ? '★★' : '★') + '</div></div>';
    } else {
      h = '<div><div class="lbl">Turn</div><div class="big">' + g.turn + '</div></div>' +
        '<div style="text-align:center"><div class="lbl">Balls</div><div class="mid">' + g.balls + '</div></div>' +
        '<div class="right"><div class="lbl">Best</div><div class="mid">' + Math.max(meta.endlessBest, g.turn - 1) + '</div></div>';
    }
    $('info').innerHTML = h;
    Array.prototype.forEach.call($('modes').children, function (b) { b.classList.toggle('on', b.dataset.mode === g.mode); });
    $('btnLevels').style.display = g.mode === 'levels' ? '' : 'none';
  }
  function renderBar() {
    ['rocket', 'freeze', 'power'].forEach(function (key) {
      var id = key[0].toUpperCase() + key.slice(1), b = $('b' + id);
      $('n' + id).textContent = meta.boost[key];
      b.disabled = !g || g.over || phase !== 'aim' || meta.boost[key] <= 0;
      b.classList.toggle('on', !!g && ((key === 'freeze' && g.freeze) || (key === 'power' && g.power)));
    });
    $('bFast').classList.toggle('on', fast);
    $('bFast').disabled = $('bRecall').disabled = phase !== 'shot';
  }
  function renderAll() { renderInfo(); renderBar(); draw(); }
  function openLevels() {
    var h = '';
    for (var n = 1; n <= LEVELS.length; n++) {
      var st = meta.stars[n] || 0;
      h += '<button class="lv' + (n === levelNo && g && g.mode === 'levels' ? ' cur' : '') + '" data-n="' + n + '"' + (n > meta.open ? ' disabled' : '') + '>' + n + '<small>' + '★★★'.slice(0, st) + '</small></button>';
    }
    $('lvgrid').innerHTML = h;
    $('ovLevels').classList.add('show');
  }
  var toastT = 0;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 1600); }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#bb-logo"/></svg>';
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); });
      box.appendChild(el);
    });
    $('ovEnd').classList.add('show');
  }
  function showAd(done) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done); }
  function between(next) {
    if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) {
      meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return;
    }
    next();
  }
  function openHelp() {
    $('helpTitle').textContent = 'How to play Ball Barrage';
    $('helpList').innerHTML = [
      '<b>Drag</b> anywhere above the bottom line to aim (the dotted line shows the way to the first hit) and <b>let go</b>. All your balls fly out, one after another.',
      'Every time a ball touches a brick, its number goes down by 1. At 0 it breaks. Balls bounce off everything and come back down.',
      'When all the balls are back, the bricks <b>move down a row</b>. The next shot starts where the first ball landed. If a brick reaches the bottom row, the game is over.',
      'Green rings give <b>+1 ball</b>. Blue arrows are <b>lasers</b>: a ball passing through hits every brick in that row or column. A <b>bomb</b> breaks the eight bricks around it when it goes.',
      'Boosters: the <b>rocket</b> clears the lowest row of bricks, <b>freeze</b> keeps the bricks from moving down after your next shot, and <b>power</b> makes every hit count double for one shot. Three stars on a level for the first time earns one more.',
      'The <b>fast</b> button speeds up a long turn (it also speeds up by itself); the <b>down arrow</b> brings all the balls home.',
      '<b>Levels</b>: break every brick, including the ones still coming down from above. Fewer turns earn more stars. 100 levels, each cleared by a computer player with room to spare. <b>Endless</b>: a new row every turn; how long can you last?'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var stars = 0; for (var n in meta.stars) stars += meta.stars[n];
    $('statsBody').innerHTML = '<div class="tiles"><div class="tile"><b>' + Math.max(0, meta.open - 1) + '</b><span>Levels cleared</span></div><div class="tile"><b>' + stars + '</b><span>Stars</span></div><div class="tile"><b>' + meta.endlessBest + '</b><span>Endless best</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.shots) + '</b><span>Shots</span></div><div class="tile"><b>' + fmt(stats.balls) + '</b><span>Balls fired</span></div><div class="tile"><b>' + fmt(stats.broken) + '</b><span>Bricks broken</span></div></div>';
  }

  // ================= wiring =================
  function syncSound() {
    $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>';
    $('btnSound').classList.toggle('on', settings.sound); $('setSound').checked = settings.sound; S.setEnabled(settings.sound);
  }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function inGame() { return g && !g.over && g.turn > 1; }
  function init() {
    Goobs.themePicker($('themes'));
    cv = $('cv'); cx = cv.getContext('2d');
    cv.addEventListener('pointerdown', onDown); cv.addEventListener('pointermove', onMove); cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', function () { ptr = null; aim = null; });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { save(); Goobs.home(); });
    $('modes').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b || !g || b.dataset.mode === g.mode) return;
      var go = b.dataset.mode === 'endless' ? startEndless : function () { startLevel(meta.level); };
      if (inGame() && phase !== 'over') { showCard('Leave this game?', 'It ends here.', [{ label: 'Leave it', red: true, go: go }, { label: 'Keep playing', go: function () {} }]); return; }
      go();
    });
    $('btnNew').addEventListener('click', function () {
      var go = g && g.mode === 'endless' ? startEndless : function () { startLevel(levelNo); };
      if (inGame() && phase !== 'over') { showCard('Restart?', 'This one starts over.', [{ label: 'Restart', red: true, go: go }, { label: 'Keep playing', go: function () {} }]); return; }
      go();
    });
    $('btnLevels').addEventListener('click', openLevels);
    $('lvgrid').addEventListener('click', function (e) { var b = e.target.closest('button[data-n]'); if (!b) return; $('ovLevels').classList.remove('show'); startLevel(+b.dataset.n); });
    sheet(null, 'ovLevels', 'btnCloseLevels');
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    $('btnHelp').addEventListener('click', openHelp);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setGuide').checked = settings.guide;
    $('setGuide').addEventListener('change', function () { settings.guide = this.checked; saveSettings(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    $('bRocket').addEventListener('click', function () { useBoost('rocket'); });
    $('bFreeze').addEventListener('click', function () { useBoost('freeze'); });
    $('bPower').addEventListener('click', function () { useBoost('power'); });
    $('bFast').addEventListener('click', function () { fast = !fast; renderBar(); });
    $('bRecall').addEventListener('click', function () { if (phase === 'shot' && shot) { BB.recall(g, shot); slideHome(); } });
    var rq = 0, refit = function () { if (rq) return; rq = requestAnimationFrame(function () { rq = 0; fit(); draw(); }); };
    if (window.ResizeObserver) new ResizeObserver(refit).observe($('stagewrap'));
    window.addEventListener('resize', refit);
    document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    syncSound(); syncAds(); fit();
    if (!load()) { if (meta.mode === 'endless') startEndless(); else startLevel(Math.min(meta.level, meta.open)); } else { phase = 'aim'; renderAll(); }
    if (!meta.seen) openHelp();
    lastT = performance.now(); requestAnimationFrame(frame);
    Goobs.markPlayed('barrage');
    Goobs.initUpdates({ beforeReload: save, onVersions: function (v) { $('version').textContent = 'Ball Barrage ' + (v.barrage || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
  }

  // hook for automated tests
  window.__bb = { get g() { return g; }, get phase() { return phase; }, fire: fire, BB: BB, startLevel: startLevel, startEndless: startEndless, meta: function () { return meta; },
    bot: function () { return phase === 'aim' && g && !g.over ? fire(BB.botAngle(g)) : false; }, get k() { return k; }, useBoost: useBoost, stats: function () { return stats; } };

  init();
})();
</script>
