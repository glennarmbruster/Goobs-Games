<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#5a54f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
<link rel="stylesheet" href="../../shared/goobs.css">
<script src="../../shared/goobs.js"></script>
<title>Double Take HD Prototype</title>
<style>
:root{--dt-bg:#dff3ff;--dt-card:#fff;--dt-ink:#172033;--dt-accent:#5a54f0;--dt-good:#20b968;--dt-bad:#e24e4e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(#bfe5fa,#f7ead0);color:var(--dt-ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.dt-app{min-height:100vh;display:flex;flex-direction:column}
.dt-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(20,30,55,.12)}
.dt-home,.dt-btn{border:0;border-radius:13px;background:#fff;color:#192238;min-height:44px;font:800 15px inherit;box-shadow:0 2px 8px rgba(25,35,65,.12)}
.dt-home{display:flex;align-items:center;gap:7px;padding:0 13px}
.dt-home .chev{font-size:30px;line-height:1;margin-top:-2px}
.dt-title{font-weight:900;font-size:18px;white-space:nowrap}
.dt-status{flex:1;display:flex;justify-content:center;gap:6px;min-width:0}
.pill{background:#fff;border-radius:12px;padding:6px 10px;text-align:center;box-shadow:0 2px 8px rgba(25,35,65,.10);font-weight:900;min-width:68px}
.pill small{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
.dt-actions{display:flex;gap:6px}
.dt-btn{padding:0 12px;cursor:pointer}
.dt-main{flex:1;padding:12px;display:flex;align-items:center;justify-content:center}
.board{width:min(1500px,100%);display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.photo{position:relative;overflow:hidden;border-radius:18px;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.92),0 10px 28px rgba(24,35,65,.25);touch-action:manipulation;user-select:none}
.photo img{width:100%;height:auto;display:block;pointer-events:none;user-select:none}
.tag{position:absolute;top:8px;left:8px;z-index:4;background:rgba(10,18,32,.58);color:#fff;border-radius:999px;font-size:12px;font-weight:900;padding:4px 8px}
.marker{position:absolute;border:4px solid var(--dt-good);border-radius:999px;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 18px rgba(32,185,104,.8);transform:translate(-50%,-50%);pointer-events:none;animation:pop .24s ease-out both}
.hint{position:absolute;border:4px solid #ffd84a;border-radius:999px;box-shadow:0 0 0 3px rgba(255,255,255,.92),0 0 24px rgba(255,216,74,.95);transform:translate(-50%,-50%);pointer-events:none;animation:pulse .85s ease-in-out infinite alternate}
.miss{position:absolute;width:34px;height:34px;transform:translate(-50%,-50%);pointer-events:none}
.miss:before,.miss:after{content:"";position:absolute;left:15px;top:1px;width:4px;height:32px;border-radius:3px;background:var(--dt-bad);box-shadow:0 0 0 1px #fff}
.miss:before{transform:rotate(45deg)}.miss:after{transform:rotate(-45deg)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes pulse{from{transform:translate(-50%,-50%) scale(.9)}to{transform:translate(-50%,-50%) scale(1.08)}}
.dt-bottom{position:sticky;bottom:0;z-index:20;display:flex;justify-content:center;gap:9px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-top:1px solid rgba(20,30,55,.12)}
.dt-bottom .dt-btn{padding:0 17px}
.dt-btn.primary{background:var(--dt-accent);color:#fff}
.dt-btn:disabled{opacity:.45}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,15,28,.55);display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.card{width:min(460px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.card h2{margin:0 0 10px;font-size:27px}.card p{line-height:1.45;color:#4a5368}.card .dt-btn{margin:6px;padding:0 20px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:3px}.dots i{width:7px;height:7px;border-radius:50%;background:#d4d9e4}.dots i.on{background:var(--dt-good)}
.toast{position:fixed;left:50%;bottom:78px;z-index:60;transform:translateX(-50%);background:rgba(10,18,32,.9);color:#fff;padding:9px 14px;border-radius:999px;font-weight:800;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}.toast.show{opacity:1}
@media(max-width:760px){.board{grid-template-columns:1fr;gap:10px;max-width:560px}.dt-title{display:none}.pill{padding:5px 7px;min-width:60px;font-size:14px}.dt-top{gap:6px;padding:7px 8px}.dt-home{padding:0 9px}.dt-actions .dt-btn{padding:0 9px}.dt-main{padding:9px}}
@media(max-width:390px){.pill.time{display:none}}
</style>
</head>

  <footer class="dt-bottom">
    <button class="dt-btn" id="menu">All games</button>
    <button class="dt-btn primary" id="hint">Hint <span id="hintCount">3</span></button>
  </footer>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="helpOv"><div class="card"><h2>Double Take</h2><p>Tap a difference in either picture. Both sides count. This HD prototype uses the new photorealistic art direction while keeping the Goobs return-to-menu behavior.</p><button class="dt-btn primary" id="helpClose">Let's look</button></div></div>
<div class="overlay" id="winOv"><div class="card"><h2>Nice eyes! 👀</h2><p id="winText"></p><button class="dt-btn primary" id="again">Play again</button><button class="dt-btn" id="winMenu">All games</button></div></div>
<script>
(function(){
'use strict';
const NATW=760,NATH=1024;
const DIFFS=[{"name": "upper-deck umbrella", "x": 345, "y": 75, "w": 160, "h": 125}, {"name": "seagulls", "x": 115, "y": 80, "w": 185, "h": 155}, {"name": "yellow cushion", "x": 145, "y": 320, "w": 150, "h": 105}, {"name": "flowers", "x": 0, "y": 350, "w": 145, "h": 155}, {"name": "red towel", "x": 315, "y": 350, "w": 125, "h": 105}, {"name": "beach ball", "x": 420, "y": 500, "w": 115, "h": 105}, {"name": "drink", "x": 485, "y": 590, "w": 105, "h": 165}, {"name": "hat", "x": 180, "y": 650, "w": 275, "h": 145}, {"name": "book", "x": 430, "y": 730, "w": 190, "h": 130}, {"name": "sunglasses", "x": 555, "y": 710, "w": 155, "h": 120}];
const KEY='spotdiff.hdprototype';
let found=new Set(),hints=3,start=Date.now(),timer=null;
const $=id=>document.getElementById(id);
function goHome(){ location.href='../../'; }
$('home').addEventListener('click',goHome); $('menu').addEventListener('click',goHome); $('winMenu').addEventListener('click',goHome);
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1200)}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function tick(){$('timeText').textContent=fmt((Date.now()-start)/1000)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({found:[...found],hints,startOffset:Date.now()-start}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){found=new Set((s.found||[]).filter(i=>i>=0&&i<DIFFS.length));hints=Math.max(0,Math.min(3,s.hints??3));start=Date.now()-Math.max(0,s.startOffset||0)}}catch(e){}}
function makeMark(photo,d,cls='marker'){const m=document.createElement('i');m.className=cls;m.style.left=((d.x+d.w/2)/NATW*100)+'%';m.style.top=((d.y+d.h/2)/NATH*100)+'%';m.style.width=(Math.max(d.w,d.h)/NATW*100)+'%';m.style.aspectRatio='1';photo.appendChild(m);return m}
function redraw(){for(const p of [$('photoA'),$('photoB')]){p.querySelectorAll('.marker,.hint').forEach(n=>n.remove());for(const i of found)makeMark(p,DIFFS[i]);}$('foundText').textContent=found.size+' / '+DIFFS.length;$('hintCount').textContent=hints;$('hint').disabled=hints<=0||found.size===DIFFS.length;const dots=$('dots');dots.innerHTML='';DIFFS.forEach((_,i)=>{const d=document.createElement('i');if(found.has(i))d.classList.add('on');dots.appendChild(d)});if(found.size===DIFFS.length)win();}
function coords(photo,e){const r=photo.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*NATW,y:(e.clientY-r.top)/r.height*NATH,px:e.clientX-r.left,py:e.clientY-r.top}}
function hit(x,y){let best=-1,bd=1e9;DIFFS.forEach((d,i)=>{if(found.has(i))return;const pad=18;if(x>=d.x-pad&&x<=d.x+d.w+pad&&y>=d.y-pad&&y<=d.y+d.h+pad){const cx=d.x+d.w/2,cy=d.y+d.h/2,dist=(x-cx)**2+(y-cy)**2;if(dist<bd){bd=dist;best=i}}});return best}
function miss(photo,c){const m=document.createElement('i');m.className='miss';m.style.left=c.px+'px';m.style.top=c.py+'px';photo.appendChild(m);setTimeout(()=>m.remove(),650);toast('Not there')}
for(const p of [$('photoA'),$('photoB')]) p.addEventListener('pointerup',e=>{if(found.size===DIFFS.length)return;const c=coords(p,e),i=hit(c.x,c.y);if(i>=0){found.add(i);toast(DIFFS[i].name+' ✓');redraw();save();}else miss(p,c)});
$('hint').addEventListener('click',()=>{if(hints<=0)return;const choices=DIFFS.map((_,i)=>i).filter(i=>!found.has(i));if(!choices.length)return;hints--;const i=choices[Math.floor(Math.random()*choices.length)];for(const p of [$('photoA'),$('photoB')]){const m=makeMark(p,DIFFS[i],'hint');setTimeout(()=>m.remove(),1800)}toast('Look here…');redraw();save();});
$('restart').addEventListener('click',()=>{found.clear();hints=3;start=Date.now();try{localStorage.removeItem(KEY)}catch(e){};redraw();toast('Fresh start')});
$('help').addEventListener('click',()=>$('helpOv').classList.add('show'));$('helpClose').addEventListener('click',()=>$('helpOv').classList.remove('show'));
$('again').addEventListener('click',()=>{$('winOv').classList.remove('show');found.clear();hints=3;start=Date.now();try{localStorage.removeItem(KEY)}catch(e){};redraw();});
function win(){if($('winOv').classList.contains('show'))return;clearInterval(timer);$('winText').textContent='You found all '+DIFFS.length+' differences in '+fmt((Date.now()-start)/1000)+'.';setTimeout(()=>$('winOv').classList.add('show'),350)}
load();redraw();tick();timer=setInterval(tick,250);window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
try{if(window.Goobs&&Goobs.markPlayed)Goobs.markPlayed('spotdiff')}catch(e){}
})();
</script>
