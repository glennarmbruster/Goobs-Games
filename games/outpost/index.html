<title>Outpost Rush</title>
<style>
/* Outpost Rush styles (themes, UI kit, Menu sheet and ad cards come from /shared/goobs.css) */
.brand svg { border-radius: 10px; }
/* Full screen (Glenn: "please make sure this game is full screen"): the meadow fills the whole phone edge to edge,
   behind the notch and the home bar; the kit floats back, the pills, Sound and Menu on top (html.gg-fs-over). */
html, body { height: 100%; overflow: hidden; }
html.gg-fs-over body { background: #6cc04a; }
html.gg-fs-over body.reg1, .stage.reg1 { background: #f0c77e; }
html.gg-fs-over body.reg2, .stage.reg2 { background: #dfeefa; }
.stagewrap { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; }
html.gg-fs-over .stagewrap { position: fixed; inset: 0; }
.stage { position: relative; flex: 1 1 auto; overflow: hidden; touch-action: none; background: #6cc04a; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.stage #fx { pointer-events: none; }
.top .topsp { flex: 1 1 auto; }
.top .ggpill { pointer-events: none; }
.lvpill { font-weight: 900; }
.timepill { font-size: 15px; min-width: 52px; text-align: center; }
.hint { position: absolute; left: 14px; right: 14px; margin: 0 auto; width: fit-content; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 3; box-sizing: border-box;
  background: rgba(255,255,255,.93); color: #1b2a4a; font-weight: 800; font-size: 16px; line-height: 1.25; text-align: center; padding: 10px 16px; border-radius: 18px;
  box-shadow: 0 4px 14px rgba(0,0,0,.2); pointer-events: none; transition: opacity .35s; }
.hint:empty { display: none; }
.hint.tip { font-size: 15px; font-weight: 700; max-width: 360px; text-align: left; }
.hint.tip b { color: #d98a00; }
/* the strength bar: each colour's share of all the strength on the field, floating under the top row */
.sbar { position: absolute; z-index: 2; left: 50%; transform: translateX(-50%); top: 60px; width: min(84%, 340px); height: 16px; display: flex; border-radius: 9px; overflow: hidden;
  box-shadow: 0 0 0 2.5px rgba(255,255,255,.9), 0 3px 10px rgba(0,0,0,.2); pointer-events: none; background: rgba(255,255,255,.6); }
.sbar i { display: block; flex: 1 1 0; min-width: 0; transition: flex-grow .35s ease; position: relative; }
.sbar i + i { border-left: 2px solid rgba(255,255,255,.9); }
.sbar i.out { border-left: 0; }
.sbar b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 900 11px/1 system-ui, -apple-system, sans-serif; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
.sbar .c1 { background: linear-gradient(#5b95f5, #2f6fe0); }
.sbar .c2 { background: linear-gradient(#f06a6e, #d8363c); }
.sbar .c3 { background: linear-gradient(#58cf6f, #2fa648); }
.sbar .c4 { background: linear-gradient(#f8ca52, #e0a214); }
.lv.r1 small { color: #d98a00; }
.lv.r2 small { color: #3a8fd8; }
.hint.done { opacity: 0; }
.finger { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; z-index: 3; pointer-events: none; display: none;
  background: radial-gradient(circle, rgba(255,255,255,.95) 0 38%, rgba(255,255,255,.35) 40% 100%); box-shadow: 0 0 0 3px rgba(40,90,200,.35), 0 4px 10px rgba(0,0,0,.25); }
.finger.show { display: block; }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: #1d4a16; pointer-events: none; }
.loading.hide { display: none; }
.toast { position: absolute; z-index: 4; left: 50%; top: 34%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(10,14,36,.8); color: #fff; font-weight: 800; font-size: 15px; padding: 8px 15px; border-radius: 14px; max-width: 86%; }
.toast.show { opacity: 1; }
.lvhead { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--muted); margin: 0 2px 10px; font-size: 15px; }
.lvhead b { color: var(--ink); }
.gold { color: #d99a00; font-weight: 900; }
.gold::before { content: ''; display: inline-block; width: 14px; height: 14px; margin: 0 4px -2px 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8 0 15%, #ffc83d 45%, #d08a00 100%); }
.lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lv { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); height: 54px; font-weight: 800; font-size: 16px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.lv small { font-size: 11px; color: #e0a800; letter-spacing: -1px; min-height: 12px; }
/* the level map takes each region's look: meadow green, desert sand, tundra ice (the current level keeps the accent) */
.lv.r0 { background: linear-gradient(#eaf8dd, #cbeab4); border-color: #a6d58a; color: #1f4a17; }
.lv.r1 { background: linear-gradient(#fcefd0, #f2d392); border-color: #deb25e; color: #5a3a0e; }
.lv.r2 { background: linear-gradient(#f6fbff, #d8eaf9); border-color: #a9c9e6; color: #18365a; }
.lvhead.r0, .lvhead.r1, .lvhead.r2 { padding: 9px 12px; border-radius: 12px; color: rgba(0,0,0,.6); }
.lvhead.r0 b, .lvhead.r1 b, .lvhead.r2 b { color: #111; }
.lvhead.r0 { background: linear-gradient(100deg, #bfe7a3, #8fd06a); }
.lvhead.r1 { background: linear-gradient(100deg, #f7dba0, #e9b861); }
.lvhead.r2 { background: linear-gradient(100deg, #eef6fd, #bcd9f2); }
.lv.cur { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.lv:disabled { opacity: .35; }
.lvpages { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.lvpages button { font: inherit; font-weight: 800; font-size: 13px; border: 0; border-radius: 10px; padding: 7px 9px; background: var(--surface-2); color: var(--muted); }
.lvpages button.on { background: var(--accent); color: #fff; }
.lvpages button[disabled] { opacity: .35; }
.stars { font-size: 26px; color: #ffc83d; letter-spacing: 2px; }
.stars .off { color: var(--line-strong); }
.cardicon svg { border-radius: 16px; }
.endinfo { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-weight: 800; margin-top: 4px; }
.menustars { color: #ffb400; letter-spacing: 1px; }
.sbprobe { position: fixed; left: 0; bottom: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); visibility: hidden; pointer-events: none; }
.brand h1 { font-size: 21px; }
@media (max-width: 385px) { .brand h1 { font-size: 19px; } }
@media (max-width: 360px) { .timepill { display: none; } }
</style>

<script>
/* Outpost Rush rules: the battle simulation (buildings, lines, troops, fights, capture, map elements), the computer
   players and the level format. Fixed timestep (OP.DT), deterministic (seeded), no drawing: the page (app.js +
   scene.js) and the Node checks (tools/check.js, tools/gen.js) run the very same code.

   The map is W x H world units, x to the right, y down the screen (the player is at the bottom).
   Owners: 0 gray (neutral), 1 blue (the player), 2 red, 3 green, 4 yellow (computers; they fight each other too).
   Buildings: 'b' barracks (soldiers), 'f' factory (tanks), 's' sniper tower (shoots, sends nothing), 'r' rocket
   launcher (fires at one target you pick), 'F' fort (big, higher max, drops paratroopers).

   0.2.0 (Glenn): sending is free. A line emits troops at a rate set by the tower; the tower keeps growing (slower
   while it sends) and only enemy hits lower its number. Link slots: 1 below 10, 2 from 10, 3 from 30. */
var OP = (function () {
  'use strict';
  var DT = 1 / 30;          // 30 steps a second
  var W = 9, H = 17;        // the battlefield (world units)
  var CAP = 63;             // a tower's top number ("Max")
  var FORT_CAP = 99;        // a fort's top number (a level may raise it, e.g. 120)
  var SPEED = [1.45, 0.95, 2.1]; // units a second: soldier, tank (slower), paratrooper (flies)
  var HP = [1, 2, 1];       // a tank counts as 2 soldiers
  var EDGE = 0.42;          // troops leave / arrive at this distance from a building's middle
  var FORT_EDGE = 0.9;      // a fort is about 4x the footprint
  var GROW_IDLE = 0.9;      // seconds per +1 for a tower with no outgoing lines (the original: idle towers level faster)
  var GROW_SEND = 2.0;      // seconds per +1 while it sends
  var SEND_LO = 0.62, SEND_HI = 0.4; // seconds between two troops on one line, at 0 and at 63 (bigger towers send faster)
  var TANK_GAP = 2.0, PARA_GAP = 1.2; // a factory sends a tank every 2 soldier-gaps (same strength per second), a fort a paratrooper every 1.2
  var CLASH = 0.16;         // two opposing troops closer than this fight
  var START_CAP = 1;        // a captured tower starts with the troop that took it
  var SNIPE_R = [2.0, 2.5, 3.0], SNIPE_GAP = [1.2, 0.95, 0.75]; // sniper range / seconds per shot below 10, 10-29, 30+
  var ROCKET_DMG = 3, ROCKET_SPEED = 5.5, ROCKET_LO = 1.5, ROCKET_HI = 0.7; // rocket: -3, flies 5.5/s, one every 1.5 s at 0 -> 0.7 s at 63 (faster than any line)
  var MINE_TRIG = 0.32, MINE_R = 0.6, MINE_RE = 12; // a mine goes off when a troop passes this close, kills troops within MINE_R, re-arms after 12 s
  var GOLD_R = 0.5, GOLD_BOOST = 15, GOLD_COIN = 10; // gold bar pick-up distance; the sender grows twice as fast for 15 s; +10 gold for you
  var BOOST = 2;            // growth speed-up while boosted

  function rng(seed) {
    var a = seed >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  // link slots: 1 below 10, 2 from 10, 3 from 30 (the dots under the number). Snipers send nothing; a rocket launcher
  // has one target at a time.
  function slots(n, type) { if (type === 's') return 0; if (type === 'r') return 1; return n >= 30 ? 3 : n >= 10 ? 2 : 1; }
  // the number a tower needs to hold k lines (enemy hits pushing it under drop its newest lines)
  function floorFor(k) { return k >= 3 ? 30 : k >= 2 ? 10 : 0; }
  // floors drawn for a number (the tower visibly grows)
  function floors(n) { return n < 6 ? 1 : n < 14 ? 2 : n < 24 ? 3 : n < 36 ? 4 : n < 50 ? 5 : 6; }
  function band(n) { return n >= 30 ? 2 : n >= 10 ? 1 : 0; }
  function snipeRange(n) { return SNIPE_R[band(n)]; }
  function kindOf(type) { return type === 'f' ? 1 : type === 'F' ? 2 : 0; }
  function sender(type) { return type === 'b' || type === 'f' || type === 'F'; }
  // seconds between two troops on one of this tower's lines
  function sendGap(T) { var g = SEND_LO - (SEND_LO - SEND_HI) * Math.min(1, T.n / CAP); return T.type === 'f' ? g * TANK_GAP : T.type === 'F' ? g * PARA_GAP : g; }
  function rocketGap(T) { return ROCKET_LO - (ROCKET_LO - ROCKET_HI) * Math.min(1, T.n / CAP); }
  // troop strength a tower's line delivers per second
  function rate(T) { return T.type === 'r' ? ROCKET_DMG / rocketGap(T) : HP[kindOf(T.type)] / sendGap(T); }

  // ---------------- geometry ----------------
  function segDist(px, py, ax, ay, bx, by) { var dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy, t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(px - ax - dx * t, py - ay - dy * t); }
  // where segment a->b first crosses segment c-d (0..1 along a->b), or -1
  function segCross(ax, ay, bx, by, cx, cy, dx, dy) {

      if (lesson.n === 1) sim.towers.forEach(function (t, i) { if (t.o === 0 && to < 0) to = i; });
      else sim.towers.forEach(function (t, i) { if (t.o === 1 && i !== from && to < 0) to = i; });
      if (from < 0 || to < 0) { f.classList.remove('show'); return; }
      var s1 = SC.towerScreen(from), s2 = SC.towerScreen(to); a = [(s1.bx + s1.tx) / 2, (s1.by + s1.ty) / 2]; b = [(s2.bx + s2.tx) / 2, (s2.by + s2.ty) / 2];
    }
    var m = Math.min(1, Math.max(0, (k - 0.15) / 0.6)), e2 = m * m * (3 - 2 * m);
    f.style.transform = 'translate(' + (a[0] + (b[0] - a[0]) * e2) + 'px,' + (a[1] + (b[1] - a[1]) * e2) + 'px)';
    f.style.opacity = k < 0.1 ? k / 0.1 : k > 0.85 ? (1 - k) / 0.15 : 1;
    f.classList.add('show');
  }

  // ================= info and sheets =================
  function renderInfo() {
    FS.refresh();
    $('lvPill').textContent = 'Level ' + levelNo;
    if (!sim || state === 'idle') $('timePill').textContent = '0:00';
  }
  var lvPage = 0, PAGE = 20;
  // the level map: one page per region (Meadow 1-20, Desert 21-40, Tundra 41-60); a region opens with its first level
  function openLevels() { lvPage = Math.floor((levelNo - 1) / PAGE); renderLevels(); $('ovLevels').classList.add('show'); }
  function renderLevels() {
    var pages = Math.ceil(LEVELS.length / PAGE), regions = REGIONS;
    lvPage = Math.max(0, Math.min(pages - 1, lvPage));
    var tabs = '<div class="lvpages">';
    for (var q = 0; q < pages; q++) tabs += '<button data-p="' + q + '" class="' + (q === lvPage ? 'on' : '') + '"' + (q * PAGE + 1 > meta.open ? ' disabled' : '') + '>' + (regions[q] || 'Region ' + (q + 1)) + ' ' + (q * PAGE + 1) + '–' + Math.min(LEVELS.length, (q + 1) * PAGE) + '</button>';
    tabs += '</div>';
    var stars = 0, rs = 0; for (var k in meta.stars) { stars += meta.stars[k]; if (Math.floor((k - 1) / PAGE) === lvPage) rs += meta.stars[k]; }
    var h = '';
    for (var n = lvPage * PAGE + 1; n <= Math.min(LEVELS.length, (lvPage + 1) * PAGE); n++) { var st = meta.stars[n] || 0; h += '<button class="lv r' + lvPage + (n === levelNo ? ' cur' : '') + '" data-n="' + n + '"' + (n > meta.open ? ' disabled' : '') + '>' + n + '<small>' + '★★★'.slice(0, st) + '</small></button>'; }
    $('lvpagesBox').innerHTML = tabs;
    $('lvHead').className = 'lvhead r' + lvPage;
    $('lvHead').innerHTML = '<span>' + (regions[lvPage] || '') + ' ★ <b>' + rs + '</b> / ' + PAGE * 3 + ' · all <b>' + stars + '</b></span><span class="gold">' + fmt(meta.gold) + '</span>';
    $('lvgrid').innerHTML = h;
  }
  var toastT = 0;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 1800); }
  function showCard(title, html, buttons) {
    $('cardIcon').innerHTML = '<svg viewBox="0 0 100 100"><use href="#op-logo"/></svg>';
    $('endTitle').textContent = title; $('endText').innerHTML = html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) { var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label; el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); }); box.appendChild(el); });
    $('ovEnd').classList.add('show');
  }
  function showAd(done) { GoobsAds.show({ onShow: function () { S.ding(); }, onStep: function () { S.sign(); } }, done); }
  function between(next) { if (Goobs.adsOn() && meta.finished > 0 && meta.finished % settings.adEvery === 0 && meta.lastAdAt !== meta.finished) { meta.lastAdAt = meta.finished; saveMeta(); next(); showAd(function () {}); return; } next(); }
  function openHelp() {
    $('helpTitle').textContent = 'How to play Outpost Rush';
    $('helpList').innerHTML = [
      'You are <b>blue</b>. Take every building on the field to win. Red, green and yellow fight you and each other.',
      '<b>Drag from your tower to another building</b> to draw a line. Your troops march along it one after another. Sending is free: your tower keeps its number and keeps growing (slower while it sends).',
      'A troop that reaches an enemy or gray building takes 1 off it. At <b>0 it is yours</b>. One that reaches your own building adds 1 (send help to the front).',
      'Buildings grow by themselves up to <b>Max</b> (63). One with no lines grows faster. Gray buildings never grow and never fight back.',
      'The dots under the number are lines: one line below 10, <b>two from 10, three from 30</b>. If enemies push a tower below that, it drops its newest line.',
      '<b>Swipe across one of your lines</b> to cut it. Troops already on the way keep going.',
      'Two enemy lines between the same buildings meet head on: troops fight where they meet.',
      '<b>Factory</b>: sends tanks, slower but worth 2 soldiers. <b>Sniper tower</b>: shoots enemy troops in its circle (bigger at 10 and 30), makes no lines. <b>Rocket launcher</b>: drag from it to any building to fire rockets at it (-3 each; troops still have to take it). Drag again to switch targets, tap it to stop. <b>Fort</b>: big, grows to 99, drops paratroopers that fly over everything.',
      'Lines must be straight: <b>rocks, trees, water and ice</b> block them. <b>Fences</b>: troops break them first. <b>Broken bridges</b>: troops build them plank by plank. <b>Mines</b> blow up troops near them, then re-arm. <b>Gold bars</b>: the first troop to pass picks one up (faster growth + gold).',
      'The bar at the top shows each colour’s share of all the strength on the field.',
      'Win faster for more stars and gold. Losing costs nothing: try again right away.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function renderStats() {
    var stars = 0; for (var n in meta.stars) stars += meta.stars[n];
    var best = 1e9; for (var b in meta.best) best = Math.min(best, meta.best[b]);
    $('statsBody').innerHTML = '<div class="tiles"><div class="tile"><b>' + Math.max(0, meta.open - 1) + '</b><span>Levels won</span></div><div class="tile"><b>' + stars + '</b><span>Stars</span></div><div class="tile"><b>' + fmt(meta.gold) + '</b><span>Gold</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.wins) + '</b><span>Wins</span></div><div class="tile"><b>' + fmt(stats.losses) + '</b><span>Losses</span></div><div class="tile"><b>' + (best < 1e9 ? clock(best) : '–') + '</b><span>Fastest win</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.captured) + '</b><span>Towers taken</span></div><div class="tile"><b>' + fmt(stats.sent) + '</b><span>Soldiers sent</span></div><div class="tile"><b>' + fmt(stats.cuts) + '</b><span>Lines cut</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.fences) + '</b><span>Fences broken</span></div><div class="tile"><b>' + fmt(stats.bridges) + '</b><span>Bridges built</span></div><div class="tile"><b>' + fmt(stats.bars) + '</b><span>Gold bars</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + fmt(stats.tries) + '</b><span>Battles</span></div><div class="tile"><b>' + clock(stats.playSec) + '</b><span>Time played</span></div><div class="tile"><b>' + fmt(stats.goldEarned) + '</b><span>Gold earned</span></div></div>';
  }

  // ================= wiring =================
  function syncSound() {
    $('btnSound').innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-sound-' + (settings.sound ? 'on' : 'off') + '"/></svg>'; $('btnSound').classList.toggle('on', settings.sound);
    $('setSound').checked = settings.sound; $('setMusic').checked = settings.music;
    // the round Sound button mutes everything; Settings has separate switches for effects and music
    S.setEnabled(settings.sound); S.setMusic(settings.sound && settings.music);
  }
  function syncAds() { $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery; $('rowAdEvery').classList.toggle('off', !Goobs.adsOn()); }
  function sheet(btn, ov, close, onOpen) {
    if (btn) $(btn).addEventListener('click', function () { if (onOpen) onOpen(); $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }
  function init() {
    Goobs.themePicker($('themes'));
    host = $('stage'); canvas = $('cv'); fxc = $('fx'); fxx = fxc.getContext('2d');
    probe = document.createElement('div'); probe.className = 'sbprobe'; document.body.appendChild(probe);
    canvas.addEventListener('pointerdown', onDown); canvas.addEventListener('pointermove', onMove); canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { if (drag && drag.mode === 'link') SC.dragHide(); drag = null; });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { S.unlock(); }, { passive: true }); });
    $('btnHome').addEventListener('click', function () { Goobs.home(); });
    $('btnNew').addEventListener('click', function () {
      if (sim && state === 'play' && sim.t > 5) { showCard('Start again?', 'The level starts over from the beginning.', [{ label: 'Start again', red: true, go: function () { startLevel(levelNo); } }, { label: 'Keep playing', go: function () {} }]); return; }
      startLevel(levelNo);
    });
    $('btnLevels').addEventListener('click', openLevels);
    $('lvpagesBox').addEventListener('click', function (e) { var b = e.target.closest('button[data-p]'); if (!b || b.disabled) return; lvPage = +b.dataset.p; renderLevels(); });
    $('lvgrid').addEventListener('click', function (e) { var b = e.target.closest('button[data-n]'); if (!b) return; $('ovLevels').classList.remove('show'); between(function () { startLevel(+b.dataset.n); }); });
    sheet(null, 'ovLevels', 'btnCloseLevels');
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings');
    sheet('btnStats', 'ovStats', 'btnCloseStats', renderStats);
    $('btnHelp').addEventListener('click', openHelp);
    function closeHelp() { $('ovHelp').classList.remove('show'); if (!meta.seen) { meta.seen = true; saveMeta(); } }
    $('btnCloseHelp').addEventListener('click', closeHelp);
    $('ovHelp').addEventListener('click', function (e) { if (e.target === this) closeHelp(); });
    $('btnSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSound(); S.ding(); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); syncSound(); S.ding(); });
    $('setMusic').addEventListener('change', function () { settings.music = this.checked; if (settings.music && !settings.sound) settings.sound = true; saveSettings(); syncSound(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncAds(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncAds(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncAds(); });
    var rq = 0, refit = function () { if (rq) return; rq = requestAnimationFrame(function () { rq = 0; resize(); }); };
    if (window.ResizeObserver) new ResizeObserver(refit).observe(host);
    window.addEventListener('resize', refit);
    syncSound(); syncAds();
    levelNo = meta.level; renderInfo();
    if (!meta.seen) openHelp();
    Goobs.markPlayed('outpost');
    Goobs.initUpdates({ onVersions: function (v) { $('version').textContent = 'Outpost Rush ' + (v.outpost || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
    import('../../shared/three.module.min.js').then(function (m) {
      T = m;
      SC = OPScene.build(T, canvas, OP); resize();
      ready = true; $('loading').classList.add('hide');
      startLevel(levelNo);
      requestAnimationFrame(frame);
      window.__opReady = true;
    }).catch(function (err) { $('loading').textContent = 'Couldn’t load the game. Check the connection once, then it works offline.'; if (window.console) console.warn(err); });
  }
  // test hook
  window.__op = { get sim() { return sim; }, get state() { return state; }, get level() { return level; }, get levelNo() { return levelNo; }, startLevel: startLevel, OP: OP,
    get SC() { return SC; }, meta: function () { return meta; }, stats: function () { return stats; }, perf: perf, get ready() { return ready; },
    set speed(v) { speed = v; }, get speed() { return speed; },
    towerScreen: function (i) { return SC.towerScreen(i); }, project: function (x, y, h) { var r = canvas.getBoundingClientRect(), p = SC.project(x, y, h); return [r.left + p[0], r.top + p[1]]; },
    tips: function () { return tipOn; }, strength: function () { return sim ? OP.strength(sim) : null; },
    give: function (i, o, n) { var t = sim.towers[i]; if (o !== undefined && o !== t.o) { for (var k = t.links.length - 1; k >= 0; k--) OP.cut(sim, t.links[k], 'lost'); t.o = o; } if (n !== undefined) t.n = n; },
    link: function (a, b) { return OP.playerLink(sim, a, b); } };
  init();
})();
</script>
