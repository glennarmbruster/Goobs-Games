<title>Neon Siege</title>
<style>
/* Neon Siege: near-black, glowing outlines, no images */
:root { --bg: #05060d; --ink: #e8f4ff; --dim: #7d8bb3; --cyan: #3dd8ff; --pink: #ff3df2; --green: #39ff9c; --amber: #ffb13d; --red: #ff3d5a;
  --panel: rgba(8, 12, 30, .86); --line: rgba(80, 160, 255, .35);
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none;
  font-family: -apple-system, system-ui, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
canvas#cv { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
.hidden { display: none !important; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.topbar { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--st) + 6px) calc(var(--sr) + 8px) 6px calc(var(--sl) + 8px);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px;
  background: linear-gradient(rgba(5,6,13,.92), rgba(5,6,13,.7)); border-bottom: 1px solid rgba(61,216,255,.18); }
.stats { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stat { font-weight: 800; font-size: 15px; letter-spacing: .3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat.lives { color: #ff6b8a; text-shadow: 0 0 8px rgba(255,61,90,.7); }
.stat.cash { color: var(--amber); text-shadow: 0 0 8px rgba(255,177,61,.6); }
.stat.wave { color: var(--cyan); text-shadow: 0 0 8px rgba(61,216,255,.6); }
.stat.score { color: var(--dim); font-size: 13px; }
.btns { display: flex; gap: 6px; }
.hb { min-width: 40px; height: 34px; padding: 0 9px; border-radius: 10px; border: 1px solid var(--line); background: rgba(20,30,70,.55); color: var(--ink); font-weight: 800; font-size: 14px;
  box-shadow: 0 0 10px rgba(61,216,255,.15) inset; }
.hb:active { background: rgba(61,216,255,.25); }
.hb.warn { border-color: var(--red); color: #fff; background: rgba(255,61,90,.45); box-shadow: 0 0 14px rgba(255,61,90,.6); }
.hb.on { border-color: var(--green); color: var(--green); }

.bottombar { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px calc(var(--sr) + 8px) calc(var(--sb) + 6px) calc(var(--sl) + 8px);
  display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; background: linear-gradient(rgba(5,6,13,.7), rgba(5,6,13,.94)); border-top: 1px solid rgba(61,216,255,.18); }
.towers { display: flex; gap: 5px; flex: 1 1 auto; }
.tb { flex: 1 1 0; min-width: 52px; max-width: 86px; height: 56px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: rgba(16,22,52,.7);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; position: relative; }
.tb svg { width: 26px; height: 26px; overflow: visible; }
.tb b { font-size: 12px; font-weight: 800; color: var(--amber); }
.tb.sel { border-color: currentColor; box-shadow: 0 0 14px currentColor, 0 0 6px currentColor inset; background: rgba(30,40,90,.8); }
.tb.poor b { color: #6b6f86; }
.tb.poor svg { opacity: .45; }
.wavebox { display: flex; gap: 6px; align-items: stretch; flex: 1 1 auto; }
.next { flex: 1 1 auto; min-width: 96px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: rgba(16,22,52,.55); padding: 4px 8px;
  font-size: 11.5px; line-height: 1.25; color: var(--dim); display: flex; flex-direction: column; justify-content: center; }
.next .nw { display: flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 700; font-size: 13px; flex-wrap: wrap; }
.next .nw svg { width: 16px; height: 16px; overflow: visible; }
.next .boss { color: var(--red); font-weight: 900; text-shadow: 0 0 8px rgba(255,61,90,.8); }
.send { border-radius: 12px; padding: 0 12px; font-weight: 900; font-size: 14px; color: #041016; background: var(--green); box-shadow: 0 0 16px rgba(57,255,156,.6); min-width: 104px; line-height: 1.15; }
.send small { display: block; font-size: 11px; font-weight: 800; opacity: .8; }
.send:disabled { background: #25304f; color: #7d8bb3; box-shadow: none; }
.fit { height: auto; }

.hint { position: absolute; left: 50%; transform: translateX(-50%); top: 0; margin-top: 0; padding: 7px 14px; border-radius: 14px; background: var(--panel);

/* Neon Siege logic: the whole simulation, with no drawing, so it also runs in Node (tools/bot.js balances the levels).

    laser: { name: 'Laser', short: 'Beam, long range', cost: 150, range: 4.2, dps: 40, maxLv: 10, color: '#ff3df2' },
    missile: { name: 'Missile', short: 'Homing splash', cost: 180, range: 4.4, rate: 0.8, dmg: 55, splash: 1.15, maxLv: 5, color: '#ffb13d' },
    shock: { name: 'Shock', short: 'Slowing pulse', cost: 110, range: 2.3, rate: 0.75, dmg: 6, slow: 0.42, slowT: 2.0, maxLv: 5, color: '#3dd8ff' },
    burst: { name: 'Burst', short: 'Area blast', cost: 160, range: 1.8, rate: 1.1, dmg: 30, maxLv: 5, color: '#ff5a3d' }
  };
  var ORDER = ['blaster', 'laser', 'missile', 'shock', 'burst'];

    else { s.rate = T.rate * (1 + 0.07 * k); s.dmg = T.dmg * Math.pow(1.45, k); }

    fast: { name: 'Dart', shape: 'triangle', hp: 34, speed: 2.1, bounty: 4, lives: 1, size: 0.24, color: '#ffe63d' },
    tank: { name: 'Hex tank', shape: 'hexagon', hp: 260, speed: 0.62, bounty: 10, lives: 2, size: 0.34, color: '#9dff3d',

    healer: { name: 'Mender', shape: 'circle', hp: 110, speed: 0.95, bounty: 7, lives: 1, size: 0.27, color: '#3dffe6', regen: 0.05 },

<script>
/* Neon Siege app: menus, the neon renderer (additive glow, particles, shock rings, beams), touch (tap to preview, tap

(function () {

    cx.setLineDash([]);
  }
  function drawTowers(px) {
    g.towers.forEach(function (t) {
      var col = T[t.type].color, S = SG.stats(t.type, t.lv);
      cx.save(); cx.translate(t.x, t.y);
      // base
      cx.beginPath(); if (g.mode === 'swarm') hexPath(cx, 0, 0, SG.HS * 0.82); else { var b = 0.4; cx.rect(-b, -b, 2 * b, 2 * b); }
      cx.globalCompositeOperation = 'source-over'; cx.fillStyle = 'rgba(6,10,26,.9)'; cx.fill(); cx.globalCompositeOperation = 'lighter';
      glow(cx, col, 0.035, 0.75);
      // turret
      cx.rotate(t.ang + Math.PI / 2);
      var kick = t.fire > 0 ? 0.06 : 0;
      cx.beginPath();
      if (t.type === 'blaster') { cx.arc(0, 0, 0.17, 0, Math.PI * 2); cx.moveTo(0, -0.05 + kick); cx.lineTo(0, -0.38 + kick); }
      else if (t.type === 'laser') { cx.moveTo(-0.18, 0.16); cx.lineTo(0, -0.26); cx.lineTo(0.18, 0.16); cx.closePath(); cx.moveTo(0, -0.26); cx.lineTo(0, -0.38); }
      else if (t.type === 'missile') { cx.rect(-0.17, -0.2, 0.34, 0.4); cx.moveTo(-0.08, -0.05); cx.lineTo(0, -0.18); cx.lineTo(0.08, -0.05); }
      else if (t.type === 'shock') { cx.arc(0, 0, 0.12 + (t.fire > 0 ? 0.05 : 0), 0, Math.PI * 2); cx.moveTo(0.26, 0); cx.arc(0, 0, 0.26, 0, Math.PI * 2); }
      else { cx.rotate(tNow * 1.5); for (var i = 0; i < 8; i++) { var a = i * Math.PI / 4, rr = i % 2 ? 0.1 : 0.28 + (t.fire > 0 ? 0.06 : 0); if (i) cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); else cx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } cx.closePath(); }
      glow(cx, col, 0.035);
      cx.restore();
      // level pips
      cx.fillStyle = col; var n = t.lv, pw = Math.min(0.08, 0.7 / Math.max(5, n));
      for (var p = 0; p < n; p++) cx.fillRect(t.x - (n * pw * 1.6) / 2 + p * pw * 1.6, t.y + 0.3, pw, pw);
      if (sel === t) { cx.beginPath(); cx.arc(t.x, t.y, S.range, 0, Math.PI * 2); cx.fillStyle = 'rgba(61,216,255,.05)'; cx.fill(); cx.setLineDash([0.12, 0.12]); glow(cx, col, 0.025, 0.7); cx.setLineDash([]); }
      // laser beam
      if (t.type === 'laser' && t.beam && t.tgt && t.tgt.alive) {
        var ex = t.tgt.x + t.tgt.jx, ey = t.tgt.y + t.tgt.jy, fl = 0.8 + 0.2 * Math.sin(tNow * 50 + t.id);
        cx.beginPath(); cx.moveTo(t.x, t.y); cx.lineTo(ex, ey);
        cx.strokeStyle = col; cx.globalAlpha = 0.25 * fl; cx.lineWidth = 0.22 + 0.02 * t.lv; cx.stroke();
        cx.globalAlpha = 0.6 * fl; cx.lineWidth = 0.08; cx.stroke(); cx.strokeStyle = '#ffffff'; cx.globalAlpha = 0.9; cx.lineWidth = 0.025; cx.stroke(); cx.globalAlpha = 1;
        if (Math.random() < 0.5) particles(ex, ey, col, 1, 1.5, 0.2, 0.04);
      }
    });
  }
  function drawEnemies(px) {
    g.enemies.forEach(function (e) {
      var E = e.E, x = e.x + e.jx, y = e.y + e.jy;
      cx.save(); cx.translate(x, y); cx.rotate(e.type === 'fast' ? (e.dir || 0) + Math.PI / 2 : e.spin);
      shape(cx, E.shape, e.size);
      if (e.hit > 0) { cx.fillStyle = 'rgba(255,255,255,.55)'; cx.fill(); }
      glow(cx, e.slow > 0 ? '#9ef0ff' : E.color, e.type === 'swarm' ? 0.025 : 0.04);
      if (e.type === 'boss') { cx.rotate(-e.spin * 2); shape(cx, 'hexagon', e.size * 0.45); glow(cx, '#ffd23f', 0.03); }
      if (e.type === 'healer' && e.hp < e.max) { cx.beginPath(); cx.arc(0, 0, e.size * 0.45, 0, Math.PI * 2); cx.fillStyle = 'rgba(61,255,230,' + (0.25 + 0.2 * Math.sin(tNow * 8)).toFixed(3) + ')'; cx.fill(); }
      cx.restore();
      if (e.slow > 0) { cx.beginPath(); cx.arc(x, y, e.size + 0.07, 0, Math.PI * 2); cx.strokeStyle = 'rgba(61,216,255,.5)'; cx.lineWidth = 0.02; cx.stroke(); }
      if (e.hp < e.max && e.type !== 'swarm') { // health: a ring around the enemy (reads the same whichever way the field is turned)
        var f = Math.max(0, e.hp / e.max), rr2 = e.size + 0.1;
        cx.beginPath(); cx.arc(x, y, rr2, 0, Math.PI * 2); cx.strokeStyle = 'rgba(255,60,90,.35)'; cx.lineWidth = 0.035; cx.stroke();
        cx.beginPath(); cx.arc(x, y, rr2, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); cx.strokeStyle = f > 0.5 ? '#39ff9c' : f > 0.25 ? '#ffd23f' : '#ff3d5a'; cx.stroke();
      }
    });
  }
  function drawShots(px) {
    g.shots.forEach(function (s) {
      if (s.kind === 'bolt') { cx.beginPath(); cx.moveTo(s.x, s.y); cx.lineTo(s.x - Math.cos(s.ang) * 0.28, s.y - Math.sin(s.ang) * 0.28); glow(cx, '#39ff9c', 0.035); }
      else {
        cx.save(); cx.translate(s.x, s.y); cx.rotate(s.ang); cx.beginPath(); cx.moveTo(0.14, 0); cx.lineTo(-0.1, -0.07); cx.lineTo(-0.1, 0.07); cx.closePath(); glow(cx, '#ffb13d', 0.03); cx.restore();
      }
    });
  }
  function drawFx(px) {
    rings.forEach(function (r) {
      var q = r.t / r.life, rad = r.r * (0.3 + 0.7 * Math.sqrt(q));
      cx.beginPath(); cx.arc(r.x, r.y, rad, 0, Math.PI * 2);
      if (r.fill) { cx.fillStyle = r.color; cx.globalAlpha = 0.18 * (1 - q); cx.fill(); cx.globalAlpha = 1; }
      glow(cx, r.color, 0.04 * (1 - q) + 0.01, 1 - q);
    });
    fx.forEach(function (p) { var a = 1 - p.t / p.life; cx.globalAlpha = a; cx.fillStyle = p.color; cx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); cx.globalAlpha = a * 0.25; cx.fillRect(p.x - p.s * 1.5, p.y - p.s * 1.5, p.s * 3, p.s * 3); });
    cx.globalAlpha = 1;
  }
  function drawPreview(px) {
    if (!preview) return;
    var c = SG.cellCenter(g, preview.cell), col = preview.ok ? T[preview.type].color : '#ff3d5a', S = SG.stats(preview.type, 1);
    cx.beginPath(); cx.arc(c[0], c[1], S.range, 0, Math.PI * 2); cx.fillStyle = preview.ok ? 'rgba(61,216,255,.07)' : 'rgba(255,61,90,.06)'; cx.fill();
    cx.setLineDash([0.14, 0.12]); cx.lineDashOffset = -tNow * 0.5; glow(cx, col, 0.025, 0.8); cx.setLineDash([]);
    cx.beginPath(); if (g.mode === 'swarm') hexPath(cx, c[0], c[1], SG.HS * 0.85); else cx.rect(c[0] - 0.45, c[1] - 0.45, 0.9, 0.9);
    glow(cx, col, 0.04, 0.6 + 0.3 * Math.sin(tNow * 8));
  }
  // the menu background: a slow drifting neon grid
  function drawMenuBg() {
    var w = cv.width, h = cv.height, s = 48 * dpr, off = (tNow * 12 * dpr) % s;
    cx.strokeStyle = 'rgba(60,110,220,.14)'; cx.lineWidth = dpr; cx.beginPath();
    for (var x = -s + off; x < w + s; x += s) { cx.moveTo(x, 0); cx.lineTo(x, h); }
    for (var y = -s + off; y < h + s; y += s) { cx.moveTo(0, y); cx.lineTo(w, y); }
    cx.stroke();
  }

  // ================= loop =================
  var acc = 0, lastT = 0, hudT = 0;
  function frame(tms) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.1, lastT ? (tms - lastT) / 1000 : 0); lastT = tms; tNow += dt;
    if (g && !paused && !g.overShown) {
      acc += dt * speed; var n = 0;
      while (acc >= SG.DT && n < 24) { SG.step(g); acc -= SG.DT; n++; onEvents(SG.takeEvents(g)); if (g.over) break; }
      if (n >= 24) acc = 0;
      // missile smoke
      g.shots.forEach(function (s) { if (s.kind === 'missile' && Math.random() < 0.6 * speed) particles(s.x, s.y, '#ff9a3d', 1, 0.4, 0.35, 0.04); });
      if (g.over) g.overShown = true;
      hudT += dt; if (hudT > 0.2) { hudT = 0; renderHud(); }
      if (preview && g.mode === 'swarm' && Math.floor(tNow * 4) !== Math.floor((tNow - dt) * 4)) checkPreviewQuiet();
    }
    var fdt = paused ? 0 : dt * Math.min(speed, 2);
    fx.forEach(function (p) { p.t += fdt; p.x += p.vx * fdt; p.y += p.vy * fdt; p.vx *= 0.96; p.vy *= 0.96; });
    fx = fx.filter(function (p) { return p.t < p.life; });
    rings.forEach(function (r) { r.t += fdt; }); rings = rings.filter(function (r) { return r.t < r.life; });
    texts.forEach(function (t) { t.t += dt; }); texts = texts.filter(function (t) { return t.t < 1.1; });
    if (shake > 0) shake = Math.max(0, shake - dt);
    if (flash > 0) flash = Math.max(0, flash - dt * 1.5);
    draw();
  }
  // enemies move, so a swarm build can become (im)possible while the preview is up
  function checkPreviewQuiet() { var cb = SG.canBuild(g, preview.cell, preview.type); preview.ok = cb.ok; preview.why = cb.why; }

  // ================= start up =================
  window.addEventListener('resize', function () { if (!g) { resize(); renderLevels(); } });
  resize(); renderLevels();
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', function () { if (document.hidden && g && !g.over) { paused = true; $('pause').classList.remove('hidden'); } });

  // hook for automated tests
  window.__ns = { get g() { return g; }, start: start, SG: SG, tap: tap, toScreen: function (x, y) { return toScreen(x, y); }, get view() { return view; }, fit: fit, setSpeed: function (s) { speed = s; }, get preview() { return preview; }, get sel() { return sel; }, P: P, prog: function () { return prog; } };
})();
</script>
