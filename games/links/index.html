<script>
/* if Color Link can't open, say so on screen (never a blank page) and offer a fresh start */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__clReady) return; shown = true;
    function put() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#f4f5f9;color:#1b1f33;font:600 16px -apple-system,system-ui,sans-serif;text-align:center';
      d.innerHTML = '<b style="font-size:21px">Color Link didn’t open</b><div style="max-width:320px;opacity:.75;font-size:13px">' + String(msg).replace(/[<>&]/g, '') + '</div>';
      function btn(t, bg, go) { var b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:800 17px -apple-system,system-ui,sans-serif;padding:13px 24px;border-radius:14px;border:0;color:#fff;background:' + bg; b.onclick = go; d.appendChild(b); }
      btn('Start fresh', '#5a54f0', function () { try { localStorage.removeItem('links.game'); } catch (e) { /* ignore */ } location.reload(); });
      btn('All games', '#6b7080', function () { location.href = '../../'; });
      document.body.appendChild(d);
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  }
  window.addEventListener('error', function (e) { fail((e.message || 'Something went wrong') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__clReady) fail('It took too long to start.'); }, 8000);
})();
</script>
<title>Color Link</title>
<style>
/* Color Link: a calm dark night-blue screen edge to edge so the pipe colors glow; the board fills the width, counters
   above it, the tool buttons below it within thumb reach. */
html, body { height: 100%; }
body { background: radial-gradient(120% 80% at 50% 0%, #262b55 0%, #171a35 55%, #10122a 100%) fixed; background-color: #151830; overflow: hidden; }
html.gg-fs-over .app { position: relative; z-index: 1; height: 100%; gap: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 56px) calc(env(safe-area-inset-right, 0px) + 8px) calc(env(safe-area-inset-bottom, 0px) + 8px) calc(env(safe-area-inset-left, 0px) + 8px); }

/* pack + level pill in the middle of the top row (tap: the level list) */
.clhud { position: fixed; z-index: 7; top: calc(env(safe-area-inset-top, 0px) + 6px); left: 60px; right: 60px; height: 44px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.clhud .ggpill { pointer-events: auto; font: inherit; font-size: 16px; font-weight: 800; padding: 8px 14px; border: 0; color: var(--ink); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.clhud .ggpill .st { color: #f5b301; margin-left: 4px; }

/* flows, moves, filled */
.counters { display: flex; justify-content: center; gap: 8px; margin: 4px 0 6px; flex: none; }
.cnt { min-width: 84px; padding: 6px 10px 5px; border-radius: 14px; background: rgba(255,255,255,.08); color: #fff; text-align: center; line-height: 1.1; }
.cnt b { display: block; font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.cnt span { font-size: 11px; font-weight: 700; color: #aab0d8; text-transform: uppercase; letter-spacing: .4px; }
.cnt.good b { color: #7dffa8; }

/* the board */
.boardarea { flex: 1; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; touch-action: none; }
#cv { display: block; touch-action: none; -webkit-user-select: none; user-select: none; }

/* tools */
.toolbar { flex: none; display: flex; justify-content: center; gap: 6px; padding-top: 6px; }
.tbtn { flex: 1; max-width: 86px; height: 60px; border: 0; border-radius: 18px; background: rgba(255,255,255,.10); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font: inherit; font-size: 12px; font-weight: 700; -webkit-tap-highlight-color: transparent; }
.tbtn svg { width: 24px; height: 24px; }
.tbtn:active { transform: scale(.95); background: rgba(255,255,255,.18); }
.tbtn:disabled { opacity: .35; }
.tbtn.glow { background: rgba(255,207,61,.22); color: #ffe27a; }

.toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); max-width: 86vw; text-align: center; pointer-events: none; z-index: 8;
  opacity: 0; transition: opacity .2s; background: rgba(10,12,30,.9); color: #fff; font-weight: 700; font-size: 16px; line-height: 1.3; padding: 11px 16px; border-radius: 14px; }
.toast.show { opacity: 1; }

/* level list */
.packtabs { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 2px 0 10px; flex: none; scrollbar-width: none; }
.packtabs::-webkit-scrollbar { display: none; }
.packtabs button { flex: none; border: 0; border-radius: 14px; padding: 7px 12px 6px; background: var(--surface-2); color: var(--ink); font: inherit; font-weight: 800; font-size: 15px; line-height: 1.15; text-align: center; }
.packtabs button small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); }
.packtabs button.on { background: var(--accent); color: #fff; }
.packtabs button.on small { color: rgba(255,255,255,.85); }
.packnote { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
.lvgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; padding-bottom: 6px; }
.lvgrid button { position: relative; aspect-ratio: 1; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--ink); font: inherit; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.lvgrid button.done { background: #d9f5e3; color: #17733f; }
.lvgrid button.perfect { background: #fff1c2; color: #8a5d00; }
.lvgrid button.perfect::after { content: "★"; position: absolute; top: 1px; right: 4px; font-size: 11px; color: #f5b301; }
.lvgrid button.cur { box-shadow: inset 0 0 0 3px var(--accent); }
@media (prefers-color-scheme: dark) { .lvgrid button.done { background: #1f4d33; color: #a8f0c4; } .lvgrid button.perfect { background: #53420f; color: #ffe08a; } }

/* stats */
.packrow { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
.packrow .bar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; display: flex; }
.packrow .bar i { display: block; height: 100%; }
.packrow .bar i.d { background: #3fd27a; }
.packrow .bar i.p { background: #f5b301; }
.packrow small { color: var(--muted); font-variant-numeric: tabular-nums; }
.stnote { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }

.endstars { font-size: 34px; color: #f5b301; letter-spacing: 4px; line-height: 1; margin: -2px 0 6px; }
.endstars i { font-style: normal; color: #d7dbe6; }
</style>

<div class="app" id="app">
  <div class="top">
    <button class="brand homebtn" id="btnHome" aria-label="Back to all games">
      <span class="chev" aria-hidden="true">&#8249;</span>
      <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#cl-logo"/></svg>
      <h1>Color Link</h1>
    </button>
    <div class="topbtns">
      <button class="iconbtn" id="btnLevels" aria-label="Levels"><svg viewBox="0 0 24 24"><use href="#i-levels"/></svg></button>
      <button class="iconbtn" id="btnStats" aria-label="Stats"><svg viewBox="0 0 24 24"><use href="#i-stats"/></svg></button>
      <button class="iconbtn" id="btnHelp" aria-label="How to play"><svg viewBox="0 0 24 24"><use href="#i-help"/></svg></button>
      <button class="iconbtn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
    </div>
  </div>

  <!-- the pack and level, tappable: opens the level list -->
  <div class="clhud"><button class="ggpill lvpill" id="lvPill">5×5 · Level 1</button></div>

  <div class="counters">
    <div class="cnt"><b id="cFlows">0/0</b><span>flows</span></div>
    <div class="cnt"><b id="cMoves">0</b><span id="cMovesL">moves</span></div>
    <div class="cnt"><b id="cPipe">0%</b><span>filled</span></div>
  </div>

  <div class="boardarea" id="boardarea"><canvas id="cv"></canvas></div>

  <div class="toolbar">
    <button class="tbtn" id="btnPrev" aria-label="Previous level"><svg viewBox="0 0 24 24"><use href="#i-prev"/></svg><span>Back</span></button>
    <button class="tbtn" id="btnUndo" aria-label="Undo"><svg viewBox="0 0 24 24"><use href="#i-undo"/></svg><span>Undo</span></button>
    <button class="tbtn" id="btnHint" aria-label="Hint"><svg viewBox="0 0 24 24"><use href="#i-hint"/></svg><span>Hint</span></button>
    <button class="tbtn" id="btnRestart" aria-label="Clear the board"><svg viewBox="0 0 24 24"><use href="#i-restart"/></svg><span>Clear</span></button>
    <button class="tbtn" id="btnNext" aria-label="Next level"><svg viewBox="0 0 24 24"><use href="#i-next"/></svg><span>Next</span></button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<!-- Levels: packs by board size, 150 levels each -->
<div class="overlay" id="ovLevels">
  <div class="sheet" role="dialog" aria-label="Levels">
    <h2>Levels</h2>
    <div class="packtabs" id="packTabs"></div>
    <div class="sheetbody"><p class="packnote" id="packNote"></p><div class="lvgrid" id="lvGrid"></div></div>
    <div class="actions"><button class="btn red" id="btnCloseLevels">Done</button></div>
  </div>
</div>

<!-- Stats -->
<div class="overlay" id="ovStats">
  <div class="sheet" role="dialog" aria-label="Stats">
    <h2>Your Color Link records</h2>
    <div class="sheetbody" id="statsBody"></div>
    <div class="actions"><button class="btn red" id="btnCloseStats">Done</button></div>
  </div>
</div>

<!-- Settings -->
<div class="overlay" id="ovSettings">
  <div class="sheet" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <div class="sheetbody">
      <label class="row"><div>Sound<small>Soft plinks as pipes connect.</small></div>
        <span class="switch"><input type="checkbox" id="setSound"><span></span></span></label>
      <label class="row"><div>Letters on the dots<small>Each pair also gets a letter, if two colors look alike.</small></div>
        <span class="switch"><input type="checkbox" id="setLetters"><span></span></span></label>
      <label class="row"><div>Old-time ads<small>Joke ads between levels. This switch is shared by all Goobs-Games.</small></div>
        <span class="switch"><input type="checkbox" id="setAds"><span></span></span></label>
      <div class="row" id="rowAdEvery"><div>Show an ad every<small>Counted in finished levels.</small></div>
        <div class="stepper"><button id="adLess" aria-label="Fewer">&minus;</button><b id="adEvery">3</b><button id="adMore" aria-label="More">+</button></div></div>
      <div class="version" id="version">Color Link</div>
    </div>
    <div class="actions"><button class="btn red" id="btnCloseSettings">Done</button></div>
  </div>
</div>

<!-- How to play -->
<div class="overlay" id="ovHelp">
  <div class="sheet" role="dialog" aria-label="How to play">
    <h2>How to play Color Link</h2>
    <div class="sheetbody"><ol class="helplist" id="helpList"></ol></div>
    <div class="actions"><button class="btn red" id="btnCloseHelp">Let's play</button></div>
  </div>
</div>

<!-- Level finished -->
<div class="overlay center" id="ovEnd">
  <div class="card" role="dialog">
    <div class="cardicon" id="endIcon"><svg viewBox="0 0 100 100"><use href="#cl-logo"/></svg></div>
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <div class="actions" id="endActions"></div>
  </div>
</div>

    });
    // the drawing head: a soft halo so a finger can see where the pipe is
    if (drag && drag.cur.length) {
      var hc = ctr(drag.cur[drag.cur.length - 1]);
      cx.beginPath(); cx.arc(hc[0], hc[1], cs * 0.7, 0, Math.PI * 2); cx.fillStyle = hexA(L.color[drag.k], 0.22); cx.fill();
    }
    // the dots
    for (var k = 0; k < L.K; k++) {
      var done2 = complete(k, g.paths[k]);
      L.ends[k].forEach(function (v) {
        var c = ctr(v);
        if (done2) { cx.beginPath(); cx.arc(c[0], c[1], cs * 0.44, 0, Math.PI * 2); cx.fillStyle = hexA(L.color[k], 0.28 + gl * 0.4); cx.fill(); }
        cx.beginPath(); cx.arc(c[0], c[1], cs * 0.34, 0, Math.PI * 2); cx.fillStyle = L.color[k]; cx.fill();
        cx.beginPath(); cx.arc(c[0] - cs * 0.09, c[1] - cs * 0.1, cs * 0.12, 0, Math.PI * 2); cx.fillStyle = 'rgba(255,255,255,.28)'; cx.fill();
        if (g.hinted[k]) { cx.beginPath(); cx.arc(c[0], c[1], cs * 0.2, 0, Math.PI * 2); cx.strokeStyle = 'rgba(255,255,255,.85)'; cx.lineWidth = Math.max(1.5, cs * 0.05); cx.stroke(); }
        if (settings.letters) {
          cx.fillStyle = 'rgba(10,12,30,.78)'; cx.font = '800 ' + Math.round(cs * 0.36) + 'px -apple-system, system-ui, sans-serif';
          cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(LET[k], c[0], c[1] + 1);
        }
      });
    }
    if (winAnim && now - winAnim < 900) requestAnimationFrame(draw);
  }
  function renderHud() {
    var st = progOf(g.n).charAt(g.i);
    $('lvPill').innerHTML = PACKNAME[g.n] + ' ' + g.n + '×' + g.n + ' · ' + (g.i + 1) + (st === '2' ? '<span class="st">★</span>' : st === '1' ? '<span class="st" style="color:#3fd27a">✓</span>' : '');
    var fd = flowsDone(), pct = Math.floor(filled() * 100 / (L.n * L.n));
    $('cFlows').textContent = fd + '/' + L.K;
    $('cFlows').parentNode.classList.toggle('good', fd === L.K);
    $('cMoves').textContent = g.moves;
    $('cMovesL').textContent = 'moves · ★ ' + L.K;
    $('cPipe').textContent = pct + '%';
    $('cPipe').parentNode.classList.toggle('good', pct === 100);
    $('btnUndo').disabled = !g.undo.length || g.won;
    $('btnRestart').disabled = g.won || !g.paths.some(function (p) { return p.length; });
    $('btnHint').disabled = g.won;
  }
  function renderAll() { renderHud(); draw(); }

  // ================= drawing pipes with a finger =================
  // drag: { k, cur (the pipe being drawn), snap (all pipes when the finger went down), cut (squares cut so far), linked }
  // Every step rebuilds the board from snap: the pipe being drawn wins, any other pipe it crosses is cut back to the
  // part before the crossing, and comes back whole if the finger backs off again before lifting.
  var drag = null, lastPt = null;
  function cellAt(x, y) {
    var r = cv.getBoundingClientRect(), c = Math.floor((x - r.left) / cs), w = Math.floor((y - r.top) / cs);
    if (c < 0 || w < 0 || c >= L.n || w >= L.n) return -1;
    return w * L.n + c;
  }
  function apply() {
    var set = {}; drag.cur.forEach(function (v) { set[v] = 1; });
    var p = clonePaths(drag.snap), cut = 0;
    p[drag.k] = drag.cur.slice();
    p.forEach(function (q, j) {
      if (j === drag.k) return;
      for (var t = 0; t < q.length; t++) if (set[q[t]]) { cut += q.length - t; q.length = t; break; }
      if (q.length < 2) q.length = 0;
    });
    if (cut > drag.cut) S.cut();
    drag.cut = cut;
    g.paths = p;
    var now = complete(drag.k, drag.cur);
    if (now && !drag.linked) S.connect(drag.k);
    drag.linked = now;
    renderAll();
  }
  function stepTo(w) {
    var cur = drag.cur, k = drag.k, head = cur[cur.length - 1], i = cur.indexOf(w);
    if (i >= 0) { if (i < cur.length - 1) { cur.length = i + 1; S.tick(i); apply(); } return true; }
    if (!adj(L.n, head, w)) return false;
    if (complete(k, cur)) return false;              // linked: going on needs backing off first
    var d = L.dotAt[w];
    if (d && d !== k + 1) return false;              // another color's dot blocks the way
    cur.push(w); S.tick(cur.length); apply();
    return true;
  }
  // a finger can skip squares on a fast swipe: walk there one square at a time (straight lines first)
  function walkTo(w) {
    var guard = 0;
    while (drag && guard++ < 40) {
      var head = drag.cur[drag.cur.length - 1];
      if (head === w || drag.cur.indexOf(w) >= 0 || adj(L.n, head, w)) { stepTo(w); return; }
      var n = L.n, hr = (head / n) | 0, hc = head % n, wr = (w / n) | 0, wc = w % n;
      var vert = wr !== hr ? head + (wr > hr ? n : -n) : -1, horz = wc !== hc ? head + (wc > hc ? 1 : -1) : -1;
      // cutting a corner: keep going the way the pipe was going, then turn (that's how a finger rounds a bend);
      // on a straight jump there is only one way
      var prev = drag.cur.length > 1 ? drag.cur[drag.cur.length - 2] : -1, wasVert = prev >= 0 && Math.abs(head - prev) === n;
      var order = vert < 0 ? [horz] : horz < 0 ? [vert] : prev < 0 ? (Math.abs(wr - hr) >= Math.abs(wc - hc) ? [vert, horz] : [horz, vert]) : (wasVert ? [vert, horz] : [horz, vert]);
      var moved = false;
      for (var j = 0; j < order.length && !moved; j++) {
        var nx = order[j], len = drag.cur.length;
        if (L.dotAt[nx] && L.dotAt[nx] !== drag.k + 1 && order.length > 1) continue;
        moved = stepTo(nx) && drag.cur.length > len;
      }
      if (!moved) return;
    }
  }
  function onDown(e) {
    if (!g || g.won || sheetOpen()) return;
    S.unlock();
    var v = cellAt(e.clientX, e.clientY); if (v < 0) return;
    var k = -1, cur = null, d = L.dotAt[v];
    if (d) { k = d - 1; cur = [v]; }                 // from a dot: a fresh pipe from here
    else {
      var o = occupancy(); if (o[v] === undefined) return;
      k = o[v]; cur = g.paths[k].slice(0, g.paths[k].indexOf(v) + 1);   // from a pipe: pick it up where you touch
    }
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
    e.preventDefault();
    drag = { k: k, cur: cur, snap: clonePaths(g.paths), cut: 0, linked: complete(k, cur) };
    lastPt = [e.clientX, e.clientY];
    apply();
  }
  function onMove(e) {
    if (!drag) return;
    // sample the finger's way in small steps so no square is skipped
    var x0 = lastPt[0], y0 = lastPt[1], x1 = e.clientX, y1 = e.clientY, dist = Math.hypot(x1 - x0, y1 - y0), steps = Math.max(1, Math.ceil(dist / (cs * 0.3)));
    for (var s = 1; s <= steps && drag; s++) {
      var v = cellAt(x0 + (x1 - x0) * s / steps, y0 + (y1 - y0) * s / steps);
      if (v >= 0 && v !== drag.cur[drag.cur.length - 1]) walkTo(v);
    }
    lastPt = [x1, y1];
  }
  function onUp() {
    if (!drag) return;
    var d = drag; drag = null;
    g.paths = g.paths.map(function (p) { return p.length < 2 ? [] : p; });
    if (JSON.stringify(g.paths) !== JSON.stringify(d.snap.map(function (p) { return p.length < 2 ? [] : p; }))) {
      g.undo.push({ paths: d.snap, moves: g.moves, last: g.last });
      if (g.undo.length > 60) g.undo.shift();
      if (d.k !== g.last) { g.moves++; g.last = d.k; }
    }
    renderAll(); save();
    checkWin();
  }

  // ================= finishing =================
  function checkWin() {
    var all = flowsDone() === L.K, full = filled() === L.n * L.n;
    if (all && full) { win(); return; }
    if (all && !full && !g.nagged) { g.nagged = true; S.full(); toast('Every pair is linked! Now fill <b>every</b> square.', 2600); save(); }
  }
  function win() {
    g.won = true; winAnim = performance.now();
    var perfect = !g.usedHint && g.moves <= L.K, packWas = countProg(g.n, '1');
    setProg(g.n, g.i, perfect ? '2' : '1');
    meta.wins++; meta.finished++; saveMeta(); save();
    S.win(); if (perfect) S.perfect();
    renderAll();
    var n = g.n, i = g.i, packDone = packWas < PER && countProg(n, '1') === PER;
    setTimeout(function () {
      if (!g || g.n !== n || g.i !== i) return;
      var nx = nextOf(n, i), text = L.K + ' pairs in ' + g.moves + ' move' + (g.moves === 1 ? '' : 's');
      if (perfect) text += '. As few moves as pairs: a star!';
      else if (g.usedHint) text += ' (with a hint).';
      else text += '. Do it in ' + L.K + ' for a star.';
      if (packDone) text += '<br><b>' + PACKNAME[n] + ' ' + n + '×' + n + ' all ' + PER + ' solved!</b>';
      showCard(perfect ? 'Perfect!' : ['Linked!', 'Nice flow!', 'Well done!', 'All filled!', 'Lovely!'][i % 5], text, perfect, [
        { label: (nx[0] !== n ? PACKNAME[nx[0]] + ' ' + nx[0] + '×' + nx[0] + ' · ' : 'Level ') + (nx[1] + 1), red: true, go: function () { between(function () { startLevel(nx[0], nx[1]); }); } },
        { label: 'Levels', go: function () { openLevels(); } }
      ]);
    }, 900);
  }
  function showCard(title, html, star, buttons) {
    $('endTitle').textContent = title;
    $('endText').innerHTML = (star ? '<div class="endstars">★</div>' : '') + html;
    var box = $('endActions'); box.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button'); el.className = 'btn' + (b.red ? ' red' : ''); el.textContent = b.label;
      el.addEventListener('click', function () { $('ovEnd').classList.remove('show'); b.go(); });
      box.appendChild(el);
    });
    $('ovEnd').classList.add('show');
  }
  // a house ad between levels only, every few finished levels
  function between(next) {
    var f = meta.finished;
    if (Goobs.adsOn() && f > 0 && f % settings.adEvery === 0 && meta.lastAdAt !== f) { meta.lastAdAt = f; saveMeta(); next(); GoobsAds.show({}, function () {}); return; }
    next();
  }

  // ================= tools =================
  function undo() {
    if (!g.undo.length || g.won) return;
    var u = g.undo.pop(); g.paths = u.paths.map(function (p) { return p.length < 2 ? [] : p; }); g.moves = u.moves; g.last = u.last;
    S.undo(); renderAll(); save();
  }
  function clearBoard() {
    if (g.won || !g.paths.some(function (p) { return p.length; })) return;
    g.undo.push({ paths: clonePaths(g.paths), moves: g.moves, last: g.last });
    g.paths = L.sol.map(function () { return []; }); g.moves = 0; g.last = -1; g.nagged = false;
    S.undo(); renderAll(); save();
  }
  function samePath(a, b) { return a.length === b.length && (a.join() === b.join() || a.slice().reverse().join() === b.join()); }
  // a hint lays one pair's pipe exactly as in the answer (the longest one you haven't got right yet)
  function hint() {
    if (g.won) return;
    var best = -1;
    for (var k = 0; k < L.K; k++) if (!samePath(g.paths[k], L.sol[k]) && (best < 0 || L.sol[k].length > L.sol[best].length)) best = k;
    if (best < 0) { toast('Every pipe is already right!'); return; }
    var p = L.sol[best].slice();
    if (g.paths[best].length && g.paths[best][0] === p[p.length - 1]) p.reverse();
    g.undo.push({ paths: clonePaths(g.paths), moves: g.moves, last: g.last });
    drag = { k: best, cur: p, snap: clonePaths(g.paths), cut: 0, linked: false };
    apply(); drag = null;
    g.paths = g.paths.map(function (q) { return q.length < 2 ? [] : q; });
    g.hinted[best] = 1; g.usedHint = true; meta.hints++; saveMeta();
    S.hint(); renderAll(); save();
    checkWin();
  }
  function go(dir) {
    var n = g.n, i = g.i + dir;
    if (i < 0) { var si = SIZES.indexOf(n); if (si === 0) return; n = SIZES[si - 1]; i = PER - 1; }
    else if (i >= PER) { var sj = SIZES.indexOf(n); if (sj === SIZES.length - 1) return; n = SIZES[sj + 1]; i = 0; }
    startLevel(n, i);
  }

  // ================= sheets =================
  var listSize = 5;
  function openLevels() { listSize = g.n; renderLevels(); $('ovLevels').classList.add('show'); var c = $('lvGrid').querySelector('.cur'); if (c) setTimeout(function () { c.scrollIntoView({ block: 'center' }); }, 30); }
  function renderLevels() {
    $('packTabs').innerHTML = SIZES.map(function (n) { return '<button data-n="' + n + '" class="' + (n === listSize ? 'on' : '') + '">' + n + '×' + n + '<small>' + countProg(n, '1') + '/' + PER + '</small></button>'; }).join('');
    var s = progOf(listSize), h = '';
    for (var i = 0; i < PER; i++) { var c = s.charAt(i); h += '<button data-i="' + i + '" class="' + (c === '2' ? 'perfect' : c === '1' ? 'done' : '') + (g && g.n === listSize && g.i === i ? ' cur' : '') + '">' + (i + 1) + '</button>'; }
    $('lvGrid').innerHTML = h;
    $('packNote').innerHTML = '<b>' + PACKNAME[listSize] + ' ' + listSize + '×' + listSize + '</b>: ' + countProg(listSize, '1') + ' solved, ' + countProg(listSize, '2') + ' with a star. Early levels have more pairs (shorter pipes); later ones fewer, longer and windier.';
  }
  function openStats() {
    var solved = 0, perfect = 0, rows = '';
    SIZES.forEach(function (n) {
      var d = countProg(n, '1'), p = countProg(n, '2'); solved += d; perfect += p;
      rows += '<div class="packrow"><span>' + n + '×' + n + '</span><div class="bar"><i class="p" style="width:' + (p / PER * 100) + '%"></i><i class="d" style="width:' + ((d - p) / PER * 100) + '%"></i></div><small>' + d + '/' + PER + '</small></div>';
    });
    $('statsBody').innerHTML = '<div class="tiles"><div class="tile"><b>' + solved + '</b><span>solved of ' + (PER * SIZES.length).toLocaleString() + '</span></div><div class="tile"><b>' + perfect + '</b><span>with a star</span></div><div class="tile"><b>' + meta.hints + '</b><span>hints used</span></div></div>' +
      '<p class="stnote">Gold: solved with a star (as few moves as pairs, no hint). Green: solved.</p>' + rows;
    $('ovStats').classList.add('show');
  }
  function openHelp() {
    $('helpList').innerHTML = [
      '<b>Drag</b> from a dot to the other dot of the same color to lay a pipe between them.',
      'Link <b>every</b> pair and fill <b>every</b> square to finish. Pipes can’t cross or branch. Each level has exactly one answer.',
      'Drawing over another pipe cuts it back; back off before lifting your finger and it comes back. Touch a pipe anywhere to pick it up from there.',
      '<b>Moves</b>: each time you draw a different pair than last time. Finish in as few moves as there are pairs (no hint) for a <b>star</b>.',
      '<b>Undo</b> steps back, <b>Clear</b> empties the board, <b>Hint</b> lays one pipe for you (the dots get a white ring). <b>Back</b> and <b>Next</b> change level.',
      'Tap the level name at the top for all 1,200 levels: eight packs from 5×5 to 12×12, 150 each. Everything is open; play in any order.',
      'Works offline. Your progress and the board you’re on are saved.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('ovHelp').classList.add('show');
  }
  function syncSettings() {
    $('setSound').checked = settings.sound; $('setLetters').checked = settings.letters; $('setAds').checked = Goobs.adsOn(); $('adEvery').textContent = settings.adEvery;
    $('rowAdEvery').classList.toggle('off', !Goobs.adsOn());
  }
  function sheet(btn, ov, close, before) {
    $(btn).addEventListener('click', function () { if (before) before(); else $(ov).classList.add('show'); });
    $(close).addEventListener('click', function () { $(ov).classList.remove('show'); });
    $(ov).addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  }

  // ================= start =================
  function init() {
    cv = $('cv'); cx = cv.getContext('2d');
    Goobs.fullscreen({ overlay: true, menu: ['btnLevels', 'btnStats', 'btnHelp', 'btnSettings'], info: function () {
      if (!g) return '';
      return '<b>' + PACKNAME[g.n] + ' ' + g.n + '×' + g.n + '</b> · level ' + (g.i + 1) + ' · ' + flowsDone() + ' of ' + L.K + ' pairs';
    } });
    cv.addEventListener('pointerdown', onDown); cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp); cv.addEventListener('lostpointercapture', onUp);
    cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    $('boardarea').addEventListener('touchmove', function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
    $('btnUndo').addEventListener('click', undo);
    $('btnRestart').addEventListener('click', clearBoard);
    $('btnHint').addEventListener('click', hint);
    $('btnPrev').addEventListener('click', function () { go(-1); });
    $('btnNext').addEventListener('click', function () { go(1); });
    $('lvPill').addEventListener('click', openLevels);
    $('btnHome').addEventListener('click', function () { save(); saveMeta(); Goobs.home(); });
    sheet('btnLevels', 'ovLevels', 'btnCloseLevels', openLevels);
    sheet('btnStats', 'ovStats', 'btnCloseStats', openStats);
    sheet('btnHelp', 'ovHelp', 'btnCloseHelp', openHelp);
    sheet('btnSettings', 'ovSettings', 'btnCloseSettings', function () { syncSettings(); $('ovSettings').classList.add('show'); });
    $('packTabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; listSize = +b.dataset.n; renderLevels(); $('lvGrid').parentNode.scrollTop = 0; });
    $('lvGrid').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; $('ovLevels').classList.remove('show'); $('ovEnd').classList.remove('show'); startLevel(listSize, +b.dataset.i); });
    $('setSound').addEventListener('change', function () { settings.sound = this.checked; saveSettings(); S.set(settings.sound); S.connect(2); });
    $('setLetters').addEventListener('change', function () { settings.letters = this.checked; saveSettings(); draw(); });
    $('setAds').addEventListener('change', function () { Goobs.setAds(this.checked); syncSettings(); });
    $('adLess').addEventListener('click', function () { settings.adEvery = Math.max(1, settings.adEvery - 1); saveSettings(); syncSettings(); });
    $('adMore').addEventListener('click', function () { settings.adEvery = Math.min(10, settings.adEvery + 1); saveSettings(); syncSettings(); });
    S.set(settings.sound);
    var rq = 0; function refit() { if (rq) return; rq = requestAnimationFrame(function () { rq = 0; if (L) layout(); }); }
    window.addEventListener('resize', refit); if (window.ResizeObserver) new ResizeObserver(refit).observe($('boardarea'));
    document.addEventListener('visibilitychange', function () { if (document.hidden) { save(); saveMeta(); } });
    window.addEventListener('pagehide', function () { save(); saveMeta(); });
    // instant play: the board you were on, else the next unsolved level from where you were
    try {
      if (load() && !g.won) { layout(); renderAll(); }
      else {
        var n = meta.size, i = meta.idx;
        if (progOf(n).charAt(i) !== '0') { var nx = nextOf(n, i); n = nx[0]; i = nx[1]; }
        startLevel(n, i);
      }
    } catch (e) { store.del('game'); startLevel(SIZES[0], 0); } // a bad save never keeps the game from opening
    if (!meta.seen) { meta.seen = true; saveMeta(); setTimeout(function () { toast('Drag from a dot to its twin.<br>Fill every square!', 3000); }, 600); }
    Goobs.markPlayed('links');
    Goobs.initUpdates({ beforeReload: function () { save(); saveMeta(); }, onVersions: function (v) { $('version').textContent = 'Color Link ' + (v.links || '?') + ' · Goobs-Games ' + (v.shell || '?'); } });
    window.__clReady = true;
  }
  init();

  // test hook (Playwright): the level, the board, where each square is on screen
  window.__cl = { get g() { return g; }, get L() { return L; }, meta: meta, startLevel: startLevel, hint: hint, undo: undo,
    center: function (v) { var r = cv.getBoundingClientRect(), c = ctr(v); return { x: r.left + c[0], y: r.top + c[1] }; },
    nextOf: nextOf, progOf: progOf };
})();
</script>
</body>
